    var nb = Math.ceil((plusJours(fin, 1) - debut) / 86400000 / 7) * 7;

    var h = barreCal(premier.toLocaleDateString("fr-FR", { month:"long", year:"numeric" }));
    h += '<div class="grille">';
    JOURS_SEM.forEach(function(d){ h += '<div class="cal-jh">' + d + '</div>'; });
    for(var i = 0; i < nb; i++){
      var d = plusJours(debut, i), k = iso(d);
      var dedans = d.getMonth() === r.getMonth();
      var liste = m[k] || [];
      h += '<div class="case' + (dedans ? "" : " hors") + (memeJour(d, auj) ? " auj" : "") + '">'
         + '<div class="num">' + d.getDate() + '</div>';
      liste.slice(0, 3).forEach(function(x){ h += evenement(x, false); });
      if(liste.length > 3) h += '<div class="plus">+' + (liste.length - 3) + '</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '<p class="legende">Cliquez sur une journée pour ouvrir sa fiche. '
       + 'La couleur suit le statut du projet.' + legendeOutlook() + '</p>';
    return h;
  }

  function vueSemaine(){
    var r = refCal(), m = parJour(), auj = midi(new Date());
    var debut = lundi(r), fin = plusJours(debut, 6);
    var meme = debut.getMonth() === fin.getMonth();
    var titre = debut.getDate() + (meme ? "" : " " + debut.toLocaleDateString("fr-FR", { month:"long" }))
              + " – " + fin.getDate() + " " + fin.toLocaleDateString("fr-FR", { month:"long", year:"numeric" });

    var h = barreCal(titre) + '<div class="sem">';
    for(var i = 0; i < 7; i++){
      var d = plusJours(debut, i), k = iso(d), liste = m[k] || [];
      h += '<div class="ligne' + (memeJour(d, auj) ? " auj" : "") + (liste.length ? "" : " creux") + '">'
         + '<div class="j">' + esc(d.toLocaleDateString("fr-FR", { weekday:"long" })) + '<b>' + d.getDate() + '</b></div>'
         + '<div class="evs">';
      if(liste.length) liste.forEach(function(x){ h += evenement(x, true); });
      else h += '<span class="rien">—</span>';
      h += '</div></div>';
    }
    return h + '</div>';
  }

  function vueCalendrier(){
    if(!P.length && !OL.evs.length) return '<h2 class="sec">Calendrier</h2>' + vide("Aucun projet enregistré.");
    return CAL.mode === "semaine" ? vueSemaine() : vueMois();
  }

  function decaler(sens){
    var r = refCal();
    if(CAL.mode === "semaine") CAL.ref = plusJours(r, 7 * sens);
    else CAL.ref = new Date(r.getFullYear(), r.getMonth() + sens, 1, 12);
  }

  /* ---------- onglets ---------- */
  var ONGLETS = [
    { id:"avenir", nom:"À venir" },
    { id:"cal",    nom:"Calendrier" },
    { id:"planning", nom:"Tâches" },
    { id:"tous",   nom:"Projets" },
    { id:"reunion", nom:"Réunion" },
    { id:"contacts", nom:"Contacts" },
    { id:"new",    nom:"+ Nouveau projet" }
  ];
  /* KSF a son propre espace : ses rubriques prennent la place des onglets de la Régie. */
  var K_ONGLETS = [["semaine","Cette semaine"],["sujets","Sujets"],["production","Production"],["stats","Stats"]];
  var DERNIERE_REGIE = "avenir";
  function estKsfVue(){ return /^ksf/.test(VUE); }
  function rendreEspaces(){
    var el = document.getElementById("espaces"); if(!el) return;
    var ksf = estKsfVue(), late = KS.filter(function(p){ return kFlags(p).late; }).length;
    el.innerHTML = '<button class="espace" data-espace="regie"' + (ksf ? '' : ' aria-current="page"') + '>'
      + '<span class="dot"></span><h1>Régie</h1></button>'
      + '<button class="espace" data-espace="ksf" title="Kamel Sans Filtre"' + (ksf ? ' aria-current="page"' : '') + '>'
      + '<img src="ksf-logo.png" alt=""><span class="nm">KSF</span>'
      + (late ? '<span class="c" title="Publications en retard">' + late + '</span>' : '') + '</button>';
    document.getElementById("sousTitre").textContent = ksf ? "Kamel Sans Filtre" : "Studio by The Dots";
    document.body.classList.toggle("ksf", ksf);
    document.body.classList.toggle("studio", !ksf);
    document.title = ksf ? "KSF — Régie" : "Régie — Studio by The Dots";
    var hash = ksf ? "#ksf" : "";
    if((location.hash || "") !== hash){ try{ history.replaceState(null, "", location.pathname + location.search + hash); }catch(e){} }
    el.querySelectorAll("[data-espace]").forEach(function(b){
      b.addEventListener("click", function(){
        if(b.dataset.espace === "ksf"){ if(!estKsfVue()){ VUE = "ksf"; } else if(VUE !== "ksf-fiche"){ VUE = "ksf"; } }
        else { VUE = DERNIERE_REGIE || "avenir"; }
        rendre(); window.scrollTo(0,0);
      });
    });
  }
  function rendreTabs(){
    var h = "";
    rendreEspaces();
    if(estKsfVue()){
      K_ONGLETS.forEach(function(x){
        h += '<button class="tab" role="tab" data-ksftab="' + x[0] + '" aria-selected="'
           + (VUE === "ksf" && KSF.sous === x[0] ? "true" : "false") + '">' + esc(x[1]) + '</button>';
      });
      tabsEl.innerHTML = h;
      tabsEl.querySelectorAll("[data-ksftab]").forEach(function(b){
        b.addEventListener("click", function(){
          if(VUE === "ksf-fiche" && KSF.sale){ toast("Enregistrez ou quittez la fiche avant de changer de rubrique."); return; }
          KSF.sous = b.dataset.ksftab; VUE = "ksf"; rendre(); window.scrollTo(0,0);
        });
      });
      return;
    }
    if(["avenir","cal","planning","suivi","tous","reunion","contacts"].indexOf(VUE) >= 0) DERNIERE_REGIE = VUE;
    ONGLETS.forEach(function(o){
      var n = o.id === "planning" ? mesTaches().filter(function(t){ return t.statut !== "terminee" && tEnRetard(t); }).length
            : o.id === "avenir" ? P.filter(function(p){ return !!prochaine(p); }).length
            : o.id === "suivi"  ? P.filter(enCours).length
            : o.id === "tous"   ? P.length
            : o.id === "contacts" ? carnet().length : null;
      h += '<button class="tab' + (o.id === "new" ? ' nouveau' : '') + '" role="tab" data-vue="' + o.id + '"'
         + ' aria-selected="' + ((VUE === o.id || (VUE === "fiche" && o.id === (RETOUR || "avenir"))) ? "true" : "false") + '">'
         + esc(o.id === "planning" && !MOI ? "Tâches" : o.nom) + (n ? '<span class="c">' + n + '</span>' : '') + '</button>';
    });
    tabsEl.innerHTML = h;
    tabsEl.querySelectorAll("[data-vue]").forEach(function(b){
      b.addEventListener("click", function(){
        VUE = b.dataset.vue;
        if(VUE === "new"){ ID = null; BROUILLON = neufProjet(); MAT_FORM = false; SUP = null; }
        rendre(); window.scrollTo(0,0);
      });
    });
  }

  /* Le sélecteur « qui êtes-vous », et le filtre qui en découle. */
  function rendreMoi(){
    if(!moiEl) return;
    var noms = equipeConnue();
    var h = '<label for="i_moi">Vous êtes</label>'
      + '<select id="i_moi"><option value="">— toute l\'équipe —</option>';
    noms.forEach(function(n){
      h += '<option' + (n === MOI ? " selected" : "") + '>' + esc(n) + '</option>';
    });
    h += '</select>';
    if(MOI){
      var n = P.filter(surLeProjet).length;
      h += '<button type="button" class="bascule' + (MIENS ? " on" : "") + '" data-miens="1"'
         + ' aria-pressed="' + (MIENS ? "true" : "false") + '">'
         + (MIENS ? "Mes tournages" : "Voir mes tournages")
         + (n ? ' · ' + n : '') + '</button>';
    }
    moiEl.innerHTML = h;
    var sel = moiEl.querySelector("#i_moi");
    if(sel) sel.addEventListener("change", function(){
      MOI = sel.value;
      if(!MOI) MIENS = false;
      retenirMoi(); plCharger(true); rendre();
    });
    var bas = moiEl.querySelector("[data-miens]");
    if(bas) bas.addEventListener("click", function(){
      MIENS = !MIENS; retenirMoi(); rendre();
    });
  }

  /* ---------- cartes ---------- */
  function carteAVenir(p, j){
    var n = joursAvant(j.date), urgent = n != null && n >= 0 && n <= 2;
    var js = p.jours || [], tot = js.length, rang = js.indexOf(j) + 1;
    var lieu = j.lieu === "Notre studio" ? "Notre studio" : (j.adresse || j.lieu || "Lieu à préciser");
    return '<button class="card' + (urgent ? " urgent" : "") + '" data-id="' + esc(p.id) + '" data-jour="' + esc(j.id) + '">'
      + '<div class="l1"><span class="when">' + esc(plage(p)) + '</span>'
      + '<span class="cd">' + esc(compte(n)) + '</span></div>'
      + '<h3>' + esc(p.client || "Client à préciser") + '</h3>'
      + '<div class="sub">' + esc(p.projet || libType(p)) + '</div>'
      + '<div class="next"><b>' + (tot > 1 ? 'Prochaine journée · jour ' + rang + ' sur ' + tot : 'Journée de tournage') + '</b>'
      + esc(jourLong(j.date)) + (j.heureEquipe ? ', arrivée ' + esc(j.heureEquipe) : '')
      + ' — ' + esc(lieu)
      + (equipeDe(j).length ? '<span class="eqline">Avec ' + esc(equipeDe(j).join(", ")) + '</span>'
                            : '<span class="eqline vide">Personne d\'assigné</span>')
      + (decorDe(p) ? '<span class="eqline">' + miniDecor(decorDe(p)) + '</span>' : '') + '</div>'
      + '<div class="l3"><span class="pill ' + (CLASSE[p.statut] || "") + '">' + esc(libStatut(p, p.statut) || "") + '</span>'
      + '<span class="pill">' + esc(libType(p)) + '</span>'
      + (faitPhoto(p) ? '<span class="pill">' + esc(mediaDe(p)) + '</span>' : '')
      + alerte(p)
      + '</div></button>';
  }
  /* Pastille de rappel sur une carte. */
  function alerte(p){
    var c = controlesProjet(p);
    var v = c.filter(function(x){ return x.n === "vide"; }).length;
    var f = c.length - v;
    var h = "";
    if(v) h += '<span class="pill rouge">' + v + ' manque' + (v > 1 ? 's' : '') + '</span>';
    if(f) h += '<span class="pill orange">' + f + ' à confirmer</span>';
    var r = retoursOuverts(p);
    if(r) h += '<span class="pill retour">' + r + ' retour' + (r > 1 ? 's' : '') + ' à traiter</span>';
    return h;
  }
  function carteProjet(p){
    var tot = (p.jours || []).length;
    var quand = plage(p);
    if(apresTournage(p)){
      var dl = dateLivr(p), nl = joursAvant(dl);
      return '<button class="card" data-id="' + esc(p.id) + '">'
        + '<div class="l1"><span class="when">' + (photoSeule(p) ? 'Remise ' : 'Livraison ')
        + (dl ? esc(jourLong(dl)) : 'à fixer') + '</span>'
        + '<span class="cd">' + esc(nl != null ? compte(nl) : "") + '</span></div>'
        + '<h3>' + esc(p.client || "Client à préciser") + '</h3>'
        + '<div class="sub">' + esc(p.projet || "") + '</div>'
        + '<div class="next"><b>Tourné ' + esc(quand.toLowerCase()) + '</b>'
        + esc(p.livDuree ? "Durée visée " + p.livDuree + " · " : "") + esc(p.format || "")
        + (p.ssd ? ' — rushes : ' + esc(p.ssd) : '') + '</div>'
        + '<div class="l3"><span class="pill ' + (CLASSE[p.statut] || "") + '">' + esc(libStatut(p, p.statut) || "") + '</span>'
        + '<span class="pill">' + esc(libType(p)) + '</span>'
        + alerte(p)
        + '</div></button>';
    }
    return '<button class="card" data-id="' + esc(p.id) + '">'
      + '<div class="l1"><span class="when">' + esc(quand) + '</span>'
      + '<span class="jrs">' + tot + (tot > 1 ? " journées" : " journée") + '</span></div>'
      + '<h3>' + esc(p.client || "Client à préciser") + '</h3>'
      + '<div class="sub">' + esc(p.projet || "") + '</div>'
      + '<div class="l3"><span class="pill ' + (CLASSE[p.statut] || "") + '">' + esc(libStatut(p, p.statut) || "") + '</span>'
      + '<span class="pill">' + esc(libType(p)) + '</span>'
      + alerte(p)
      + '</div></button>';
  }
  function vide(t){ return '<div class="vide"><p>' + esc(t) + '</p></div>'; }

  /* ---------- vues ---------- */
  /* Ce qui tombe aujourd'hui et demain, mis en tête pour qu'on le voie
     sans avoir à chercher — avec ce qui manque encore sur ces journées. */
  function bandeauImminent(){
    var auj = iso(midi(new Date())), dem = iso(plusJours(new Date(), 1));
    var l = [];
    P.forEach(function(p){
      (p.jours || []).forEach(function(j){
        if(j.date !== auj && j.date !== dem) return;
        if(filtreActif() && !surLeJour(j)) return;
        l.push({ p:p, j:j, quand: j.date === auj ? "Aujourd'hui" : "Demain" });
      });
    });
    if(!l.length) return "";
    l.sort(function(a, b){
      return (a.j.date + (a.j.heureEquipe || "99")).localeCompare(b.j.date + (b.j.heureEquipe || "99"));
    });
    var trous = 0;
    var lignes = l.map(function(x){
      var c = controles(x.p, x.j);
      trous += c.filter(function(z){ return z.n === "vide"; }).length;
      var lieu = x.j.lieu === "Notre studio" ? "studio" : (x.j.adresse || "lieu à préciser");
      return '<li><b>' + esc(x.quand) + (x.j.heureEquipe ? " " + esc(x.j.heureEquipe) : "") + '</b> · '
        + esc(x.p.client || "Client à préciser") + ' — ' + esc(lieu)
        + (equipeDe(x.j).length ? ' · ' + esc(equipeDe(x.j).join(", "))
                                : ' · <span class="manque">personne d\'assigné</span>')
        + (c.length ? ' <span class="q">' + c.length + ' point' + (c.length > 1 ? 's' : '') + ' à régler</span>' : '')
        + '</li>';
    }).join("");
    return '<div class="imminent' + (trous ? " rouge" : "") + '">'
      + '<h3>' + l.length + (l.length > 1 ? ' journées' : ' journée') + ' dans les 48 heures</h3>'
      + '<ul>' + lignes + '</ul></div>';
  }

  function vueAvenir(){
    var lignes = [];
    P.forEach(function(p){
      var j = filtreActif()
        ? (p.jours || []).filter(function(x){
            var n = joursAvant(x.date);
            return surLeJour(x) && (n == null || n >= 0);
          }).sort(function(a, b){
            return String(a.date || "9999").localeCompare(String(b.date || "9999"));
          })[0]
        : prochaine(p);
      if(j) lignes.push({ p:p, j:j });
    });
    lignes.sort(function(a, b){ return String(a.j.date || "9999").localeCompare(String(b.j.date || "9999")); });
    return bandeauImminent()
      + '<h2 class="sec">' + (filtreActif() ? "Mes prochains tournages" : "Projets à venir") + '</h2>'
      + (lignes.length ? '<div class="cgrid">' + lignes.map(function(x){ return carteAVenir(x.p, x.j); }).join("") + '</div>'
         + '<div class="actions"><button class="btn" data-icsall="1">'
         + (filtreActif() ? "Mes journées dans mon calendrier" : "Tout le planning dans mon calendrier")
         + '</button></div>'
         : vide(filtreActif() ? "Aucune journée ne vous est assignée pour le moment."
                              : "Aucun projet à venir.")
           + '<div class="actions">'
           + (filtreActif() ? '<button class="btn" data-miensoff="1">Revoir tout le planning</button>'
                            : '<button class="btn lime" data-go="new">Créer un projet</button>')
           + '</div>');
  }
  function vueSuivi(){
    var s = P.filter(enCours).sort(parDebut);
    var pub = P.filter(function(p){ return p.statut === "Publié"; }).sort(parDebut).reverse().slice(0, 6);
    return '<h2 class="sec">En cours de post-production</h2>'
      + (s.length ? '<div class="cgrid">' + s.map(carteProjet).join("") + '</div>' : vide("Rien en post-production."))
      + (pub.length ? '<h2 class="sec">Derniers publiés</h2><div class="cgrid">' + pub.map(carteProjet).join("") + '</div>' : "");
  }
  /* Le carnet : un contact par ligne, modifiable, appelable, exportable. */
  function vueContacts(){
    var L = carnet();
    var tete = '<h2 class="sec">Contacts</h2>'
      + '<p class="legende" style="margin-bottom:12px;">Les contacts sur place remontent tout seuls '
      + 'des fiches de tournage ; vous pouvez les compléter, les corriger, et en ajouter d\'autres. '
      + '« Ajouter aux contacts » envoie la fiche dans l\'application Contacts de votre téléphone.</p>';
    if(!L.length) return tete + vide("Aucun contact pour l'instant.")
      + '<div class="actions"><button class="btn lime" data-ctnew="1">+ Nouveau contact</button></div>';
    var h = tete + '<div class="carnet">';
    L.forEach(function(c, i){
      var ou = c.src === "jour"
        ? esc(c.client || "") + (c.date ? ' · ' + esc(jourCourt(c.date)) : '')
        : (c.notes ? esc(c.notes.split("\n")[0]) : 'Fiche ajoutée à la main');
      h += '<div class="ct">'
        + '<div class="ctl"><b>' + esc(c.complet || "Sans nom") + '</b>'
        + '<span class="o">' + esc([c.fonction, c.societe].filter(Boolean).join(" — ")) + '</span>'
        + '<span class="d">' + ou + '</span>'
        + (c.mail ? '<span class="d"><a href="mailto:' + esc(c.mail) + '">' + esc(c.mail) + '</a></span>' : '')
        + '</div>'
        + '<div class="ctr">'
        + (c.tel ? '<a class="tel" href="tel:' + esc(telPropre(c.tel)) + '">' + esc(c.tel) + '</a>'
                 : '<span class="manque">numéro manquant</span>')
        + '<button class="btn" data-ctedit="' + i + '">Modifier</button>'
        + '<button class="btn" data-vcf="' + i + '">Ajouter aux contacts</button>'
        + '</div></div>';
    });
    return h + '</div>'
      + '<div class="actions"><button class="btn lime" data-ctnew="1">+ Nouveau contact</button>'
      + '<button class="btn" data-vcfall="1">Tout ajouter aux contacts</button></div>';
  }

  /* La fiche contact, la même qu'elle vienne d'un tournage ou du carnet. */
  function vueContact(){
    var c = CIBLE && CIBLE.ref ? ficheDe(CIBLE.ref) : null;
    var neuf = !c;
    if(neuf) c = { src:"libre", prenom:"", nom:"", societe:"", fonction:"", tel:"", mail:"", notes:"" };
    var lie = c.src === "jour";
    var h = '<h2 class="sec">' + (neuf ? "Nouveau contact" : "Modifier le contact") + '</h2>'
      + '<form id="form">';
    if(lie){
      h += '<div class="repri"><span>Ce contact est celui du tournage <b>'
        + esc(c.projet || c.client || "") + '</b>'
        + (c.date ? ', le ' + esc(jourCourt(c.date)) : '')
        + '. Ce que vous corrigez ici remonte dans la fiche du projet.</span></div>';
    }
    h += '<div class="blk">'
      + '<div class="row2">'
      + champ("Prénom", "prenom", c.prenom)
      + champ("Nom", "nom", c.nom)
      + '</div>'
      + champ("Entreprise", "societe", c.societe, "text",
              lie ? "Ce qui ira dans le champ Entreprise de la fiche contact. Par défaut, le nom du projet."
                  : "Ce qui ira dans le champ Entreprise de la fiche contact.")
      + champ("Fonction", "fonction", c.fonction)
      + '<div class="row2">'
      + champ("Téléphone", "tel", c.tel, "tel")
      + champ("E-mail", "mail", c.mail, "email")
      + '</div>'
      + (lie ? '' : zone("Notes", "notes", c.notes, "Ce que vous voulez retrouver plus tard."))
      + '</div>'
      + '<div class="actions"><button type="submit" class="btn lime">Enregistrer</button>'
      + '<button type="button" class="btn ghost" data-go="contacts">Annuler</button>'
      + (!neuf && !lie ? '<button type="button" class="btn danger" data-ctsup="1">Supprimer</button>' : '')
      + '</div></form>';
    return h;
  }

  /* ---------- Projets, rangés comme Tâches ----------
     À venir (tournage à venir), En cours (post-production), Passés (dates passées mais statut resté « Confirmé »),
     Terminés (publiés). Chaque carte a sa barre d'avancement, d'après le statut. */
  var PJ = { grp:"encours", sel:"" };
  var P_GRP = [
    { k:"avenir",  l:"À venir",  c:"#e9e43a" },
    { k:"encours", l:"En cours", c:"#9d8cff" },
    { k:"passe",   l:"Passés",   c:"#f08a4b" },
    { k:"termine", l:"Terminés", c:"#5fbf86" }
  ];
  var P_AV = { "Confirmé":10, "Tourné":35, "Montage":55, "En validation":80, "Publié":100 };
  function pAv(p){ return estMontage(p) && p.statut === "Confirmé" ? 15 : (P_AV[p.statut] || 0); }
  function pGroupe(p){
    if(p.statut === "Publié") return "termine";
    if(p.statut && p.statut !== "Confirmé") return "encours";
    return prochaine(p) ? "avenir" : (estMontage(p) ? "encours" : "passe");
  }
  function pDates(p){
    var js = (p.jours || []).map(function(j){ return j.date; }).filter(Boolean).sort();
    if(!js.length) return "Date à préciser";
    return js.length === 1 ? jourCourt(js[0]) : jourCourt(js[0]) + " → " + jourCourt(js[js.length - 1]);
  }
  function pListe(k){
    var l = P.filter(function(p){ return pGroupe(p) === k; });
    return k === "avenir" ? l.sort(parDebut) : l.sort(parDebut).reverse();
  }
  function pCarte(p){
    var av = pAv(p), ro = retoursOuverts(p), g = pGroupe(p);
    return '<button type="button" class="tk2' + ((PJ.sel === p.id && VUE === "tous") || (TV.psel === p.id && VUE === "planning") ? ' sel' : '') + '" ' + (VUE === "tous" ? 'data-psel' : VUE === "planning" ? 'data-tpsel' : 'data-id') + '="' + esc(p.id) + '">'
      + '<span class="tl"><span class="tt">' + esc(p.client || "Client à préciser") + (p.projet ? ' — ' + esc(p.projet) : '') + '</span>'
      + '<span class="ttag">' + esc(libType(p)) + '</span>'
      + (ro ? '<span class="tbadge late">' + ro + ' retour' + (ro > 1 ? 's' : '') + '</span>' : '')
      + (g === "passe" ? '<span class="tbadge late">Statut à mettre à jour</span>' : '') + '</span>'
      + '<span class="tm">' + (pJ(p) ? '<span class="tj ' + pJ(p).c + '">' + esc(pJ(p).t) + '</span>' : '') + '<span>' + esc(pDates(p)) + '</span>' + (pSansRetour(p) ? '<span class="tbadge late">À relancer</span>' : '')

  function lierProjets(){
    if(VUE !== "tous" && VUE !== "planning") return;
    function sur(sel, ev, f){ app.querySelectorAll(sel).forEach(function(el){ el.addEventListener(ev, function(e){ f(el, e); }); }); }
    sur("[data-pgrp]", "click", function(b){ PJ.grp = b.dataset.pgrp; PJ.sel = ""; rendre(); });
    sur("[data-psel]", "click", function(b){ PJ.sel = PJ.sel === b.dataset.psel ? "" : b.dataset.psel; rendre();
      var pan = app.querySelector(".tpan"); if(pan && window.innerWidth < 1100) pan.scrollIntoView({ behavior:"smooth", block:"start" }); });

    function maj(id, f){ var p = P.filter(function(x){ return x.id === id; })[0]; if(!p) return; var c = JSON.parse(JSON.stringify(p)); f(c); enregistrer(c, true); }
    sur("[data-pstat]", "click", function(b){
      maj(b.dataset.pid, function(c){ c.statut = b.dataset.pstat; }); toast("Statut : " + b.dataset.pstat + ".");

  /* ---------- les retours ----------
     Tout ce qui se dit sur un montage en cours, au même endroit :
     qui l'a demandé, quand, à quel timecode, et si c'est fait. */
  function retours(p){ return Array.isArray(p.retours) ? p.retours : []; }
  function retoursOuverts(p){
    return retours(p).filter(function(r){ return !r.fait; }).length;
  }
  function quandCourt(iso){
    var d = iso ? new Date(iso) : null;
    if(!d || isNaN(d)) return "";
    return d.toLocaleDateString("fr-FR", { day:"numeric", month:"short" })
         + " à " + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  }
  function blocRetours(p){
    var L = retours(p).slice().sort(function(a, b){
      return String(a.quand || "").localeCompare(String(b.quand || ""));
    });
    var ouverts = L.filter(function(r){ return !r.fait; }).length;

    var h = '<div class="blk"><h3>Retours'
      + (L.length ? ' — ' + (L.length - ouverts) + ' / ' + L.length + ' traités' : '') + '</h3>'
      + '<p class="kitmeta">Les demandes de modification sur le montage. '
      + 'Tout ce qui arrivait par mail ou par message se note ici, '
      + 'pour que le monteur ait une seule liste à suivre.</p>';

    if(!L.length){
      h += '<p class="rienl" style="color:var(--muted);">Aucun retour pour l\'instant.</p>';
    } else {
      h += '<div class="retours">';
      L.forEach(function(r){
        h += '<div class="ret' + (r.fait ? " fait" : "") + '">'
          + '<div class="rt">'
          + '<label class="chk mini' + (r.fait ? " on" : "") + '">'
          + '<input type="checkbox" data-ret="' + esc(r.id) + '"' + (r.fait ? " checked" : "") + '>'
          + '<span class="box"></span><span class="t">' + (r.fait ? "Traité" : "À faire") + '</span></label>'
          + (r.tc ? '<span class="tc">' + esc(r.tc) + '</span>' : '')
          + '<span class="sig">' + esc(r.qui || "—")
          + (r.quand ? ' · ' + esc(quandCourt(r.quand)) : '') + '</span>'
          + '<button type="button" class="lien" data-retsup="' + esc(r.id) + '">Supprimer</button>'
          + '</div>'
          + '<p class="rtx">' + val(r.texte) + '</p>'
          + '</div>';
      });
      h += '</div>';
    }

    h += '<div class="retadd">'
      + '<div class="f"><label for="i_rettc">Timecode <span class="hint">Facultatif : '
      + 'à quel moment du montage, par exemple 01:23.</span></label>'
      + '<input type="text" id="i_rettc" placeholder="01:23"></div>'
      + '<div class="f"><label for="i_rettexte">Le retour</label>'
      + '<textarea id="i_rettexte" placeholder="Couper le silence avant la réponse, remonter la musique…"></textarea></div>'
      + '<div class="actions"><button type="button" class="btn lime" data-retadd="1">Ajouter le retour</button>'
      + (MOI ? '<span class="sig">Signé ' + esc(MOI) + '</span>'
             : '<span class="sig manque">Choisissez votre nom en haut pour signer vos retours</span>')
      + '</div></div></div>';

      + '<div class="kv"><span class="k">Format</span><span class="v">' + esc(p.format || "—") + '</span></div>'
      + (!estMontage(p) && p.dispositif && p.dispositif !== "Sans objet"
          ? '<div class="kv"><span class="k">Dispositif image</span><span class="v">' + esc(p.dispositif) + '</span></div>' : '')
      + (estMontage(p) || !aInterview(p) ? ''
          : '<div class="kv"><span class="k">À l\'écran</span><span class="v">' + val(p.intervenants) + '</span></div>'
          + '<div class="kv"><span class="k">Qui interroge</span><span class="v">' + val(questionsAuto(p) || p.questions) + '</span></div>'
          + (p.nbPersonnes ? '<div class="kv"><span class="k">Personnes à l’écran</span><span class="v">' + esc(p.nbPersonnes) + '</span></div>' : ''))
      + (p.notes ? '<div class="kv"><span class="k">À savoir</span><span class="v">' + val(p.notes) + '</span></div>' : '')
      + '</div>';

    h += '<div class="blk"><h3>Où en est-on ?</h3><div class="steps">';
    statutsDe(p).forEach(function(s){
      h += '<button class="step' + (p.statut === s ? " on" : "") + '" data-statut="' + esc(s) + '">' + esc(libStatut(p, s)) + '</button>';
    });
    h += '</div>'
      + '<label class="tf pmotif"><span>Pourquoi ce statut' + (p.motifLe ? ' · noté le ' + esc(jourCourt(String(p.motifLe).slice(0, 10))) : '') + '</span>'
      + '<input type="text" data-pmotif="1" value="' + esc(p.motif || "") + '" placeholder="En attente du retour de… / bloqué par… / prêt à livrer"></label>'
      + blocLivraisonClient(p)
      + (!post && p.ssd ? '<div class="kv" style="margin-top:12px;"><span class="k">Rushes</span><span class="v">' + esc(p.ssd) + '</span></div>' : '')
      + (!post && p.validant ? '<div class="kv"><span class="k">Valide le montage</span><span class="v">' + esc(p.validant) + '</span></div>' : '')
      + '</div>';

    h += '<div class="actions">'
      + (post ? '' : '<button class="btn lime" data-terrain="1">Mode terrain</button>')
      + '<button class="btn" data-edit="1">Modifier le projet</button>'
      + (estMontage(p) ? '' : '<button class="btn" data-mat="1">Matériel</button>')
      + '<button class="btn" data-ics="1">Ajouter au calendrier</button>'
      + '<button class="btn danger" data-suppr="1">Supprimer</button></div>';
    return h;
  }

  /* ---------- reprise d'une demande client ----------
     Le formulaire de préparation envoie un récapitulatif par mail.
     Plutôt que de le recopier, on le colle ici : les champs reconnus
     remplissent le formulaire, le reste atterrit dans « À savoir ».
     Rien n'est enregistré tant que personne n'a relu et validé. */
  var TYPE_DEMANDE = [
    [/90\s*secondes?\s*outside/i, "90 secondes OUTSIDE"],
    [/expert\s*insights?/i,       "Expert insights"],
    [/podcast/i,                  "Podcast studio"],
    [/interview/i,                "Interview corporate"],
    [/captation|[ée]v[ée]nement/i,"Captation événement"],
    [/photo|shooting/i,           "Shooting photo"],
    [/vid[ée]o|film/i,            "Tournage vidéo"]
  ];
  function typeDepuis(txt){
    for(var i = 0; i < TYPE_DEMANDE.length; i++)
      if(TYPE_DEMANDE[i][0].test(txt)) return TYPE_DEMANDE[i][1];
    return null;
  }
  /* « Libellé : valeur » — le format du récapitulatif envoyé par le formulaire. */
  function lireDemande(txt){
    var champs = [];
    String(txt || "").split(/\r?\n/).forEach(function(l){
      var m = l.match(/^\s*(.+?)\s*:\s*(.+?)\s*$/);
      if(m && m[1].length < 80) champs.push({ k:m[1], v:m[2] });
    });
    function prendre(re){
      for(var i = 0; i < champs.length; i++)
        if(re.test(champs[i].k)) return champs[i].v;
      return "";
    }
    function toutes(re){
      return champs.filter(function(c){ return re.test(c.k); }).map(function(c){ return c.v; });
    }
    var b = neufProjet();
    b.client = prendre(/^votre soci[ée]t[ée]/i) || prendre(/^soci[ée]t[ée]|^client/i);
    b.projet = prendre(/^nom du projet/i);

    var t = typeDepuis(prendre(/formule/i))
         || typeDepuis(prendre(/type de prestation/i))
         || typeDepuis(String(txt || ""));
    if(t) b.type = t;
    if(/photo/i.test(prendre(/type de prestation/i))) b.media = "Photo";

    var fmt = prendre(/^format/i);
    if(/vertical/i.test(fmt)) b.format = "Vertical";
    else if(/horizontal/i.test(fmt)) b.format = "Horizontal 16/9";

    var itw = toutes(/^intervenant/i);
    if(itw.length) b.intervenants = itw.join("\n");
    b.questions = prendre(/qui pose les questions/i);

    var lieu = prendre(/^lieu du tournage|o[ùu] se d[ée]roule|^lieu$/i);
    var j = b.jours[0];
    if(/vos locaux|chez le client/i.test(lieu)) j.lieu = "Chez le client";
    else if(/autre lieu/i.test(lieu)) j.lieu = "Autre lieu";
    // « Dans vos locaux — 2 rue de la Brasserie » : l'adresse suit le tiret
    var apres = lieu.split(/\s+—\s+/).slice(1).join(" — ");
    j.adresse = prendre(/adresse exacte|^adresse/i) || apres;
    j.contactNom = prendre(/^contact$|interlocuteur/i) || prendre(/votre nom et votre fonction/i);
    j.contactTel = prendre(/^t[ée]l[ée]phone$|num[ée]ro de portable/i);

    var sujet = prendre(/quel est le sujet|de quoi parle|^sujet/i);
    var insight = prendre(/insight/i);
    var demandeur = prendre(/votre nom et votre fonction/i);
    var mail = prendre(/e-?mail/i);
    var restes = [];
    if(sujet)     restes.push("Sujet : " + sujet);
    if(insight)   restes.push("Insight à mettre en débat : " + insight);
    if(demandeur) restes.push("Demande faite par : " + demandeur + (mail ? " (" + mail + ")" : ""));
    restes.push("");
    restes.push("— Reprise de la demande client, à vérifier —");
    restes.push(String(txt || "").trim());
    b.notes = restes.join("\n");
    b.statut = "Confirmé";
    return { projet:b, champs:champs.length };
  }

  function vueImport(){
    return '<h2 class="sec">Reprendre une demande client</h2>'

      + 'préparation. Ce qui est reconnu remplit le formulaire de projet ; le texte complet est '
      + 'conservé dans « À savoir ». <b>Rien n\'est enregistré avant que vous ayez relu et validé.</b></p>'
      + '<div class="f"><label for="i_colle">Le récapitulatif</label>'
      + '<textarea id="i_colle" name="colle" rows="12" placeholder="01 — VOTRE PROJET&#10;  Votre société : …"></textarea></div>'
      + '</div>'
      + '<div class="actions"><button type="submit" class="btn lime">Remplir le formulaire</button>'
      + '<button type="button" class="btn ghost" data-go="avenir">Annuler</button></div></form>';
  }

  /* ---------- mode terrain ----------
     La même journée, réduite à ce qui sert une fois sur place :
     où aller, à quelle heure, qui appeler, quoi sortir du sac.
     Pensée pour un téléphone tenu d'une main, et imprimable telle quelle. */
  function vueTerrain(){
    var p = projet();
    if(!p){ VUE = "avenir"; return vueAvenir(); }
    var j = jourDe(p, JOUR) || (p.jours || [])[0] || {};
    if(!JOUR && j.id) JOUR = j.id;        // pour que les coches sachent où écrire
    var mtg = estMontage(p);
    var studio = j.lieu === "Notre studio";
    var adresse = studio ? STUDIO_ADR : (j.adresse || "");
    var items = mtg ? [] : materielDe(p);
    var coches = j.coches || {};
    var faits = items.filter(function(i){ return coches[i.lib]; }).length;
    var caps = captations(p);

    var h = '<section class="terrain">'
      + '<div class="tbar no-print"><button class="back" data-go="fiche">← Fiche complète</button>'
      + '<button class="btn" data-print="1">Imprimer</button></div>'
      + '<h2>' + esc(p.client || "Client à préciser") + '</h2>'
      + '<p class="tsub">' + esc(p.projet || libType(p)) + ' · ' + esc(jourLong(j.date)) + '</p>';

    h += '<div class="thoraires">'
      + '<div><span class="k">' + (mtg ? "Début" : "Arrivée") + '</span><b>' + esc(j.heureEquipe || "—") + '</b></div>'
      + (mtg ? '' : '<div><span class="k">PAT</span><b>' + esc(j.heurePat || "—") + '</b></div>')
      + '<div><span class="k">Fin</span><b>' + esc(j.heureFin || "—") + '</b></div>'
      + '</div>';

    if(!mtg){
      h += '<div class="tblk"><span class="k">Où</span>'
        + '<div class="tadr">' + (adresse ? esc(adresse) : '<span class="manque">Adresse à renseigner</span>') + '</div>'
        + (adresse ? '<a class="maps no-print" target="_blank" rel="noopener"'
            + ' href="https://www.google.com/maps/search/?api=1&query='
            + encodeURIComponent(adresse) + '">Itinéraire</a>' : '')
        + (j.acces ? '<p class="tnote">' + val(j.acces) + '</p>' : '')
        + '</div>';

      h += '<div class="tblk"><span class="k">Contact sur place</span>'
        + '<div class="tcontact">'
        + (j.contactNom ? esc(j.contactNom) : '<span class="manque">À renseigner</span>')
        + (j.contactTel ? ' <a class="tel" href="tel:' + esc(telPropre(j.contactTel)) + '">'
            + esc(j.contactTel) + '</a>' : ' <span class="manque">— numéro manquant</span>')
        + '</div>'
        + (nomPrenom(j.contactNom)
            ? '<button type="button" class="lien no-print" data-vcfj="1">Ajouter aux contacts</button>' : '')
        + '</div>';
    }

    h += '<div class="tblk"><span class="k">Équipe</span><div class="tval">'
      + (equipeDe(j).length ? esc(equipeDe(j).join(", ")) : '<span class="manque">Personne d\'assigné</span>')
      + '</div></div>';

    if(caps.length){
      h += '<div class="tblk"><span class="k">À produire</span><div class="caps">'
        + caps.map(function(c){
            return '<div class="cap"><span class="q">' + esc(c.quoi) + '</span>'
                 + '<span class="mpill ' + classeMedia(c.media) + '">' + esc(c.media) + '</span></div>';
          }).join("")
        + '</div></div>';
    }

    if(j.note) h += '<div class="tblk"><span class="k">Ce jour-là</span><p class="tnote">' + val(j.note) + '</p></div>';
    if(p.notes) h += '<div class="tblk"><span class="k">À savoir</span><p class="tnote">' + val(p.notes) + '</p></div>';

    if(items.length){
      h += '<div class="tblk"><span class="k">Matériel — ' + faits + ' / ' + items.length + '</span>'
        + '<div class="checks">';
      items.forEach(function(it, i){
        var on = !!coches[it.lib];
        h += '<label class="chk' + (on ? " on" : "") + '">'
           + '<input type="checkbox" data-chk="' + i + '"' + (on ? " checked" : "") + '>'
           + '<span class="box"></span><span class="t">' + esc(libelle(it)) + '</span></label>';
      });
      h += '</div></div>';
    }

    var ctrl = controles(p, j);
    if(ctrl.length){
      h += '<div class="tblk manquant"><span class="k">Il manque encore</span><ul>'
        + ctrl.map(function(c){
            return '<li>' + esc(c.q) + ' — ' + (c.n === "vide" ? "manque" : "à confirmer") + '</li>';
          }).join("")
        + '</ul></div>';
    }

    return h + '</section>';
  }

  /* ---------- formulaire ---------- */
  function neufJour(i){
    return { id:"j" + (i+1), date:"", heureEquipe:"", heurePat:"", heureFin:"", duree:"",
             lieu:"Notre studio", adresse:"", acces:"", contactNom:"", contactTel:"", note:"",
             equipe:[], coches:{} };
  }
  function neufProjet(){
    return { client:"", projet:"", type:TYPES[0], media:MEDIAS[0], captations:[{ quoi:"", media:"" }],
             dispositif:DISPOS[0], format:FORMATS[0],
             intervenants:"", questions:"", notes:"", statut:"Confirmé", ssd:"", validant:"",
             jours:[neufJour(0)] };
  }
  function champ(l, n, v, type, hint){
    return '<div class="f"><label for="i_' + n + '">' + esc(l)
      + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>'
      + '<input type="' + (type || "text") + '" id="i_' + n + '" name="' + n + '" value="' + esc(v || "") + '"></div>';
  }
  /* lib : permet d'afficher un libellé différent de la valeur enregistrée
     (« Retouche » pour le statut « Montage » sur un projet photo). */
  function choix(l, n, opts, v, lib){
    var h = '<div class="f"><label for="i_' + n + '">' + esc(l) + '</label><select id="i_' + n + '" name="' + n + '">';
    opts.forEach(function(o){
      h += '<option value="' + esc(o) + '"' + (o === v ? " selected" : "") + '>'
         + esc(lib ? lib(o) : o) + '</option>';
    });
    return h + '</select></div>';
  }
  function zone(l, n, v, hint){
    return '<div class="f"><label for="i_' + n + '">' + esc(l)
      + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>'
      + '<textarea id="i_' + n + '" name="' + n + '">' + esc(v || "") + '</textarea></div>';
  }

  /* Qui est prévu sur une journée : les noms connus à cocher,
     plus une ligne libre pour un renfort ou un prestataire extérieur. */
  function blocEquipe(j, i){
    var noms = equipeConnue(), sel = equipeDe(j);
    var autres = sel.filter(function(n){ return noms.indexOf(n) < 0; });
    var h = '<div class="f"><label>Qui est dessus'
      + '<span class="hint">Cochez les personnes prévues ce jour-là.</span></label>';
    if(noms.length){
      h += '<div class="checks eq">';
      noms.forEach(function(n){
        var on = sel.indexOf(n) >= 0;
        h += '<label class="chk' + (on ? " on" : "") + '">'
           + '<input type="checkbox" data-eq="' + i + '" value="' + esc(n) + '"' + (on ? " checked" : "") + '>'
           + '<span class="box"></span><span class="t">' + esc(n) + '</span></label>';
      });
      h += '</div>';
    }
    h += '<input type="text" name="j' + i + '_equipeAutre" value="' + esc(autres.join(", ")) + '"'
       + ' aria-label="Quelqu\'un d\'autre sur le jour ' + (i+1) + '"'
       + ' placeholder="Quelqu\'un d\'autre — séparez les noms par une virgule"></div>';
    return h;
  }

  /* Où atterrit chaque prise : dans le film, dans l'album, ou les deux. */
  function pourVideo(p){ return captations(p).filter(function(c){ return /vid/i.test(c.media || ""); }); }
  function pourAlbum(p){ return captations(p).filter(function(c){ return /photo/i.test(c.media || ""); }); }
  function sansDest(p){ return captations(p).filter(function(c){ return !String(c.media || "").trim(); }); }
  function listeDest(items, rien){
    if(!items.length) return '<p class="rienl">' + esc(rien) + '</p>';
    return '<ul class="destl">' + items.map(function(c){
      return '<li>' + esc(c.quoi) + '</li>';
    }).join("") + '</ul>';
  }
  /* Rafraîchit les deux listes sans redessiner le formulaire,
     pour ne pas faire sauter le curseur pendant la saisie. */
  function majDest(){
    if(!BROUILLON) return;
    var v = document.getElementById("destVideo"), a = document.getElementById("destPhoto");
    if(v) v.innerHTML = listeDest(pourVideo(BROUILLON), "Rien de coché pour la vidéo.");
    if(a) a.innerHTML = listeDest(pourAlbum(BROUILLON), "Rien de coché pour l'album.");
  }

  /* Ce qu'il y a à livrer, dans le formulaire.
     Un film se monte, des photos se trient : un projet qui contient les
     deux reçoit les deux blocs, chacun avec sa date. */
  function blocLivraisonForm(b){
    var video = faitVideo(b) || estMontage(b);
    var photo = faitPhoto(b) && !estMontage(b);
    var deux  = video && photo;
    var h = "";
    if(video){
      h += '<div class="blk"><h3>Montage et livraison' + (deux ? ' — la vidéo' : '') + '</h3>'
        + '<p class="kitmeta">Ce que le monteur doit savoir'
        + (deux ? ", pour la partie filmée" : "")
        + '. Ces champs remplacent la fiche de tournage dès que le projet passe en post-production.</p>'
        + (deux ? '<div class="f"><label>Ce qui va dans la vidéo'
                  + '<span class="hint">Coché sur les lignes « À réaliser », plus haut.</span></label>'
                  + '<div class="destbox" id="destVideo">'
                  + listeDest(pourVideo(b), "Rien de coché pour la vidéo.") + '</div></div>' : '')
        + champ("Durée visée", "livDuree", b.livDuree, "text", "Par exemple : 2 min, ou 90 secondes.")
        + choix("Structure de livraison", "livDecoupe", DECOUPE, b.livDecoupe)
        + '<div class="row2">'
        + choix("Sous-titres", "livSt", STITRES, b.livSt)
        + choix("Musique", "livMusique", MUSIQUE, b.livMusique)
        + '</div>'
        + champ("Habillage", "livLogo", b.livLogo, "text", "Logo fourni, générique, bandeaux…")
        + champ("Livraison visée", "livDate", b.livDate, "date")
        + champ("Lien de visionnage", "livLien", b.livLien, "text", "Playbook, WeTransfer, Drive…")
        + zone("Brief de montage", "livNotes", b.livNotes,
               "Le rythme, ce qu'il faut garder ou couper, les passages à éviter.")
        + '</div>';
    }
    if(photo){
      h += '<div class="blk"><h3>L\'album à livrer' + (deux ? ' — les photos' : '') + '</h3>'
        + '<p class="kitmeta">'
        + (deux ? "Les photos ne se montent pas : elles se trient et se retouchent. "
                + "Elles ont donc leur propre échéance, indépendante de celle du film."
                : "Un projet photo n'a pas de montage : ce qui compte, c'est la sélection, "
                + "la retouche et la date de remise. Ces champs remplacent la fiche de "
                + "tournage dès que le projet passe en post-production.")
        + '</p>'
        + (deux ? '<div class="f"><label>Ce qui va dans l\'album'
                  + '<span class="hint">Coché sur les lignes « À réaliser », plus haut.</span></label>'
                  + '<div class="destbox" id="destPhoto">'
                  + listeDest(pourAlbum(b), "Rien de coché pour l'album.") + '</div></div>' : '')
        + (estShooting(b)
            ? champ("Nombre de photos prévu", "photoNb", b.photoNb, "text",
                    "Le shooting est vendu avec un nombre de photos : indiquez-le ici.")
            : '<p class="kitmeta">Hors shooting, nous livrons tout ce qui est bon : '
              + 'il n\'y a pas de nombre à annoncer.</p>')
        + '<div class="row2">'
        + choix("Retouche", "photoRetouche", RETOUCHE, b.photoRetouche)
        + choix("Forme de la remise", "photoForme", REMISE, b.photoForme)
        + '</div>'
        + champ("Remise de l'album", "photoDate", b.photoDate, "date", "La date promise au client.")
        + champ("Lien de la galerie", "photoLien", b.photoLien, "text", "Playbook, Drive, WeTransfer…")
        + zone("Brief de retouche", "photoNotes", b.photoNotes,
               "Le rendu attendu, le cadrage, ce qu'il faut garder ou écarter.")
        + '</div>';
    }
    return h;
  }

  /* Le kit affiché au dernier rendu du formulaire : sert à distinguer
     les ajouts manuels quand on change de type de prestation. */
  var KIT_AFFICHE = [];

  /* Le formulaire montre-t-il la checklist matériel ? Choix de la
     personne qui saisit, jamais enregistré dans le projet. */
  var MAT_FORM = false;

  /* Les lignes « matériel en plus » en cours de saisie. null = à
     reconstruire depuis le projet au prochain affichage ; une ligne
     vide doit pouvoir exister le temps qu'on la remplisse. */
  var SUP = null;

  function blocMateriel(b){
    var kit = kitDe(b).items;
    var retenu = materielDe(b);
    var carte = {};
    retenu.forEach(function(q){ carte[q.lib] = q.qte; });
    KIT_AFFICHE = kit.map(function(q){ return q.lib; });
    var sup = retenu.filter(function(q){ return KIT_AFFICHE.indexOf(q.lib) < 0; });
    var n = retenu.length;
    var h = '<div class="blk"><h3>Matériel du projet</h3>'
      + '<p class="kitmeta">Décochez ce que vous n\'emportez pas, ajustez les quantités. '
      + 'Cette liste devient la checklist de chaque journée de tournage.</p>'
      + '<div class="pickbar"><span class="n" id="nmat">' + n + ' poste' + (n > 1 ? 's' : '') + ' retenu' + (n > 1 ? 's' : '') + '</span>'
      + '<button type="button" data-pickall="1">Tout cocher</button>'
      + '<button type="button" data-picknone="1">Tout décocher</button>'
      + (kitDe(b).connu ? '<button type="button" data-reset="1">Repartir du kit</button>' : '')
      + '</div>'
      + '<div class="checks">';
    kit.forEach(function(q, i){
      var on = carte.hasOwnProperty(q.lib);
      h += '<div class="matline">'
         + '<label class="chk sel' + (on ? " on" : "") + '">'
         + '<input type="checkbox" data-pick="' + i + '" data-lib="' + esc(q.lib) + '"' + (on ? " checked" : "") + '>'
         + '<span class="box"></span><span class="t">' + esc(q.lib) + '</span></label>'
         + '<input type="number" class="qte" min="1" max="99" step="1" data-qte="' + i + '"'
         + ' aria-label="Quantité — ' + esc(q.lib) + '" value="' + (on ? carte[q.lib] : q.qte) + '"'
         + (on ? "" : " disabled") + '>'
         + '</div>';
    });
    h += '</div>';

    if(SUP === null) SUP = sup.map(function(q){ return { lib:q.lib, qte:q.qte || 1 }; });
    h += '<div class="sup"><h4>Matériel en plus</h4>'
      + '<p class="kitmeta">Ce qui n\'est pas dans le kit : un projecteur loué, une perche, '
      + 'un objectif particulier.</p>';
    SUP.forEach(function(q, i){
      h += '<div class="supline">'
         + '<input type="text" name="s' + i + '_lib" value="' + esc(q.lib || "") + '"'
         + ' aria-label="Matériel en plus ' + (i+1) + '" placeholder="Mandarine 800 W, perche, 70-200 mm…">'
         + '<input type="number" class="qte" min="1" max="99" step="1" name="s' + i + '_qte"'
         + ' aria-label="Quantité — matériel en plus ' + (i+1) + '" value="' + (q.qte || 1) + '">'
         + '<button type="button" data-dels="' + i + '" aria-label="Retirer">Retirer</button>'
         + '</div>';
    });
    h += '<div class="actions"><button type="button" class="btn" data-adds="1">'
      + '+ Ajouter du matériel</button></div></div>'
      + '</div>';

    b.jours.forEach(function(j, i){
      ["date","heureEquipe","heurePat","heureFin","duree","lieu","adresse","acces","contactNom","contactTel","note"]
        .forEach(function(k){ var el = f.elements["j" + i + "_" + k]; if(el) j[k] = el.value; });
      var eq = [], boites = f.querySelectorAll('[data-eq="' + i + '"]');
      if(boites.length || f.elements["j" + i + "_equipeAutre"]){
        boites.forEach(function(c){ if(c.checked) eq.push(c.value); });
        var autre = f.elements["j" + i + "_equipeAutre"];
        if(autre) autre.value.split(/[,;]/).forEach(function(n){
          n = n.trim();
          if(n && eq.indexOf(n) < 0) eq.push(n);
        });
        j.equipe = eq;
      }
    });
    var caps = [], i = 0;
    while(f.elements["c" + i + "_quoi"]){
      var q = f.elements["c" + i + "_quoi"].value.trim();
      var m = "";
      var bv = f.querySelector('[data-dest="v' + i + '"]');
      var bp = f.querySelector('[data-dest="p' + i + '"]');
      if(bv || bp){                       // projet photo + vidéo : deux cases
        m = bv && bv.checked
              ? (bp && bp.checked ? "Photo et vidéo" : "Vidéo")
              : (bp && bp.checked ? "Photo" : "");
      } else if(f.elements["c" + i + "_media"]){
        m = f.elements["c" + i + "_media"].value;
      }
      caps.push({ quoi:q, media:m });
      i++;
    }
    if(i) b.captations = caps;

    var picks = f.querySelectorAll("[data-pick]");
    if(picks.length){
      var m = [];
      picks.forEach(function(inp, i){
        if(!inp.checked) return;
        var q = f.querySelector('[data-qte="' + inp.dataset.pick + '"]');
        m.push({ lib: inp.dataset.lib, qte: Math.max(1, parseInt(q && q.value, 10) || 1) });
      });
      var sup = [], k = 0;
      while(f.elements["s" + k + "_lib"]){
        var el = f.elements["s" + k + "_qte"];
        sup.push({ lib: f.elements["s" + k + "_lib"].value.trim(),
                   qte: Math.max(1, parseInt(el && el.value, 10) || 1) });
        k++;
      }
      SUP = sup;
      sup.forEach(function(z){
        if(!z.lib) return;                       // ligne encore vide : on l'ignore
        if(!m.some(function(x){ return x.lib === z.lib; })) m.push({ lib:z.lib, qte:z.qte });
      });
      b.materiel = m;
    }
  }

  /* Animations d'entrée, jouées seulement à l'ouverture d'une rubrique (pas aux rafraîchissements). */
  var CHIFFRES = ".intro.anim .cnt, .tile .n, .ks-pf .n, .ks-top .n, .ks-mini b, .ks-rank .v";
  var REVELES = ".tile, .ks-pf, .ks-top, .ks-m, .ks-rank li, .ks-tile, .kstat h2.sec, .shero.grand";
  function compter(el){
    var txt = el.firstChild && el.firstChild.nodeType === 3 ? el.firstChild.nodeValue : null;
    var m = txt && txt.match(/^([\d\s  ]+(?:,\d+)?)(.*)$/); if(!m) return;
    var dec = m[1].indexOf(",") >= 0, cible = parseFloat(m[1].replace(/[\s  ]/g, "").replace(",", "."));
    if(!isFinite(cible) || cible === 0) return;
    var noeud = el.firstChild, fin = m[2], t0 = null, duree = cible > 999 ? 1600 : 1100;
    function f(v){ return dec ? v.toFixed(1).replace(".", ",") : Math.round(v).toLocaleString("fr-FR"); }
    noeud.nodeValue = f(0) + fin;
    function pas(t){
      if(t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / duree), e = 1 - Math.pow(2, -10 * k);   // départ rapide, arrivée douce
      noeud.nodeValue = (k < 1 ? f(cible * e) : m[1]) + fin;
      if(k < 1) requestAnimationFrame(pas);
    }
    requestAnimationFrame(pas);
  }
  function animer(){
    if(!app.querySelector(".intro.anim")) return;
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var vus = app.querySelectorAll(REVELES), nums = app.querySelectorAll(CHIFFRES);
    if(!("IntersectionObserver" in window)){ nums.forEach(compter); return; }
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        io.unobserve(e.target);
        if(e.target.classList.contains("rv")) e.target.classList.add("vu");
        else compter(e.target);
      });
    }, { rootMargin:"0px 0px -8% 0px" });
    vus.forEach(function(el, i){
      el.classList.add("rv");
      el.style.transitionDelay = Math.min(i % 4, 3) * 70 + "ms";
      io.observe(el);
    });
    nums.forEach(function(el){ io.observe(el); });
    app.querySelectorAll(".kstat.anim .kbars .st").forEach(function(el, i){ el.style.animationDelay = i * 60 + "ms"; });
  }

  /* ---------- Réunion du lundi ----------
     Un onglet à projeter en réunion : Régie et KSF réunis, point par point.
     Les notes, décisions, questions et points « vus » sont partagés : une ligne kind:"reunion"

  var RV = { sem:"", pres:false, i:0, envoi:false };
  function rLundi(){ return RV.sem || iso(lundi(new Date())); }
  function rReu(L){ return REU.filter(function(r){ return r.semaine === L; })[0] || null; }
  function rDans(d, a, b){ d = String(d || "").slice(0, 10); return !!d && d >= a && d < b; }
  function rSauver(f){
    var L = rLundi(), r = rReu(L);
    if(r){ var c = JSON.parse(JSON.stringify(r)); f(c); c.maj = new Date().toISOString(); enregistrer(c, true); return; }
    if(RV.envoi){ toast("Un instant, la réunion s'enregistre…"); return; }
    var n = { kind:"reunion", semaine:L, vus:[], notes:"", decisions:[], questions:[], maj:new Date().toISOString() };
    f(n); RV.envoi = true; creer(n);
    setTimeout(function(){ RV.envoi = false; }, 4000);
  }
  function rId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function rNomP(p){ return (p.client || "Client à préciser") + (p.projet ? " — " + p.projet : ""); }
  function rVide(t){ return '<p class="ru-vide">' + esc(t) + '</p>'; }
  function rItem(ico, quoi, sous, attr, cls){

      + '<i class="ru-ico">' + ico + '</i><span class="ru-q"><b>' + quoi + '</b>' + (sous ? '<small>' + sous + '</small>' : '') + '</span>'
      + (attr ? '</button>' : '</div>') + '</li>';
  }
  function rListe(a, vide){ return a.length ? '<ul class="ru-ul">' + a.join("") + '</ul>' : rVide(vide); }
  function rKp(p){

  /* Stats : promotions Instagram, et comparaison avec l'an dernier. */
  function kStatsPlus(){
    var h = '', pr = KS.filter(function(p){ return p.promo; }).sort(function(a, b){ return String(b.promo.le).localeCompare(String(a.promo.le)); });
    var med = kMedianeIg(60);

    if(!pr.length) h += '<div class="ks-tile"><p class="legende" style="margin:0">Aucun short promu pour l’instant. La suggestion du jour est dans le volet de « Cette semaine » : note-la quand tu l’as boostée, son résultat s’affichera ici.</p></div>';
    else h += '<div class="ks-tile kpromo-t">' + pr.map(function(p){
        var v = kIgVues(p), av = +p.promo.vuesAvant || 0, gain = Math.max(0, v - av), b = +p.promo.budget || 0;
        return '<div class="kpr"><div class="t"><b>' + esc(p.title || "Sans titre") + '</b><span>promu le ' + esc(quandCourt(p.promo.le)) + (b ? ' · ' + b + ' €' : '') + (p.promo.jours ? ' · ' + esc(p.promo.jours) + ' j' : '') + '</span></div>'
          + '<div class="m"><b>+' + kK(gain) + '</b><span>vues depuis la promo</span></div>'
          + '<div class="m"><b>' + kK(v) + '</b><span>vues Instagram' + (med ? ' · ×' + String(Math.round(v / med * 10) / 10).replace(".", ",") + ' la médiane' : '') + '</span></div>'
          + '<div class="m"><b>' + (b && gain ? (Math.round(b / gain * 1000 * 100) / 100).toString().replace(".", ",") + ' €' : '—') + '</b><span>pour 1 000 vues gagnées</span></div></div>'; }).join("") + '</div>';
    // comparaison avec l'an dernier, mois par mois
    var all = kStatPosts().filter(function(x){ return x.platform !== "Facebook"; }), an = +kAuj().slice(0, 4), m = {}, prem = null;
    all.forEach(function(x){ m[x.month] = (m[x.month] || 0) + x.metric; if(!prem || x.month < prem) prem = x.month; });
    var mois = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
    var lignes = mois.map(function(l, i){ var k = (i < 9 ? "0" : "") + (i + 1); return { l:l, a:m[an + "-" + k] || 0, b:m[(an - 1) + "-" + k] || 0 }; });
    var max = Math.max.apply(null, [1].concat(lignes.map(function(x){ return Math.max(x.a, x.b); })));
    h += '<h2 class="sec">Par rapport à l’an dernier</h2><div class="ks-tile"><div class="kyoy" role="img" aria-label="Vues Instagram et YouTube par mois, ' + an + ' et ' + (an - 1) + '">'
      + lignes.map(function(x){ return '<div class="c" title="' + esc(x.l + " : " + kNf(x.a) + " vues en " + an + ", " + kNf(x.b) + " en " + (an - 1)) + '"><div class="bb">'
          + '<i class="b" style="height:' + Math.round(x.b / max * 160) + 'px"></i><i class="a" style="height:' + Math.round(x.a / max * 160) + 'px"></i></div><span>' + x.l + '</span></div>'; }).join("")
      + '</div><div class="kleg"><i style="background:var(--lime)"></i>' + an + '<i style="background:#5b6670"></i>' + (an - 1) + '</div>'
      + (lignes.every(function(x){ return !x.b; }) ? '<p class="legende">Buffer ne garde les statistiques KSF que depuis ' + esc(prem ? kMoisL(prem).toLowerCase() : "peu") + ' : les barres de ' + (an - 1) + ' se rempliront au fil des mois, et la comparaison deviendra lisible à partir de ' + esc(prem ? kMoisL((+prem.slice(0, 4) + 1) + prem.slice(4)).toLowerCase() : "l’an prochain") + '.</p>' : '')
      + '</div>';
    return h;
  }

  /* ---------- KSF dans Tâches ---------- */
  var RE_KSF = /\bksf\b|kamel/i;
  function tEstKsf(t){ return t.categorie === "ksf" || (t.categorie !== "tache" && t.categorie !== "creation" && t.categorie !== "tournage" && RE_KSF.test((t.titre || "") + " " + (t.projet || ""))); }
  function tKsfPosts(){ var a = kAuj(), f = kAdd(a, 14); return kTri(KS.filter(function(p){ return p.type !== "story" && p.status !== "done" && p.date >= a && p.date <= f && !kFlags(p).late && !(kFlags(p).confirm && !kStats(p).length); })); }
  function tKsfRetard(){ return kTri(KS.filter(function(p){ var f = kFlags(p); return p.type !== "story" && (f.late || (f.confirm && !kStats(p).length)); })); }
  function tKsfSortis(){ var a = kAuj(), d = kAdd(a, -7); return kTri(KS.filter(function(p){ return p.type !== "story" && p.date >= d && p.date < a && (p.status === "done" || p.status === "sched"); })).reverse(); }
  function tKsfCarte(p){
    var e = kEtat(p), v = kVues(p);

      + (e.c === "rouge" ? '<span class="tbadge late">' + esc(e.l) + '</span>' : '') + '</span>'
      + '<span class="tm"><span>' + esc(jourCourt(p.date)) + (p.time ? ' · ' + esc(p.time) : '') + '</span>' + (p.guest ? '<span>' + esc(p.guest) + '</span>' : '')
      + '</span>'
      + '<span class="tr"><span class="tsm">' + (e.c === "rouge" ? '' : esc(e.l)) + (v ? ' · ▶ ' + kK(v) : '') + '</span></span></button>';

  function vueTachesKsf(info){
    var tg = mesTournages().filter(function(x){ return estKsfProjet(x.p); }), ta = tListe("ksf"), ret = tKsfRetard(), av = tKsfPosts(), so = tKsfSortis(), st = kStock();

      + bloc("taches", "Tâches KSF", ta.length, ta.length ? '<div class="tcards">' + ta.map(tCarte).join("") + '</div>' : '<p class="mp-vide">Aucune tâche KSF ouverte.</p>')

      + (ret.length ? bloc("retard", "En retard ou à confirmer", ret.length, cartes(ret, "")) : '')
      + (st.length ? bloc("stock", "Épisodes tournés, pas encore programmés", st.length, '<ul class="ru-ul">' + st.map(function(e){
          return rItem("🎞", esc(e.guest || "Invité"), esc(e.shoot ? "tourné le " + jourCourt(e.shoot) : "date de tournage non renseignée"), ""); }).join("") + '</ul>') : '')
      + '<p><button type="button" class="lien" data-go="ksf">Ouvrir l’espace KSF complet →</button></p></div>';

  /* ---------- rendu ---------- */
  function rendre(){
    var h = "";
    if(!PRET){ h = vide("Chargement du planning…"); }
    else if(VUE === "fiche"){ h = vueFiche(); }
    else if(VUE === "terrain"){ h = vueTerrain(); }
    else if(VUE === "import"){ h = vueImport(); }
    else if(VUE === "contacts"){ h = vueContacts(); }
    else if(VUE === "contact"){ h = vueContact(); }
    else if(VUE === "new" || VUE === "edit"){ h = vueForm(); }
    else if(VUE === "mat"){ h = vueMat(); }
    else if(VUE === "cal"){ h = vueCalendrier(); }
    else if(VUE === "planning"){ h = vuePlanning(); }
    else if(VUE === "suivi"){ VUE = "tous"; PJ.grp = "encours"; h = vueTous(); }   // l'onglet Après tournage est devenu Projets › En cours
    else if(/^ksf/.test(VUE)){ h = vueKsf(); }
    else if(VUE === "tous"){ h = vueTous(); }
    else if(VUE === "reunion"){ h = vueReunion(); }
    else { h = vueAvenir(); }
    if(PRET && ["avenir","cal","contacts"].indexOf(VUE) >= 0) h = sIntro() + h;
    document.body.classList.toggle("vue-taches", PRET && (VUE === "planning" || VUE === "tous"));
    document.body.classList.toggle("vue-reunion", PRET && VUE === "reunion");
    document.body.classList.toggle("ksf-large", PRET && VUE === "ksf");
    if(PRET && ["avenir","cal","contacts","fiche","contact"].indexOf(VUE) >= 0)
      h += '<button type="button" class="fab" data-go="new" aria-label="Nouveau projet">+ Nouveau projet</button>';

    if(PRET && !EN_LIGNE){
      h += '<div class="bandeau"><b>Mode démonstration.</b> Les projets saisis ici restent '
         + 'dans ce navigateur et ne sont partagés avec personne. Pour que toute l\'équipe voie '
         + 'le même planning, renseignez <code>SUPABASE_URL</code> et <code>SUPABASE_KEY</code> '
         + 'en haut du fichier index.html — la marche à suivre est dans le LISEZ-MOI.</div>';
    } else if(PRET && ERREUR){
      h += '<div class="bandeau"><b>Connexion aux données impossible.</b> Le planning affiché peut '
         + 'être incomplet. Vérifiez la connexion internet, puis rechargez la page.</div>';

    app.innerHTML = h;
    app.querySelectorAll("[data-tile]").forEach(function(b){
      b.addEventListener("click", function(){ VUE = b.dataset.tile; rendre(); window.scrollTo(0,0); });
    });
    lierTaches();
    lierProjets();

    rendreMoi();

    if(moisOn) moisOn.parentNode.scrollLeft = moisOn.offsetLeft - moisOn.parentNode.offsetLeft - 24;
    animer();
  }

  function kbPoser(raw){

      KB.posts[s] = kbParse(raw && raw[s]);

  function kbCharger(force){
    if(!EN_LIGNE || KB.charge) return;
    if(!force && KB.posts && Date.now() - KB.at < 3600e3) return;
    if(!force && KB.errAt && Date.now() - KB.errAt < 10 * 60e3) return;   // pas de nouvel essai avant 10 min
    KB.charge = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/ksf-buffer" + (force ? "?force=1" : ""),
          { headers:{ "apikey":CFG.SUPABASE_KEY } })

  function kbEtat(){
    if(!EN_LIGNE) return "Statistiques Buffer indisponibles en mode démonstration.";

    if(KB.err === "buffer_auth") return "Statistiques : Buffer refuse le jeton enregistré dans Supabase. Créez-en un nouveau.";
    if(KB.err && !KB.posts) return "Statistiques Buffer injoignables pour l’instant.";
    if(KB.posts) return "Statistiques Buffer à jour (" + kIlya(new Date(KB.at).toISOString()) + ")"
                      + (KB.err ? ", dernière actualisation en échec" : "") + ". TikTok et LinkedIn ne sont pas suivis.";

  /* Les publications Buffer d'une ligne du planning.
     Fiche envoyée par la Régie : uniquement les posts Buffer dont l'identifiant est noté dans la fiche.
     Sinon (fiche publiée à la main, sans identifiant) : même jour et plateformes cochées, et seulement
     si la fiche est marquée Publié. Une fiche à faire ou programmée n'emprunte jamais les vues d'un
     autre post du même jour. */
  function kStats(p){
    var jour = KB.parJour[p.date]; if(!jour) return [];
    var pl = p.platforms || [], voulu = [], out = [], bu = p.buffer || {};
    if(pl.indexOf("igfb") >= 0) voulu.push("instagram", "facebook");
    if(pl.indexOf("yt") >= 0) voulu.push("youtube");
    voulu.forEach(function(s){
      var l = jour[s]; if(!l || !l.length) return;
      if(bu[s]){
        var avecId = l.filter(function(b){ return b.id; });
        if(avecId.length){
          var a = avecId.filter(function(b){ return String(b.id) === String(bu[s]); })[0];
          if(a) out.push(Object.assign({ svc:s }, a));
          return;
        }
      }
      if(p.status !== "done") return;
      var pick = l.reduce(function(a, b){
        if(s === "youtube") return p.type === "podcast" ? (b.len > a.len ? b : a) : (b.len < a.len ? b : a);
        return b.metric > a.metric ? b : a;
      });
      out.push(Object.assign({ svc:s }, pick));
    });
    return out;
  }

  /* Un statut « Programmé » qui change de créneau doit être revalidé. */

  /* Remet l'épisode du sujet en stock (son contenu part avec lui), vide les créneaux. */
  function kTachesRetrait(n){
    var posts = kSujetPosts(n), ep = kEpDe(n), rg = kRangs(posts), t = [];
    if(!posts.length || !kAContenu(posts) && !ep) return t;
    var slots = posts.map(function(p){ var c = kContenu(p); c.episodeId = ""; return kRevalider(c); });
    if(ep) t.push(function(){ return kMaj(ep.id, { slots:slots }, true); });
    else t.push(function(){ return kCreer([{ kind:"ksf-episode", guest:kInvite(n) || "Invité non précisé", shoot:"", title:"",
                                              notes:"Remis en stock", slots:slots }], true); });
    posts.forEach(function(p, i){ t.push(function(){ return kMaj(p.id, kVide(p, rg[i]), true); }); });
    return t;

  function kAffecter(epId, n){
    var posts = kSujetPosts(n), ep = kEp(epId), rg = kRangs(posts);

    var t = kTachesRetrait(n);
    posts.forEach(function(p, i){
      var s = ep.slots && ep.slots[i];
      var c = s ? kRevalider(kCopie(s)) : Object.assign(kVide(p, rg[i]), { guest:ep.guest || "" });
      c.episodeId = ep.id;
      if(!c.guest) c.guest = ep.guest || "";
      t.push(function(){ return kMaj(p.id, c, true); });
    });
    t.push(function(){ return kMaj(ep.id, { slots:null }, true); });
    KSF.occupe = true;

  function kVueSujets2(){
    var t = kAuj(), suj = kSujets().sort(function(a, b){

  function kVueCal(){

    var h = '<div class="calbar"><h2 class="tt">' + esc(premier.toLocaleDateString("fr-FR", { month:"long", year:"numeric" })) + '</h2>'

      var d = plusJours(debut, i), k = iso(d), liste = kTri(m[k] || []);

      liste.slice(0, 3).forEach(function(p){ h += kEv(p, false); });

    return h + '</div><p class="legende">Cliquez sur une publication pour l’ouvrir, sur un numéro de jour pour en créer une. '
             + 'Bord rouge : en retard ; vert : publié ; citron : programmé.</p>';

           }).join("") + '</div>';

           + (inv || kAContenu(ps) ? '<option value="-">Remettre l’épisode en stock</option>' : '')

  /* ---------- fiche publication ---------- */
  function kOuvrir(id, date){
    var p = id ? KS.filter(function(x){ return x.id === id; })[0] : null;
    if(id && !p){ toast("Publication introuvable."); return; }
    KSF.retour = VUE === "ksf-fiche" ? KSF.retour : VUE;
    KSF.id = id || null;
    KSF.orig = p ? kCopie(p) : null;
    KSF.br = p ? kCopie(p) : kNeuf(date ? { date:date, type:kJeudi(date) ? "podcast" : "short", platforms:(kJeudi(date) ? K_ALL : K_SOCIAL).slice(),
                                            sujet:kSujetDe(date) } : {});
    if(!KSF.br.vK) KSF.br.vK = kBlanc();
    if(!KSF.br.vC) KSF.br.vC = kBlanc();
    KSF.sale = false; KSF.quitter = false; KSF.refus = null; KSF.sup = false;
    KSF.edit = !id; KSF.dtab = null; KSF.conf = false;
    VUE = "ksf-fiche"; rendre(); window.scrollTo(0, 0);
  }
  function kSujetDe(date){
    var pods = kTri(KS.filter(function(p){ return p.type === "podcast" && p.sujet; }));
    for(var i = 0; i < pods.length; i++) if(date >= pods[i].date && date < kAdd(pods[i].date, 14)) return Number(pods[i].sujet);
    return "";
  }

  /* ---------- nouvelle KSF : fiche en lecture ---------- */

      + (edit ? '<textarea id="kf_' + k + '" data-kf="' + k + '" class="kdtxt">' + esc(v) + '</textarea>'
              : '<p class="kdlire' + (modele ? " vide" : "") + '">' + (modele ? (k === "descAU" ? "Pas encore de description Ausha (Spotify, Apple Podcasts…)." : "Pas encore de description (seulement le modèle).") : esc(v)) + '</p>');
  }
  /* Test de 3 titres YouTube (épisodes complets) : titleA, titleB, titleC */

    if(!kYt3Voulu(p)) return "";
    var h = '<div class="kbloc"><span class="kmono">Titres YouTube · test de 3 titres</span><div class="kyt3">';
    K_YT3.forEach(function(k){

      if(!j.envoi) throw new Error("Dépôt impossible pour l’instant.");
      return new Promise(function(ok, ko){
        var x = new XMLHttpRequest();
        x.open("PUT", j.envoi);
        x.setRequestHeader("Content-Type", f.type || "video/mp4");
        x.setRequestHeader("x-upsert", "false");
        x.upload.onprogress = function(e){ if(e.lengthComputable){ var v = Math.round(e.loaded / e.total * 100); if(v !== KSF.envoiPct){ KSF.envoiPct = v; rendre(); } } };
        x.onload = function(){ x.status < 300 ? ok(j.public) : ko(new Error("Envoi de la vidéo refusé (" + x.status + ").")); };
        x.onerror = function(){ ko(new Error("Envoi de la vidéo interrompu.")); };

  /* ---------- porte d'entrée ---------- */

  // Le code est vérifié par le serveur (fonction « regie-db ») : la page ne contient ni le code ni son empreinte.

  /* ---------- Jarvis : l'assistant de la Régie ----------
     Un bouton rond ouvre un volet de discussion. Les questions partent vers la fonction regie-jarvis

  var JV = { ouvert:false, msgs:[], enCours:false, voix:false, ecoute:null };
  try{ JV.msgs = JSON.parse(sessionStorage.getItem("sbtd-jarvis") || "[]") || []; JV.voix = localStorage.getItem("sbtd-jarvis-voix") === "1"; }catch(e){}
  var JV_SUGG = ["Qu’est-ce qu’on tourne cette semaine ?", "Qu’est-ce qui est en retard ?", "Résume-moi le point KSF", "Qui est sur le tournage de demain ?", "Quels projets attendent un retour client ?"];
  function jvSauver(){ try{ sessionStorage.setItem("sbtd-jarvis", JSON.stringify(JV.msgs.slice(-30))); }catch(e){} }
  function jvMd(t){
    var h = esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    var out = [], liste = false;
    h.split("\n").forEach(function(l){
      var m = l.match(/^\s*[-•]\s+(.*)$/);
      if(m){ if(!liste){ out.push("<ul>"); liste = true; } out.push("<li>" + m[1] + "</li>"); return; }
      if(liste){ out.push("</ul>"); liste = false; }
      out.push(l.trim() ? "<p>" + l + "</p>" : "");
    });
    if(liste) out.push("</ul>");

  function jvRendre(){

        + '<div class="jv-sugg">' + JV_SUGG.map(function(s){ return '<button type="button" data-jvq="' + esc(s) + '">' + esc(s) + '</button>'; }).join("") + '</div></div>')
      + JV.msgs.map(function(m){ return '<div class="jv-m ' + (m.role === "user" ? "moi" : "lui") + '">' + (m.role === "user" ? esc(m.vu || m.content) : jvMd(m.content) || '<span class="jv-pense"><i></i><i></i><i></i></span>') + '</div>'; }).join("");

  /* La voix de Jarvis : une voix masculine française, grave et posée (celle du système : Thomas sur Mac). */
  var JV_FEM = /am[ée]lie|audrey|aur[ée]lie|marie|virginie|c[ée]line|julie|hortense|l[ée]a|chantal|sylvie|denise|elsa|eloise|vivienne|joana|samantha|female|femme/i;
  function jvVoixChoisie(){
    if(!window.speechSynthesis) return null;

    var pref = ["Thomas", "Nicolas", "Henri", "Paul", "Jacques", "Daniel", "Google français"];
    for(var i = 0; i < pref.length; i++){ var m = v.filter(function(x){ return x.name.indexOf(pref[i]) >= 0 && !JV_FEM.test(x.name); })[0]; if(m) return m; }
    return v.filter(function(x){ return !JV_FEM.test(x.name) && /fr-FR/i.test(x.lang); })[0] || v.filter(function(x){ return /fr-FR/i.test(x.lang); })[0] || v[0] || null;
  }
  if(window.speechSynthesis) try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){}; }catch(e){}
  /* Voix « Jarvis » de VoiceStudio, l'application de voix locale du Mac (profil créé le 23/11/2026).
     Si VoiceStudio n'est pas ouvert ou n'autorise pas la Régie, on garde la voix du navigateur. */
  var JV_VS = { url:"http://localhost:3900", profil:"7ea360ba", nom:"Jarvis", ok:null, verifie:0, audio:null, jeton:0 };
  function jvVsDispo(){
    if(JV_VS.ok !== null && Date.now() - JV_VS.verifie < 60000) return Promise.resolve(JV_VS.ok);
    var c = new AbortController(); setTimeout(function(){ c.abort(); }, 1500);
    return fetch(JV_VS.url + "/profiles", { signal:c.signal }).then(function(r){ return r.ok ? r.json() : null; }).then(function(l){
      l = Array.isArray(l) ? l : (l && l.profiles) || [];
      var p = l.filter(function(x){ return x.id === JV_VS.profil; })[0] || l.filter(function(x){ return x.name === JV_VS.nom; })[0];
      if(p) JV_VS.profil = p.id;
      JV_VS.ok = !!p; JV_VS.verifie = Date.now(); return JV_VS.ok;
    }).catch(function(){ JV_VS.ok = false; JV_VS.verifie = Date.now(); return false; });
  }
  function jvVsPhrases(t){
    var out = [], cur = "";
    String(t).replace(/\*\*/g, "").replace(/^\s*-\s+/gm, "").split(/\n+/).forEach(function(l){
      (l.match(/[^.!?…;:]+[.!?…;:]*\s*/g) || []).forEach(function(s){
        s = s.trim(); if(!s) return;
        if((cur + " " + s).length > 180 && cur){ out.push(cur); cur = s; } else cur = cur ? cur + " " + s : s;
      });
      if(cur){ out.push(cur); cur = ""; }
    });
    return out.filter(function(s){ return /[\wÀ-ÿ]/.test(s); });
  }
  function jvVsGen(txt){
    var fd = new FormData();
    fd.append("text", txt); fd.append("engine", "omnivoice"); fd.append("profile_id", JV_VS.profil); fd.append("language", "fr");
    fd.append("effect_preset", "cinematic"); fd.append("num_step", "16");

  }
  /* Phrase par phrase : la suivante se fabrique pendant que la précédente est lue. */
  function jvVsParler(t, apres){
    var ph = jvVsPhrases(t), jeton = ++JV_VS.jeton, i = 0, suivante = ph.length ? jvVsGen(ph[0]) : null;
    if(!suivante){ if(apres) apres(); return; }
    JV.parle = true; jvEtat(); hudDebut(ph.join(" "));
    var debMots = ph.map(function(s, k){ return ph.slice(0, k).join(" ").split(" ").filter(Boolean).length; });
    function finir(){ if(jeton !== JV_VS.jeton) return; JV.parle = false; jvEtat(); hudFin(); if(apres) apres(); }
    function lire(){
      if(jeton !== JV_VS.jeton) return;
      var cour = suivante; i++; suivante = i < ph.length ? jvVsGen(ph[i]) : null;
      cour.then(function(b){
        if(jeton !== JV_VS.jeton) return;
        var a = new Audio(URL.createObjectURL(b)); JV_VS.audio = a;
        HUD.phraseDeb = debMots[i - 1] || 0; HUD.phraseMots = ph[i - 1].split(" ").filter(Boolean).length; HUD.idx = HUD.phraseDeb; hudTexte(); hudAudio(a);
        a.onended = a.onerror = function(){ URL.revokeObjectURL(a.src); if(suivante) lire(); else finir(); };
        a.play().catch(function(){ if(suivante) lire(); else finir(); });
      }, function(){ JV_VS.ok = false; finir(); });
    }
    lire();
  }
  function jvTaire(){ if(HUD.actif) hudFin(); JV_VS.jeton++; if(JV_VS.audio){ try{ JV_VS.audio.pause(); }catch(e){} JV_VS.audio = null; } if(window.speechSynthesis) speechSynthesis.cancel(); JV.parle = false; }
  function jvParler(t, apres){
    if(!JV.voix){ if(apres) apres(); return; }
    jvTaire();
    jvVsDispo().then(function(ok){ if(ok) jvVsParler(t, apres); else jvParlerNav(t, apres); });
  }
  function jvParlerNav(t, apres){
    if(!window.speechSynthesis){ if(apres) apres(); return; }
    try{
      speechSynthesis.cancel();
      var txt = String(t).replace(/\*\*/g, "").replace(/^\s*-\s+/gm, "").replace(/\n+/g, ". ").replace(/\.\s*\./g, ".");
      var u = new SpeechSynthesisUtterance(txt), v = jvVoixChoisie();
      if(v) u.voice = v; u.lang = v ? v.lang : "fr-FR"; u.rate = 0.97; u.pitch = 0.82;
      JV.parle = true; jvEtat(); hudDebut(txt);
      u.onboundary = function(ev){ hudMot(ev.charIndex); };
      u.onend = u.onerror = function(){ JV.parle = false; jvEtat(); hudFin(); if(apres) apres(); };
      speechSynthesis.speak(u);
    }catch(e){ JV.parle = false; if(apres) apres(); }
  }
  function jvEtat(){
    var e = document.querySelector("#jarvis .jv-etat"); if(!e) return;
    var t = JV.ecoute ? "Je t’écoute…" : JV.parle ? "Jarvis parle…" : JV.enCours ? "Je cherche dans la Régie…" : JV.conv ? "Mode conversation actif" : "";
    e.textContent = t; e.hidden = !t;
    var jv = document.getElementById("jarvis"); if(jv){ jv.classList.toggle("ecoute", !!JV.ecoute); jv.classList.toggle("parle", !!JV.parle); }
    var c = document.querySelector("[data-jvconv]"); if(c) c.setAttribute("aria-pressed", !!JV.conv);
  }
  function jvDemander(q, vu){
    q = String(q || "").trim(); if(!q || JV.enCours) return;
    var histo = JV.msgs.slice(-12).map(function(m){ return { role:m.role, content:m.content }; });
    JV.msgs.push(vu ? { role:"user", content:q, vu:vu } : { role:"user", content:q }); var rep = { role:"assistant", content:"" }; JV.msgs.push(rep);
    JV.enCours = true; jvRendre();
    var code = ""; try{ code = sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){}
    function fin(txt){ if(txt) rep.content = txt; JV.enCours = false; if(!rep.content) rep.content = "Je n’ai pas de réponse."; jvSauver(); jvRendre(); jvParler(rep.content, function(){ if(JV.conv && JV.ouvert) setTimeout(function(){ jvEcouter(true); }, 250); }); }
    if(!EN_LIGNE){ fin("Jarvis a besoin de la connexion à la Régie (mode démonstration)."); return; }
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/regie-jarvis", {
      method:"POST", headers:{ "apikey":CFG.SUPABASE_KEY, "x-regie-code":code, "Content-Type":"application/json" },
      body:JSON.stringify({ question:q, historique:histo, moi:MOI || "", vue:VUE })
    }).then(function(r){
      if(r.status === 503) return fin("Je ne suis pas encore branché : il manque la clé ANTHROPIC_API_KEY dans Supabase (Edge Functions › Secrets).");
      if(r.status === 401) return fin("Le code d’équipe n’est pas reconnu : recharge la page et entre-le à nouveau.");
      if(!r.ok || !r.body) return fin("Je n’ai pas pu répondre (erreur " + r.status + "). Réessaie dans un instant.");
      var lec = r.body.getReader(), dec = new TextDecoder();
      function lire(){ return lec.read().then(function(x){
        if(x.done){ fin(); return; }
        rep.content += dec.decode(x.value, { stream:true });
        var dern = document.querySelector("#jarvis .jv-m.lui:last-child"); if(dern){ dern.innerHTML = jvMd(rep.content); var f = dern.parentNode; f.scrollTop = f.scrollHeight; }
        return lire();
      }); }
      return lire();
    }).catch(function(){ fin("Pas de connexion : je n’ai pas pu joindre la Régie."); });
  }
  /* Écoute : une phrase, envoyée dès qu'on se tait. En mode conversation, Jarvis répond à voix haute puis réécoute. */
  var JV_STOP = /^(stop|arr[êe]te|merci jarvis|c'est tout|au revoir|fin de la conversation)\b/i;
  function jvEcouter(conv){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast("La reconnaissance vocale n’est pas disponible dans ce navigateur : utilise Chrome ou Safari."); JV.conv = false; jvEtat(); return; }

    if(JV.enCours) return;
    jvTaire();
    var r = new SR(), champ = document.getElementById("jvIn"), btn = document.querySelector("[data-jvmic]"), entendu = false;
    r.lang = "fr-FR"; r.interimResults = true; r.continuous = false;
    r.onresult = function(e){ var t = ""; for(var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; champ.value = t; entendu = true; };
    r.onend = function(){
      JV.ecoute = null; if(btn) btn.classList.remove("on");
      var q = champ.value.trim(); champ.value = "";
      if(q && JV_STOP.test(q)){ JV.conv = false; jvEtat(); jvParler("À ton service."); return; }
      if(q){ JV.vides = 0; jvDemander(q); return; }
      jvEtat();
      if(conv && JV.conv && JV.ouvert && (JV.vides = (JV.vides || 0) + 1) < 3) setTimeout(function(){ jvEcouter(true); }, 300);
      else if(conv && JV.conv){ JV.conv = false; JV.vides = 0; jvEtat(); toast("Mode conversation en pause : je n’entendais plus rien."); }
    };
    r.onerror = function(e){ if(e && (e.error === "not-allowed" || e.error === "service-not-allowed")){ JV.conv = false; toast("Autorise le micro pour parler à Jarvis (icône de la barre d’adresse)."); } };
    JV.ecoute = r; if(btn) btn.classList.add("on"); jvEtat();
    try{ r.start(); }catch(e){ JV.ecoute = null; if(btn) btn.classList.remove("on"); jvEtat(); }
  }
  function jvMicro(){ jvEcouter(false); }
  function jvConversation(){
    JV.conv = !JV.conv; JV.vides = 0;
    if(JV.conv){ JV.voix = true; try{ localStorage.setItem("sbtd-jarvis-voix", "1"); }catch(e){} jvRendre(); jvParler("Je t’écoute.", function(){ jvEcouter(true); }); }
    else { if(JV.ecoute) try{ JV.ecoute.abort(); }catch(e){} JV.ecoute = null; jvTaire(); jvRendre(); }

  /* Préchauffe la voix VoiceStudio à l'ouverture (le modèle met ~10 s à se charger la première fois). */
  function jvPrechauffer(){ if(!JV.voix || JV_VS.chaud) return; jvVsDispo().then(function(ok){ if(ok && !JV_VS.chaud){ JV_VS.chaud = true; jvVsGen("Bonjour.").catch(function(){ JV_VS.chaud = false; }); } }); }
  function jvOuvrir(v){ JV.ouvert = v == null ? !JV.ouvert : v; if(JV.ouvert) jvPrechauffer(); if(!JV.ouvert && JV.conv) jvConversation(); jvRendre(); if(JV.ouvert){ var c = document.getElementById("jvIn"); if(c) setTimeout(function(){ c.focus(); }, 50); } }

  /* ---------- Jarvis : séquence de démarrage façon HUD ----------
     Plein écran, ~4 s : anneaux holographiques, balayage, lignes de diagnostic avec les vrais chiffres
     de la Régie, puis « JARVIS — en ligne » et ouverture du volet. Son synthétisé discret (Web Audio).
     Jouée à la première ouverture de la session et avec le bouton ✦ du volet. Échap ou clic pour passer. */
  function jvSon(){
