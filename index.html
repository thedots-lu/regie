<style>
  :root{

    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{

  .brand{ display:flex; align-items:center; gap:10px; }

  .moi .bascule{ font:inherit; font-size:12.5px; padding:3px 10px; border-radius:999px; cursor:pointer;

  .kv .k{ flex:none; width:140px; font-size:12.5px; color:var(--muted); }
  .kv .v{ flex:1; font-weight:500; }
  @media (max-width:520px){
    .kv{ flex-direction:column; gap:1px; }
    .kv .k{ width:auto; }
  }
  .adr{ font-size:16px; font-weight:600; line-height:1.4; }
  a.maps{ display:inline-block; margin-top:8px; font-size:13.5px; color:var(--cyan); }
  .tel{ font-family:"IBM Plex Mono",monospace; font-size:15px; user-select:all; }

  .checks{ display:grid; gap:2px; }

        border-bottom:1px solid var(--line); }

  .chk .box{ width:17px; height:17px; border-radius:5px; border:1.6px solid var(--muted);

  .mpill{ flex:none; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em;

  input[type=text], input[type=date], input[type=time], input[type=tel], input[type=password], select, textarea{
    width:100%; font:inherit; font-size:15px; padding:9px 11px; color:var(--ink);

  }
  textarea{ min-height:74px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--cyan); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  @media (max-width:560px){ .row3{ grid-template-columns:1fr 1fr; } }

  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit;

  .btn:hover{ background:var(--surface-2); }
  .btn.lime{ background:var(--lime); border-color:var(--lime); color:var(--lime-ink); font-weight:700; }
  .btn.ghost{ color:var(--muted); }

  .btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }
  .actions{ display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; align-items:center; }

  .vide{ text-align:center; color:var(--muted); padding:44px 16px 34px; }
  .vide p{ margin:0 0 14px; }
  .bandeau{ margin-top:16px; border-left:3px solid var(--warn); background:var(--surface-2);

  .jours{ display:flex; gap:6px; flex-wrap:wrap; margin-top:15px; }

  .jbtn:hover{ background:rgba(255,255,255,.16); }

  .jcount{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em;
           text-transform:uppercase; opacity:.7; margin-top:14px; }
  .jour-f{ border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-top:10px; background:var(--surface-2); }

  .jour-f .jh button{ margin-left:auto; border:0; background:transparent; color:var(--err);

  .card .next{ margin-top:9px; background:var(--surface-2); border:1px solid var(--line);
               border-radius:9px; padding:8px 10px; font-size:13.5px; color:var(--ink-2); }
  .card .next b{ display:block; font-family:"IBM Plex Mono",monospace; font-size:10px;

  .card .next .eqline{ display:block; margin-top:4px; font-size:12.5px; color:var(--muted); }

  /* Mon planning */

  .kmini button:hover{ border-color:var(--muted); }

  .kmini .pt{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-top:3px; }

  .kfh .kfl{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.8; margin-top:12px; }

  .kplats{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  @media (max-width:520px){ .kplats{ grid-template-columns:1fr; } }
  .chk.kc.on span.t{ text-decoration:none; color:var(--ink); font-weight:600; }
  .kval{ padding:9px 0; border-bottom:1px solid var(--line); }
  .kval:last-child{ border-bottom:0; }

  .kval .kvs{ font-size:13.5px; }
  .kval .kvs.ok{ color:var(--ok); font-weight:600; } .kval .kvs.no{ color:var(--err); font-weight:600; }
  .kval .kvq{ font-size:12px; color:var(--muted); }
  .kval .kvc{ margin:4px 0 0; font-size:13.5px; color:var(--ink-2); white-space:pre-line; }
  .kval .actions{ margin-top:8px; }
  .kval .btn{ padding:6px 12px; font-size:13px; }
  .kdesc{ margin-top:12px; }
  .kdesc .kdh{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .kdesc .kdh label{ font-size:13px; font-weight:600; flex:1; }
  .kdesc .kdh .btn{ padding:4px 11px; font-size:12.5px; }
  .kdesc .kdh .btn.copie{ background:var(--lime); border-color:var(--lime); color:var(--lime-ink); }
  .kdesc textarea{ min-height:150px; font-size:14px; }
  .kres{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .kres > div{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  .kres .k{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .kres .v{ font-family:"Poppins",sans-serif; font-size:20px; font-weight:700; }
  .kres .d{ font-size:12px; color:var(--ink-2); }
  .kpied{ font-size:12.5px; color:var(--muted); margin-top:10px; }
  .ktable{ width:100%; border-collapse:collapse; font-size:13px; }
  .ktable th{ text-align:left; font-weight:600; font-size:11.5px; color:var(--muted); padding:5px 6px; border-bottom:1px solid var(--line); }
  .ktable td{ padding:6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .ktable td.n{ white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ktable tr.ign td{ color:var(--muted); }
  .kscroll{ overflow-x:auto; }

  .kstat .klead{ font-size:15px; margin:14px 0 4px; }
  .kcards{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px; }
  @media (max-width:560px){ .kcards{ grid-template-columns:1fr; } }
  .kcards > div{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow); }
  .kcards .pf{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .kcards .big{ font-family:"Poppins",sans-serif; font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .kcards .kv .k{ width:auto; flex:1; }
  .kbests{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:9px; }
  .kbests > div{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .kbests .k{ display:block; font-size:12px; color:var(--muted); }
  .kbests b{ display:block; font-size:14.5px; margin:2px 0; }
  .kbests .d{ display:block; font-size:12px; color:var(--ink-2); }
  .kbars{ display:flex; gap:6px; align-items:flex-end; overflow-x:auto; padding-bottom:4px; }
  .kbars button{ flex:1 0 46px; display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:none;
                 font:inherit; cursor:pointer; padding:4px 2px; border-radius:8px; color:var(--ink-2); }
  .kbars button.on{ background:var(--surface-3); }
  .kbars .mv{ font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--muted); }
  .kbars .st{ width:26px; display:flex; flex-direction:column; border-radius:4px 4px 0 0; overflow:hidden; }
  .kbars .st i{ display:block; }
  .kbars .ml{ font-size:11px; text-transform:capitalize; }
  .kleg{ font-size:12px; color:var(--muted); margin-top:6px; }
  .kleg i{ display:inline-block; width:10px; height:10px; border-radius:3px; vertical-align:-1px; margin:0 4px 0 10px; }
  .kleg i:first-child{ margin-left:0; }
  .kheat{ display:grid; grid-template-columns:80px repeat(4,minmax(64px,1fr)); gap:3px; min-width:360px; font-size:12px; }
  .kheat .hh{ font-size:11px; color:var(--muted); text-align:center; padding:3px 0; }
  .kheat .hd{ color:var(--ink-2); padding:6px 0; text-transform:capitalize; }
  .kheat .hc{ border-radius:6px; background:var(--surface-2); text-align:center; padding:6px 2px; font-family:"IBM Plex Mono",monospace; font-size:11px; }
  ul.kreco{ margin:0; padding-left:18px; }
  ul.kreco li{ padding:4px 0; font-size:14.5px; }

  @media print{
    @page{ margin:12mm; }
    body{ background:#fff; color:#000; font-size:11pt; }
    .top, .toast, .no-print, .actions{ display:none !important; }
    .wrap{ max-width:none; padding:0; }
    .terrain h2{ font-size:20pt; }
    .tblk, .thoraires > div{ box-shadow:none; border-color:#999; break-inside:avoid; }
    .tblk{ margin-bottom:6px; padding:8px 10px; }
    .chk{ break-inside:avoid; }
    a{ color:#000; text-decoration:none; }
  }

  /* ---------- espaces : Régie / KSF ---------- */
  .brand .espace{ display:inline-flex; align-items:center; gap:7px; border:1px solid transparent; background:transparent;
                  color:var(--ink); font:inherit; padding:3px 10px 3px 6px; border-radius:999px; cursor:pointer; }
  .brand .espace:hover{ border-color:var(--line); }
  .brand .espace[aria-current="page"]{ background:var(--surface-3); border-color:var(--line); }
  .brand .espace:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .brand .espace img{ width:24px; height:24px; border-radius:50%; display:block; }
  .brand .espace .nm{ font-family:"Space Mono",monospace; font-weight:700; font-size:14px; letter-spacing:.06em; }
  .brand .espace .c{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; background:var(--err); color:#fff;
                     border-radius:999px; padding:0 6px; line-height:16px; }
  .brand .sep{ width:1px; height:18px; background:var(--line); align-self:center; }

  /* La direction artistique Kamel Sans Filtre : bleu pétrole strié, vert néon, codes de caméra. */
  body.ksf{
    --ground:#04202D; --surface:rgba(9,48,66,.86); --surface-2:rgba(12,58,78,.78); --surface-3:rgba(18,74,96,.9);
    --ink:#EAF6F2; --ink-2:#B9D5DE; --muted:#7EA4B3; --line:rgba(140,200,220,.2);
    --navy:#06283A; --lime:#A8FF1F; --lime-ink:#0A2600; --cyan:#7FD6FF;
    --ok:#7BE3A6; --warn:#FFC266; --err:#FF7A5C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px -24px rgba(0,0,0,.9);
    color-scheme:dark;
    background-color:#04202D;
    background-image:
      radial-gradient(120% 70% at 50% 0%, rgba(4,32,45,0) 0%, rgba(2,20,29,.85) 100%),
      linear-gradient(90deg,
        rgba(120,170,190,.10) 0 4%, rgba(0,0,0,0) 4% 9%, rgba(140,190,210,.16) 9% 12%, rgba(0,0,0,0) 12% 19%,
        rgba(150,200,220,.22) 19% 22%, rgba(110,160,180,.08) 22% 28%, rgba(0,0,0,0) 28% 41%,
        rgba(120,170,190,.12) 41% 44%, rgba(0,0,0,0) 44% 58%, rgba(130,180,200,.09) 58% 63%,
        rgba(0,0,0,0) 63% 76%, rgba(120,170,190,.07) 76% 80%, rgba(0,0,0,0) 80%),
      linear-gradient(180deg, #0B3D53 0%, #04202D 70%);
    background-attachment:fixed;
  }
  /* ---- KSF simplifiée ---- */
  .kbar2{ display:flex; justify-content:flex-end; gap:8px; margin:14px 0 4px; }
  .kmenu{ position:relative; }
  .kmenu > summary{ list-style:none; cursor:pointer; }
  .kmenu > summary::-webkit-details-marker{ display:none; }
  .kmenu-l{ position:absolute; right:0; top:calc(100% + 6px); z-index:30; min-width:240px; display:flex; flex-direction:column; padding:6px;
            background:#06283A; border:1px solid var(--line); border-radius:14px; box-shadow:0 18px 40px -18px rgba(0,0,0,.9); }
  .kmenu-l button{ text-align:left; font:inherit; font-size:14px; color:var(--ink); background:transparent; border:0; border-radius:9px; padding:9px 12px; cursor:pointer; }
  .kmenu-l button:hover{ background:rgba(255,255,255,.06); }
  .kseg{ display:inline-flex; gap:2px; flex-wrap:wrap; margin:10px 0; }
  .kseg button{ font:inherit; font-size:14px; color:var(--ink-2); background:transparent; border:0; border-radius:99px; padding:7px 13px; cursor:pointer; }
  .kseg button.on{ background:rgba(168,255,31,.13); color:var(--lime); }
  .kseg.petit button{ font-size:13px; padding:6px 11px; }
  .kfil2{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .kpas{ font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .kmono{ font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .kmono.vert{ color:var(--lime); }
  .kalerte{ width:100%; display:flex; gap:12px; align-items:center; text-align:left; font:inherit; font-size:14px; color:var(--ink); cursor:pointer;
            background:rgba(255,122,92,.08); border:1px solid rgba(255,122,92,.45); border-radius:12px; padding:11px 14px; margin:10px 0 4px; }
  .kalerte .kmono{ color:var(--err); white-space:nowrap; }
  .kliste{ display:flex; flex-direction:column; margin-top:4px; }
  .krow{ display:grid; grid-template-columns:96px minmax(0,1fr) auto; gap:14px; align-items:center; text-align:left; font:inherit; color:var(--ink);
         background:transparent; border:0; border-top:1px solid var(--line); padding:13px 8px; cursor:pointer; border-radius:10px; }
  .krow:hover{ background:rgba(255,255,255,.04); }
  .krow .kd{ font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; flex-direction:column; gap:2px; }
  .krow .kd i{ font-style:normal; opacity:.75; }
  .krow .kd.late{ color:var(--err); }
  .krow .kt{ min-width:0; display:flex; flex-direction:column; }
  .krow .kt b{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .krow .kt small{ font-size:13px; color:var(--muted); }
  .krow .kr{ display:flex; align-items:center; gap:10px; }
  .kvu2{ font-size:13px; color:var(--muted); white-space:nowrap; }
  .kpill{ font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.06em; padding:3px 9px; border-radius:99px; border:1px solid; white-space:nowrap; }
  .kpill.todo{ color:var(--muted); border-color:rgba(126,164,179,.45); }
  .kpill.montage{ color:var(--cyan); border-color:rgba(127,214,255,.45); }
  .kpill.valid{ color:var(--warn); border-color:rgba(255,194,102,.5); }
  .kpill.sched{ color:var(--lime); border-color:rgba(168,255,31,.5); }
  .kpill.done{ color:var(--ok); border-color:rgba(123,227,166,.45); }
  .kpill.late{ color:var(--err); border-color:rgba(255,122,92,.55); }
  .kvide{ color:var(--muted); font-size:14px; padding:14px 8px; }
  .kh3{ font-size:15px; margin:26px 0 6px; color:var(--ink-2); }
  .ksuj2{ margin-top:16px; }
  .ksuj-t, .ksuj-ferme{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .ksuj-ferme{ width:100%; font:inherit; color:var(--ink); text-align:left; background:transparent; border:0; border-top:1px solid var(--line); padding:13px 6px; cursor:pointer; }
  .kinv{ font-size:19px; font-weight:600; }
  .ksuj-ferme .kinv{ font-size:15px; }
  .kdates{ font-size:13px; color:var(--muted); }
  .kprog2{ height:4px; border-radius:4px; background:rgba(255,255,255,.08); margin:10px 0 14px; overflow:hidden; display:flex; }
  .kprog2 .d{ background:var(--ok); } .kprog2 .s{ background:var(--lime); }
  .kbande{ display:grid; grid-template-columns:minmax(150px,1.8fr) repeat(auto-fill, minmax(92px,1fr)); gap:10px; align-items:end; }
  .kcarte{ font:inherit; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:14px; padding:5px; cursor:pointer; text-align:left; }
  .kcarte:hover{ background:rgba(255,255,255,.04); }
  .kvis{ position:relative; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; aspect-ratio:9/16; border-radius:10px; overflow:hidden;
         background:#0A3342; border:1px solid var(--line); padding:9px; }
  .kcarte.pod .kvis{ aspect-ratio:16/9; }
  .kvis img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .kph{ font-size:12px; color:rgba(255,255,255,.4); margin-bottom:auto; margin-top:18px; }
  .kpt{ font-size:11.5px; line-height:1.25; font-weight:600; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .klab{ position:absolute; left:7px; top:7px; font-family:"Space Mono",monospace; font-size:9px; letter-spacing:.08em; text-transform:uppercase;
         color:#fff; background:rgba(4,32,44,.75); padding:2px 6px; border-radius:6px; }
  .kdot{ position:absolute; right:7px; top:8px; width:9px; height:9px; border-radius:99px; background:var(--muted); box-shadow:0 0 0 2px rgba(4,32,44,.85); }
  .kdot.s-montage{ background:var(--cyan); } .kdot.s-valid{ background:var(--warn); } .kdot.s-sched{ background:var(--lime); } .kdot.s-done{ background:var(--ok); }
  .kdot.rouge{ background:var(--err); }
  .kcd{ display:block; margin-top:6px; font-family:"Space Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .kgerer{ margin-top:8px; font-size:13px; color:var(--muted); }
  .kgerer summary{ cursor:pointer; }
  .kback2{ margin:14px 0 8px; }
  .kfiche2{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 20px; }
  .kf-t{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .kf-t h2{ font-size:22px; margin:5px 0 2px; line-height:1.25; }
  .kplat2{ display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
  .kplat2 span{ font-size:12px; color:var(--ink-2); border:1px solid var(--line); border-radius:99px; padding:3px 10px; }
  .kvals2{ display:flex; gap:10px 22px; flex-wrap:wrap; align-items:center; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .kv2{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; color:var(--muted); }
  .kv2.ok{ color:var(--lime); } .kv2.no{ color:var(--err); }
  .kv2 .kvc{ width:100%; margin:0; font-size:13px; color:var(--ink-2); }
  .lien{ font:inherit; font-size:12.5px; color:var(--muted); background:none; border:0; text-decoration:underline; cursor:pointer; padding:0; }
  .btn.petit{ font-size:13px; padding:5px 11px; }
  .kbloc{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .kvals2 + .kbloc{ border-top:0; padding-top:0; }
  .kdtabs{ display:flex; align-items:center; gap:2px; border-bottom:1px solid var(--line); margin-bottom:10px; flex-wrap:wrap; }
  .kdtabs > button:not(.btn){ font:inherit; font-size:13px; color:var(--muted); background:none; border:0; border-bottom:2px solid transparent; padding:7px 10px; cursor:pointer; }
  .kdtabs > button.on{ color:var(--lime); border-bottom-color:var(--lime); }
  .kdlire{ white-space:pre-line; font-size:14.5px; line-height:1.6; margin:0; }
  .kyt3{ display:grid; grid-template-columns:auto 1fr auto auto; gap:8px 10px; align-items:center; margin-top:8px; }
  .kyt3 .l{ font-weight:700; color:var(--muted); }
  .kyt3 .t{ font-size:15px; line-height:1.4; overflow-wrap:anywhere; }
  .kyt3 .t.kytvide{ color:var(--muted); font-style:italic; }
  .kyt3 .n{ font-size:12px; color:var(--muted); white-space:nowrap; }
  .kyt3 .n.trop{ color:#e5484d; font-weight:700; }
  .kdlire.vide{ color:var(--muted); }
  .kdtxt{ min-height:180px; }
  .kres-t{ display:flex; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .kres-t b{ font-size:24px; color:var(--lime); }
  .kres-l{ display:grid; grid-template-columns:90px minmax(0,1fr) 92px; gap:12px; align-items:center; padding:6px 0; }
  .kres-n{ font-size:14px; }
  .kres-l small{ font-size:12px; color:var(--muted); }
  .kres-v{ text-align:right; font-weight:600; font-size:15px; display:flex; flex-direction:column; }
  .kres-v small{ font-weight:400; }
  .kbar3{ height:6px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:4px; }
  .kbar3 i{ display:block; height:100%; background:var(--lime); }
  .kchk{ list-style:none; padding:0; margin:8px 0 10px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:4px 16px; font-size:14px; color:var(--muted); }
  .kchk li.ok{ color:var(--ink); }
  .kconf{ margin-top:12px; border:1px solid rgba(168,255,31,.35); border-radius:14px; padding:14px 16px; background:rgba(168,255,31,.04); }
  .kconf-l{ border-top:1px solid var(--line); padding:10px 0; }
  .kconf-l p{ white-space:pre-line; font-size:14px; margin:6px 0 8px; }
  .kdepot{ display:flex; flex-direction:column; gap:4px; border:1.5px dashed var(--line); border-radius:12px; padding:14px 16px; margin:4px 0 12px; cursor:pointer; }
  .kdepot:hover, .kdepot.survol{ border-color:var(--lime, #c6f432); }
  .kdepot.ok{ flex-direction:row; align-items:center; gap:12px; border-style:solid; cursor:default; }
  .kdepot.ok span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kdepot .lien{ cursor:pointer; text-decoration:underline; font-size:13px; }
  .kdepot.en{ cursor:default; }
  .kmedias{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  .kmedias figure{ margin:0; }
  .kmedias figcaption{ font-size:12px; color:var(--muted, #8aa); margin-top:2px; }
  .kmedias img.kvidmini{ object-fit:cover; aspect-ratio:9/16; width:180px; }
  .kvidmini{ display:block; max-width:180px; max-height:320px; border-radius:10px; margin:8px 0 4px; background:#000; }
  .kplus2{ margin-top:12px; font-size:14px; }
  .kplus2 > summary{ cursor:pointer; color:var(--muted); }
  @media (max-width:640px){
    .krow{ grid-template-columns:70px minmax(0,1fr); }
    .krow .kr{ grid-column:2; }
    .kbande{ grid-template-columns:200px repeat(auto-fill, 100px); grid-auto-flow:column; grid-auto-columns:100px; overflow-x:auto; padding-bottom:6px; }
    .kres-l{ grid-template-columns:72px minmax(0,1fr) 70px; }
    .kfiche2{ padding:14px; }
  }

    var mois = function(d){ return d.toLocaleDateString("fr-FR", {month:"long"}); };
    if(ds.length === 1 || +a === +b)
      return majuscule(a.toLocaleDateString("fr-FR", {weekday:"long"})) + " "
           + jourNum(a) + " " + mois(a) + " " + a.getFullYear();
    if(a.getFullYear() !== b.getFullYear())
      return "Du " + jourNum(a) + " " + mois(a) + " " + a.getFullYear()
           + " au " + jourNum(b) + " " + mois(b) + " " + b.getFullYear();
    if(mois(a) !== mois(b))
      return "Du " + jourNum(a) + " " + mois(a) + " au " + jourNum(b) + " " + mois(b) + " " + b.getFullYear();
    return "Du " + jourNum(a) + " au " + jourNum(b) + " " + mois(b) + " " + b.getFullYear();
  }


  /* La première journée encore à venir d'un projet confirmé. */
  function prochaine(p){
    if(p.statut !== "Confirmé") return null;
    var js = (p.jours || []).slice().sort(function(a, b){
      return String(a.date || "9999").localeCompare(String(b.date || "9999"));
    });
    for(var i = 0; i < js.length; i++){
      var n = joursAvant(js[i].date);
      if(n == null || n >= 0) return js[i];
    }
    return null;
  }
  function enCours(p){ return p.statut !== "Confirmé" && p.statut !== "Publié"; }

  /* Les projets photo enregistrés avant que l'album ait ses propres
     champs rangeaient leur date et leur lien avec ceux du montage. */
  function migrerAlbum(t){
    if(mediaDe(t) !== "Photo" || t.type === "Montage") return t;
    if(!t.photoDate  && t.livDate){  t.photoDate  = t.livDate;  t.livDate  = ""; }
    if(!t.photoLien  && t.livLien){  t.photoLien  = t.livLien;  t.livLien  = ""; }
    if(!t.photoNotes && t.livNotes){ t.photoNotes = t.livNotes; t.livNotes = ""; }
    return t;
  }

  /* Reprise des fiches enregistrées avant le passage aux projets. */
  function normaliser(t){
    if(Array.isArray(t.jours) && t.jours.length){
      t.jours.forEach(function(j){
        if(!j.heurePat && j.heurePremier) j.heurePat = j.heurePremier;  // ancien nom du champ
        delete j.heurePremier;
        if(!Array.isArray(j.equipe)) j.equipe = j.equipe ? [String(j.equipe)] : [];
      });
      if(!Array.isArray(t.retours)) t.retours = [];
      migrerAlbum(t);
      return t;
    }
    var c = { id:t.id, client:t.client, projet:t.projet, type:t.type, dispositif:t.dispositif,
              format:t.format, intervenants:t.intervenants, questions:t.questions, notes:t.notes,
              statut:t.statut || "Confirmé", ssd:t.ssd, validant:t.validant, cree:t.cree };
    c.jours = [{ id:"j1", date:t.date||"", heureEquipe:t.heureEquipe||"", heurePat:t.heurePat||t.heurePremier||"",
                 heureFin:t.heureFin||"", duree:t.duree||"", lieu:t.lieu||"Notre studio",
                 adresse:t.adresse||"", acces:t.acces||"", contactNom:t.contactNom||"",
                 contactTel:t.contactTel||"", note:"", equipe:[], coches:t.coches||{} }];
    return c;
  }
  function sansId(p){
    var c = {}; for(var k in p) if(k !== "id") c[k] = p[k];
    return c;
  }

  /* ---------- ce qui manque avant le tournage ----------
     Deux niveaux : une information absente, et une information
     présente mais annoncée comme « à confirmer ».
     Pas de \b devant « à » : en JavaScript, une frontière de mot ne
     reconnaît pas les lettres accentuées. */
  var RE_CONF = /(^|[\s("',;:—–-])[àa]\s+(confirmer|pr[ée]ciser|d[ée]finir|organiser|fixer|faire|d[ée]signer|valider|voir)/i;
  function aConfirmer(v){ return typeof v === "string" && RE_CONF.test(v); }

  /* Les points d'un projet pour une journée donnée. */
  function controles(p, j){
    var out = [];
    function vide(c, q){ if(c) out.push({ n:"vide", q:q }); }
    function conf(v, q){ if(aConfirmer(v)) out.push({ n:"conf", q:q }); }
    var mtg = estMontage(p);
    if(apresTournage(p)){            // en post-production, le tournage est derrière nous
      var ph = photoSeule(p);
      var aVideo = faitVideo(p) || mtg, aPhoto = faitPhoto(p) && !mtg;
      vide(!p.ssd, ph ? "où sont les photos" : "où sont les rushes");
      vide(!p.validant, ph ? "qui valide la sélection" : "qui valide le montage");
      if(aVideo) vide(!p.livDate, aPhoto ? "la date de livraison du film" : "la date de livraison visée");
      if(aPhoto) vide(!p.photoDate, aVideo ? "la date de remise des photos" : "la date de remise de l'album");
      if(aVideo) conf(p.livNotes, "le brief de montage");
      if(aPhoto) conf(p.photoNotes, "le brief de retouche");
      conf(p.notes, "les consignes du projet");
      conf(p.validant, "le validant");
      return out;
    }
    if(j){
      vide(!j.date, "la date");
      vide(!equipeDe(j).length, "qui est sur la journée");
      conf(j.note, "la note du jour");
      if(!mtg){
        var dehors = j.lieu !== "Notre studio";
        vide(!j.heureEquipe, "l'heure d'arrivée de l'équipe");
        vide(!j.heureFin, "l'heure de fin");
        vide(dehors && !j.adresse, "l'adresse du lieu");
        vide(dehors && !j.contactNom, "le contact sur place");
        conf(j.adresse, "l'adresse");
        conf(j.acces, "l'accès");
        conf(j.contactNom, "le contact sur place");
      }
    }
    if(!mtg){
      vide(!captations(p).length, "ce qu'il faut réaliser (photo / vidéo)");
      if(faitPhoto(p) && faitVideo(p)){
        var orphelines = sansDest(p);
        if(orphelines.length) out.push({ n:"vide",
          q: orphelines.length === 1
               ? "où va « " + orphelines[0].quoi + " » : vidéo ou album"
               : orphelines.length + " prises sans destination (vidéo ou album)" });
      }
      if(aInterview(p)){
        vide(!p.intervenants, "les intervenants à l'écran");
        vide(!p.questions && !questionsAuto(p), "qui pose les questions");
        conf(p.intervenants, "les intervenants");
        conf(p.questions, "qui pose les questions");
      }
    }
    conf(p.notes, "les consignes du projet");
    return out;
  }

  /* Tous les points du projet, journées encore à venir comprises. */
  function controlesProjet(p){
    var js = (p.jours || []).filter(function(j){
      var n = joursAvant(j.date);
      return n == null || n >= 0;
    });
    if(!js.length) js = (p.jours || []).slice(-1);
    var tot = (p.jours || []).length, vus = {}, out = [];
    js.forEach(function(j){
      var rang = (p.jours || []).indexOf(j) + 1;
      controles(p, j).forEach(function(c){
        var propreAuJour = ["la date","l'heure d'arrivée de l'équipe","l'heure de fin",
                            "l'adresse du lieu","l'adresse","l'accès","le contact sur place",
                            "qui est sur la journée","la note du jour"].indexOf(c.q) >= 0;
        var cle = c.n + "|" + c.q + "|" + (propreAuJour ? rang : "");
        if(vus[cle]) return;
        vus[cle] = true;
        out.push({ n:c.n, q:c.q, jour: (propreAuJour && tot > 1) ? ("jour " + rang) : "" });
      });
    });
    return out;
  }

  /* Une valeur de fiche : absente, à confirmer, ou normale. */
  function val(v, quoiSiVide){
    if(!v) return '<span class="manque">' + esc(quoiSiVide || "À renseigner") + '</span>';
    var t = esc(v).replace(/\n/g, "<br>");
    return aConfirmer(v) ? '<span class="conf">' + t + '</span>' : t;
  }

  /* ---------- export calendrier ----------
     Un fichier .ics par projet ou pour tout le planning : chaque
     journée devient un événement, importable dans Google Agenda,
     Apple Calendrier ou Outlook. */
  function icsEsc(s){
    return String(s == null ? "" : s)
      .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }
  function plier(l){
    var out = [], s = l;
    while(s.length > 73){ out.push(s.slice(0, 73)); s = " " + s.slice(73); }
    out.push(s);
    return out.join("\r\n");
  }
  function icsJour(d){ return String(d || "").replace(/-/g, ""); }
  function icsHeure(h){ var q = String(h || "").split(":"); return q.length === 2 ? q[0] + q[1] + "00" : null; }
  function demain(d){
    var o = dateObj(d); if(!o) return icsJour(d);
    o.setDate(o.getDate() + 1);
    return "" + o.getFullYear() + ("0" + (o.getMonth() + 1)).slice(-2) + ("0" + o.getDate()).slice(-2);
  }
  function ics(projets){
    var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Studio by The Dots//Regie//FR",
             "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Régie — Studio by The Dots"];
    var stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    projets.forEach(function(p){
      var js = p.jours || [], tot = js.length;
      js.forEach(function(j, i){
        if(!j.date) return;
        if(filtreActif() && !surLeJour(j)) return;
        var deb = icsHeure(j.heureEquipe), fin = icsHeure(j.heureFin);
        var titre = (p.client || "Tournage") + (p.projet ? " — " + p.projet : "")
                  + (tot > 1 ? " (jour " + (i + 1) + "/" + tot + ")" : "");
        var lieu = j.lieu === "Notre studio" ? STUDIO_ADR : (j.adresse || "");
        var desc = [];
        if(typesDe(p).length) desc.push("Prestation : " + libType(p));
        if(p.format) desc.push("Format : " + p.format);
        if(p.dispositif && p.dispositif !== "Sans objet") desc.push("Dispositif : " + p.dispositif);
        if(j.heurePat) desc.push("PAT : " + j.heurePat);
        if(j.acces) desc.push("Accès : " + j.acces);
        if(j.contactNom) desc.push("Contact sur place : " + j.contactNom + (j.contactTel ? " — " + j.contactTel : ""));
        if(equipeDe(j).length) desc.push("Équipe : " + equipeDe(j).join(", "));
        if(p.intervenants) desc.push("À l'écran : " + p.intervenants);
        if(j.note) desc.push(j.note);
        var c = controles(p, j);
        if(c.length) desc.push("À régler : " + c.map(function(x){ return x.q + " (" + (x.n === "vide" ? "manque" : "à confirmer") + ")"; }).join(", "));

        L.push("BEGIN:VEVENT");
        L.push("UID:" + (p.id || "projet") + "-" + (j.id || i) + "@thedots.lu");
        L.push("DTSTAMP:" + stamp);
        if(deb){
          L.push("DTSTART:" + icsJour(j.date) + "T" + deb);
          L.push("DTEND:" + icsJour(j.date) + "T" + (fin || deb));
        } else {
          L.push("DTSTART;VALUE=DATE:" + icsJour(j.date));
          L.push("DTEND;VALUE=DATE:" + demain(j.date));
        }
        L.push(plier("SUMMARY:" + icsEsc(titre)));
        if(lieu) L.push(plier("LOCATION:" + icsEsc(lieu)));
        if(desc.length) L.push(plier("DESCRIPTION:" + icsEsc(desc.join("\n"))));
        L.push("STATUS:CONFIRMED");
        if(deb){
          L.push("BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY",
                 plier("DESCRIPTION:" + icsEsc(titre)),"END:VALARM");
        }
        L.push("END:VEVENT");
      });
    });
    L.push("END:VCALENDAR");
    return L.join("\r\n");
  }
  function slug(s){
    return String(s || "regie").toLowerCase()
      .normalize ? String(s || "regie").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "regie"
      : "regie";
  }
  function telechargerIcs(projets, nom){
    var texte = ics(projets);
    if(!/BEGIN:VEVENT/.test(texte)){ toast("Aucune date à exporter."); return; }
    try{
      var blob = new Blob([texte], { type:"text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nom;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
      toast("Calendrier téléchargé.");
    }catch(e){ toast("Téléchargement impossible sur cet appareil."); }
  }

  /* ---------- carnet de contacts ----------
     Les contacts sur place saisis dans les fiches, sortis en vCard.
     Ouvrir le fichier sur un téléphone propose de créer la fiche
     directement dans l'application Contacts, déjà remplie. */
  function vcEsc(s){
    return String(s == null ? "" : s)
      .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,")
      .replace(/\r?\n/g, "\\n");
  }
  /* « Caroline Soetens (Grant Thornton) » → prénom Caroline, nom Soetens. */
  function nomPrenom(brut){
    var s = String(brut || "").replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
    if(!s) return null;
    var m = s.split(" ");
    if(m.length === 1) return { prenom:"", nom:m[0], complet:s };
    return { prenom:m[0], nom:m.slice(1).join(" "), complet:s };
  }
  function telPropre(t){ return String(t || "").replace(/[^\d+]/g, ""); }

  /* Une fiche contact, qu'elle vienne d'une journée de tournage
     ou qu'elle ait été créée à la main dans le carnet. */
  function fichesDe(p){
    var vus = {}, out = [];
    (p.jours || []).forEach(function(j){
      var brut = j.contactNom || "";
      if(!brut.trim() && !j.contactTel && !j.contactMail) return;
      var n = j.contactSplit && (j.contactSplit.nom || j.contactSplit.prenom)
            ? { prenom:j.contactSplit.prenom || "", nom:j.contactSplit.nom || "",
                complet:((j.contactSplit.prenom || "") + " " + (j.contactSplit.nom || "")).trim() }
            : (nomPrenom(brut) || { prenom:"", nom:"", complet:"" });
      var cle = (n.complet + "|" + telPropre(j.contactTel)).toLowerCase();
      if(vus[cle]) return;
      vus[cle] = 1;
      out.push({
        src:"jour", pid:p.id, jid:j.id,
        prenom:n.prenom, nom:n.nom, complet:n.complet,
        societe: j.contactSociete || p.projet || p.client || "",
        fonction: j.contactFonction || "",
        tel: j.contactTel || "", mail: j.contactMail || "",
        notes: "",
        projet: p.projet || "", client: p.client || "", type: p.type || "",
        date: j.date || "",
        lieu: j.lieu === "Notre studio" ? (CFG.STUDIO || "Notre studio") : (j.adresse || ""),
        acces: j.acces || ""
      });
    });
    return out;
  }
  function ficheLibre(c){
    var complet = ((c.prenom || "") + " " + (c.nom || "")).trim();
    return {
      src:"libre", cid:c.id,
      prenom:c.prenom || "", nom:c.nom || "", complet:complet,
      societe:c.societe || "", fonction:c.fonction || "",
      tel:c.tel || "", mail:c.mail || "", notes:c.notes || "",
      projet:"", client:"", type:"", date:"", lieu:"", acces:""
    };
  }
  function carnet(){
    var out = [];
    P.forEach(function(p){ fichesDe(p).forEach(function(c){ out.push(c); }); });
    CT.forEach(function(c){ out.push(ficheLibre(c)); });
    return out.sort(function(a, b){
      return (a.nom || a.complet).localeCompare(b.nom || b.complet, "fr")
          || (a.prenom || "").localeCompare(b.prenom || "", "fr");
    });
  }
  function ficheDe(ref){
    var L = carnet();
    for(var i = 0; i < L.length; i++){
      var c = L[i];
      if(ref.src === "libre" && c.src === "libre" && c.cid === ref.cid) return c;
      if(ref.src === "jour" && c.src === "jour" && c.pid === ref.pid && c.jid === ref.jid) return c;
    }
    return null;
  }

  function vcard(c){
    var note = [];
    if(c.client && c.client !== c.societe) note.push("Client : " + c.client);
    if(c.type)  note.push("Prestation : " + c.type);
    if(c.date)  note.push("Tournage du " + jourLong(c.date));
    if(c.lieu)  note.push("Lieu : " + c.lieu);
    if(c.acces) note.push("Accès : " + c.acces);
    if(c.notes) note.push(c.notes);
    note.push("Fiche créée depuis la Régie — Studio by The Dots");

    var L = ["BEGIN:VCARD", "VERSION:3.0"];
    L.push("N:" + vcEsc(c.nom) + ";" + vcEsc(c.prenom) + ";;;");
    L.push("FN:" + vcEsc(c.complet || c.societe || "Contact"));
    if(c.societe)  L.push("ORG:" + vcEsc(c.societe));
    if(c.fonction) L.push("TITLE:" + vcEsc(c.fonction));
    if(c.tel)  L.push("TEL;TYPE=CELL:" + vcEsc(c.tel));
    if(c.mail) L.push("EMAIL;TYPE=WORK:" + vcEsc(c.mail));
    if(c.lieu) L.push("ADR;TYPE=WORK:;;" + vcEsc(c.lieu) + ";;;;");
    L.push(plier("NOTE:" + vcEsc(note.join("\n"))));
    L.push("END:VCARD");
    return L.join("\r\n");
  }

  /* iPhone et iPad ouvrent une vCard dans Contacts si on l'affiche ;
     s'ils la téléchargent, elle atterrit dans Fichiers et il faut aller
     la rechercher. On leur sert donc le lien plutôt que le fichier. */
  function estApple(){
    var ua = navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua)
        || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  }
  function ajouterAuxContacts(liste, nom){
    if(!liste.length){ toast("Aucun contact à ajouter."); return; }
    var texte = liste.map(vcard).join("\r\n");
    try{
      var blob = new Blob([texte], { type:"text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      if(estApple()){
        a.target = "_blank";            // Safari affiche la fiche : « Créer un contact »
        a.rel = "noopener";
      } else {
        a.download = nom;
      }
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
      toast(estApple()
        ? (liste.length > 1 ? liste.length + " fiches — touchez « Ajouter tous les contacts »."
                            : "Touchez « Créer un contact » pour l'enregistrer.")
        : (liste.length > 1 ? liste.length + " contacts prêts à ajouter."
                            : "Ouvrez le fichier : Contacts proposera de l'ajouter."));
    }catch(e){ toast("Ajout impossible sur cet appareil."); }
  }

  /* ---------- couche données ---------- */
  /* Tout passe par la fonction « regie-db », qui vérifie le code d'équipe côté serveur. */
  function codeEquipe(){ try{ return sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){ return ""; } }
  function net(chemin, opts){
    opts = opts || {};
    var h = { "apikey": CFG.SUPABASE_KEY, "Content-Type": "application/json", "x-regie-code": codeEquipe() };
    if(opts.retour) h["Prefer"] = "return=representation";
    return fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/regie-db/" + chemin, {
      method: opts.method || "GET", headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      if(r.status === 401){   // code changé ou session effacée : on repart sur l'écran du code
        try{ sessionStorage.removeItem("sbtd-regie-ok"); sessionStorage.removeItem("sbtd-regie-code"); }catch(e){}
        location.reload();
        throw new Error("Code d'équipe demandé.");
      }
      if(!r.ok) return r.text().then(function(t){ throw new Error(t || ("HTTP " + r.status)); });
      return r.status === 204 ? null : r.json();
    });
  }
  function localSet(arr){ try{ localStorage.setItem(DEMO, JSON.stringify(arr)); }catch(e){} }
  function local(){
    var v = null;
    try{ v = localStorage.getItem(DEMO); }catch(e){}
    if(v == null){
      var d = DEPART.map(function(p, i){
        var c = { id: "dep-" + (i+1) };
        for(var k in p) c[k] = p[k];
        return c;
      });
      localSet(d);
      return d;
    }
    try{ return JSON.parse(v) || []; }catch(e){ return []; }
  }
  function etat(s){ if(etatEl) etatEl.textContent = s; }

  /* La table accueille deux sortes de lignes : les projets, et les
     contacts saisis à la main (marqués kind:"contact"). */
  function estContact(x){ return !!x && x.kind === "contact"; }
  function estKsf(x){ return !!x && /^ksf-/.test(x.kind || ""); }
  var TA = [], REU = [];
  function estTache(x){ return !!x && x.kind === "tache"; }
  function estReunion(x){ return !!x && x.kind === "reunion"; }
  function repartir(tous){
    CT = (tous || []).filter(estContact);
    TA = (tous || []).filter(estTache);
    REU = (tous || []).filter(estReunion);
    KS = (tous || []).filter(function(x){ return x.kind === "ksf-post"; });
    KE = (tous || []).filter(function(x){ return x.kind === "ksf-episode"; });
    P  = (tous || []).filter(function(x){ return !estContact(x) && !estKsf(x) && !estTache(x) && !estReunion(x); }).map(normaliser);
  }

  function charger(silencieux){
    if(!EN_LIGNE){ repartir(local()); PRET = true; rendre(); return Promise.resolve(); }
    if(!silencieux) etat("chargement…");
    return net("tournages?select=id,data&order=id").then(function(rows){
      repartir((rows || []).map(function(r){
        var o = r.data || {}, c = { id: r.id };
        for(var k in o) c[k] = o[k];
        return c;
      }));
      ERREUR = ""; PRET = true; etat("à jour"); rendre();
    }, function(e){
      ERREUR = String(e.message || e); PRET = true; etat("hors ligne"); rendre();
    });
  }
  function creer(d){
    var quoi = estContact(d) ? "Contact créé." : estTache(d) ? "Tâche ajoutée." : estReunion(d) ? "Réunion enregistrée." : "Projet créé.";
    if(!EN_LIGNE){
      d.id = "loc-" + Date.now(); var a = local(); a.push(d); localSet(a);
      repartir(local()); rendre(); toast(quoi); return;
    }
    etat("envoi…");
    net("tournages", { method:"POST", body:{ data:sansId(d) }, retour:true })
      .then(function(){ toast(quoi); return charger(true); },
            function(){ etat("échec"); toast("Création impossible. Vérifiez la connexion."); });
  }
  function enregistrer(p, muet){
    if(!EN_LIGNE){
      var a = local().map(function(x){ return x.id === p.id ? p : x; });
      localSet(a); repartir(local()); if(!muet) toast("Enregistré."); rendre(); return;
    }
    etat("envoi…");
    net("tournages?id=eq." + encodeURIComponent(p.id), { method:"PATCH", body:{ data:sansId(p) } })
      .then(function(){ if(!muet) toast("Enregistré."); return charger(true); },
            function(){ etat("échec"); toast("Enregistrement impossible."); charger(true); });
  }
  function supprimer(id, quoi){
    quoi = quoi || "Projet supprimé.";
    if(!EN_LIGNE){
      localSet(local().filter(function(x){ return x.id !== id; }));
      repartir(local()); rendre(); toast(quoi); return;
    }
    net("tournages?id=eq." + encodeURIComponent(id), { method:"DELETE" })
      .then(function(){ toast(quoi); return charger(true); },
            function(){ toast("Suppression impossible."); });
  }

  /* ---------- calendrier ----------
     Deux lectures du même planning : le mois pour la vue d'ensemble,
     la semaine pour le détail des horaires. */
  var CAL = { mode:"mois", ref:null };
  var JOURS_SEM = ["lun","mar","mer","jeu","ven","sam","dim"];

  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function iso(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function midi(d){ var x = new Date(d); x.setHours(12, 0, 0, 0); return x; }
  function lundi(d){
    var x = midi(d), k = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - k);
    return x;
  }
  function plusJours(d, n){ var x = midi(d); x.setDate(x.getDate() + n); return x; }
  function memeJour(a, b){ return iso(a) === iso(b); }
  function refCal(){ return CAL.ref ? midi(CAL.ref) : midi(new Date()); }

  /* Toutes les journées de tournage, indexées par date. */
  function parJour(){
    var m = {};
    P.forEach(function(p){
      (p.jours || []).forEach(function(j){
        if(!j.date) return;
        if(filtreActif() && !surLeJour(j)) return;
        (m[j.date] = m[j.date] || []).push({ p:p, j:j });
      });
    });
    // Un même rendez-vous présent dans deux agendas (même titre, même jour, mêmes heures) n'est montré qu'une fois.
    var vus = {};
    OL.evs.forEach(function(o){
      var cle = String(o.titre || "").trim().toLowerCase().replace(/\s+/g, " ") + "|" + o.du + "|" + o.au + "|" + o.h + "|" + o.hFin;
      if(vus[cle]) return;
      vus[cle] = 1;
      var d = o.du, garde = 0;
      while(d && d <= o.au && garde++ < 62){
        (m[d] = m[d] || []).push({ o:o });
        d = iso(plusJours(new Date(d + "T12:00:00"), 1));
      }
    });
    function cle(x){ return x.o ? (x.o.journee ? "00" : x.o.h) : String(x.j.heureEquipe || "99"); }
    Object.keys(m).forEach(function(k){
      m[k].sort(function(a, b){ return cle(a).localeCompare(cle(b)); });
    });
    return m;
  }

  /* ---------- agenda Outlook ----------
     Une fonction Supabase (outlook-agenda) lit l'agenda publié par Outlook et
     ne le renvoie qu'avec le code d'équipe. */
  var OL = { evs:[], agendas:[], at:0, err:"", enCours:false };
  var OL_COULEURS = ["#9B7BFF","#FF7EB6","#3FD0C9","#FFB547","#7FB2FF","#C8E06B"];
  function olCouleur(i){ return OL_COULEURS[(i || 0) % OL_COULEURS.length]; }
  function olNom(i){ var a = OL.agendas[i || 0]; return a && a.nom ? a.nom : "Outlook"; }
  var OL_CLE = "sbtd-outlook";
  (function(){ try{ var v = JSON.parse(sessionStorage.getItem(OL_CLE) || "null"); if(v && v.evs){ OL.evs = v.evs; OL.agendas = v.agendas || []; OL.at = v.at || 0; } }catch(e){} })();
  function olCharger(force){
    if(!EN_LIGNE || OL.enCours) return;
    if(!force && Date.now() - OL.at < 5 * 60e3) return;
    var code = ""; try{ code = sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){}
    OL.enCours = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/outlook-agenda" + (force ? "?force=1" : ""),
          { headers:{ "apikey":CFG.SUPABASE_KEY, "x-regie-code":code } })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){
        OL.enCours = false;
        if(!x.ok || !x.j || !x.j.evs){ OL.err = (x.j && x.j.error) || "outlook"; return; }
        OL.evs = x.j.evs; OL.agendas = x.j.agendas || []; OL.at = Date.now(); OL.err = "";
        try{ sessionStorage.setItem(OL_CLE, JSON.stringify({ at:OL.at, evs:OL.evs, agendas:OL.agendas })); }catch(e){}
        if(VUE === "cal") rendre();
      }, function(){ OL.enCours = false; OL.err = "reseau"; });
  }
  /* ---------- planning personnel ----------
     Refait chaque lundi par une tâche de Claude (agenda Outlook, mails, DotsFlow, Régie)
     et rangé dans la table « plannings », lisible seulement via la fonction « planning »
     avec le code d'équipe. L'onglet n'apparaît que pour la personne choisie dans « Vous êtes ». */
  var PL = { pour:"", data:null, maj:"", at:0, enCours:false };
  function plCharger(force){
    var qui = String(MOI || "").trim().split(/\s+/)[0].toLowerCase();
    if(!qui){ if(PL.data){ PL.data = null; PL.pour = ""; rendre(); } return; }
    if(!EN_LIGNE || PL.enCours) return;
    if(!force && PL.pour === qui && Date.now() - PL.at < 5 * 60e3) return;
    var code = ""; try{ code = sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){}
    PL.enCours = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/planning?pour=" + encodeURIComponent(qui),
          { headers:{ "apikey":CFG.SUPABASE_KEY, "x-regie-code":code } })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){
        PL.enCours = false; PL.pour = qui; PL.at = Date.now();
        var avant = !!PL.data;
        PL.data = x.ok && x.j && x.j.planning ? x.j.planning : null;
        PL.maj = x.ok && x.j ? x.j.maj : "";
        if(VUE === "planning" || avant !== !!PL.data) rendre(); else rendreTabs();
      }, function(){ PL.enCours = false; });
  }
  /* ---------- tâches ----------
     Lignes kind:"tache" : { titre, projet, detail, points[], assigne, statut, echeance, source, cle, cree, termineLe }.
     statut : "avenir" | "encours" | "attente" | "terminee". */
  var T_STATUTS = [["avenir","À venir"],["encours","En cours"],["attente","En attente"],["terminee","Terminée"]];
  var TV = { tous:false, ouvert:"" };
  function tQui(n){ return String(n || "").trim().split(/\s+/)[0].toLowerCase(); }
  function mesTaches(){
    var q = tQui(MOI);
    return TA.filter(function(t){ return !q || TV.tous || tQui(t.assigne) === q; });
  }
  /* Deux catégories dans « Mon planning » : les tournages (journées des projets de la Régie,
     plus les tâches marquées categorie:"tournage") et les autres tâches (montage, envoi, call…).
     Une tâche sans catégorie est classée en tournage si son titre parle de tournage ou de shooting. */
  var RE_TOURNAGE = /tournage|shooting|captation|filmer\b/i;
  /* Créations sans tournage : design, motion design, intro/outro, slides speaker, graphisme, animation, visuels… */
  var RE_CREATION = /design|motion|teaser|\bintro\b|outro|slide|graphi|animation|visuel|miniature|habillage|\blogo|save the date|affiche|carrousel|cr[ée]ation|jingle|g[ée]n[ée]rique/i;
  function tCat(t){
    if(t.categorie === "tournage" || t.categorie === "creation" || t.categorie === "ksf") return t.categorie;
    if(t.categorie === "tache") return "tache";
    return RE_TOURNAGE.test(t.titre || "") ? "tournage" : RE_CREATION.test((t.titre || "") + " " + (t.detail || "")) ? "creation" : "tache";
  }
  function tEstTournage(t){ return tCat(t) === "tournage"; }
  function mesTournages(){
    var auj = iso(new Date()), out = [];
    P.forEach(function(p){
      if(estMontage(p) || p.statut === "Publié") return;
      var js = p.jours || [], tot = js.length;
      js.forEach(function(j, i){
        if(!j.date || j.date < auj) return;
        if(MOI && !TV.tous && !surLeJour(j)) return;
        out.push({ p:p, j:j, rang:i + 1, tot:tot });
      });
    });
    return out.sort(function(a, b){ return (a.j.date + (a.j.heureEquipe || "")).localeCompare(b.j.date + (b.j.heureEquipe || "")); });
  }
  function tgLigne(x){
    var p = x.p, j = x.j, n = joursAvant(j.date);
    var lieu = j.lieu === "Notre studio" ? "Notre studio" : (j.adresse || j.lieu || "Lieu à préciser");
    var heures = j.heureEquipe ? j.heureEquipe + (j.heureFin ? "–" + j.heureFin : "") : "Horaire à préciser";
    return '<li class="tg-li"><button type="button" class="tg' + (VUE === "planning" && TV.psel === p.id ? ' sel' : '') + '" ' + (VUE === "planning" ? 'data-tpsel' : 'data-id') + '="' + esc(p.id) + '" data-jour="' + esc(j.id) + '">'
      + '<span class="d"><b>' + esc(jourCourt(j.date)) + '</b>' + esc(heures) + '</span>'
      + '<span class="w"><b>' + esc(p.client || "Client à préciser") + (p.projet ? ' — ' + esc(p.projet) : '') + '</b>'
      + '<small>' + esc(lieu) + (x.tot > 1 ? ' · jour ' + x.rang + ' sur ' + x.tot : '')
      + (equipeDe(j).length ? ' · avec ' + esc(equipeDe(j).join(", ")) : ' · personne d\'assigné') + '</small></span>'
      + '<span class="c">' + esc(compte(n)) + '</span></button>'
      + '<button type="button" class="tg-sup" data-tgsup="' + esc(p.id) + '|' + esc(j.id) + '" title="' + (x.tot > 1 ? 'Retirer cette journée du projet' : 'Supprimer ce tournage') + '">Supprimer</button></li>';
  }
  function tEnRetard(t){ return !!t.echeance && t.echeance < iso(new Date()) && t.statut !== "terminee"; }
  function tSaisie(){ var a = document.activeElement; return !!(a && a.closest && a.closest(".tk-add, .ru-add, .ru-notes")); }
  function tTri(a, b){
    var ea = a.echeance || "9999", eb = b.echeance || "9999";
    return ea.localeCompare(eb) || String(a.cree || "").localeCompare(String(b.cree || ""));
  }
  /* ---------- Tâches, façon maquette ----------
     Trois colonnes sur grand écran : menu (espaces), liste, panneau de la tâche choisie.
     Sur téléphone, les espaces passent en pastilles et le panneau s'ouvre sous la liste.
     Champs ajoutés aux tâches :
       avancement  0 | 25 | 50 | 75 | 100 (Brief, Dérush, Montage, Retours, Livré)
       attente     { qui, motif, depuis }  — de qui on attend, pourquoi, depuis quand
       coms        [{ id, qui, le, txt }]  — commentaires, liens et anecdotes
       hist        [{ le, qui, txt }]      — changements de statut et d'avancement
       livraison   { to:[], liens:[], le, canal } — trace d'envoi au client
       projetId    id du projet de la Régie lié (sinon rapprochement par le nom) */
  var T_AV = [[0,"Brief"],[25,"Dérush"],[50,"Montage"],[75,"Retours"],[100,"Livré"]];
  var T_ESP = [
    { k:"tournages", l:"Tournages",  c:"var(--lime)" },
    { k:"creation",  l:"Création",   c:"#f08a4b" },
    { k:"ksf",       l:"KSF",        c:"#A8FF1F" },
    { k:"attente",   l:"En attente", c:"#9d8cff" },
    { k:"terminee",  l:"Terminées",  c:"#5fbf86" }
  ];
  if(!TV.espace || TV.espace === "encours" || TV.espace === "agenda") TV.espace = "tournages";
  function tAv(t){ var v = +t.avancement; return isNaN(v) ? (t.statut === "terminee" ? 100 : 0) : v; }
  function tComs(t){ return Array.isArray(t.coms) ? t.coms : []; }
  function tLiv(t){ var l = t.livraison || {}; return { to: Array.isArray(l.to) ? l.to : [], liens: Array.isArray(l.liens) ? l.liens : [], le: l.le || "", canal: l.canal || "" }; }
  function tNorm(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
  /* Le projet de la Régie qui correspond à la tâche : lien explicite, sinon même nom de client ou de projet. */
  function tProjet(t){
    if(t.projetId){ var p0 = P.filter(function(x){ return x.id === t.projetId; })[0]; if(p0) return p0; }
    var n = tNorm(t.projet); if(!n) return null;
    var c = P.filter(function(x){ var a = tNorm(x.client), b = tNorm(x.projet);
      return a === n || b === n || (a && (a.indexOf(n) >= 0 || n.indexOf(a) >= 0)) || (b && b.indexOf(n) >= 0); });
    // plusieurs projets du même nom (ex. « 90s Outside ») : on garde celui dont le client apparaît dans le titre de la tâche
    var titre = " " + tNorm(t.titre) + " ";
    function score(x){ return (tNorm(x.client) + " " + tNorm(x.projet)).split(" ").filter(function(w){ return w.length > 2 && titre.indexOf(" " + w + " ") >= 0; }).length; }
    if(c.length > 1){ var best = Math.max.apply(null, c.map(score)); if(best > 0) c = c.filter(function(x){ return score(x) === best; }); else return null; }
    return c.sort(function(a, b){ return String(b.cree || "").localeCompare(String(a.cree || "")); })[0] || null;
  }
  function tAvatar(n){
    var s = String(n || "?"), h = 0; for(var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return '<span class="tav" style="background:hsl(' + h + ',62%,78%)">' + esc(s.charAt(0).toUpperCase() || "?") + '</span>';
  }
  function tDepuis(d){
    if(!d) return "";
    var n = Math.round((new Date(iso(new Date()) + "T12:00:00") - new Date(String(d).slice(0, 10) + "T12:00:00")) / 864e5);
    if(isNaN(n) || n < 0) return "";
    return n === 0 ? "depuis aujourd'hui" : n < 14 ? "depuis " + n + " jour" + (n > 1 ? "s" : "") : "depuis " + Math.round(n / 7) + " sem.";
  }
  function tLiens(txt){
    return esc(txt).replace(/(https?:\/\/[^\s<]+)/g, function(u){ return '<a href="' + u + '" target="_blank" rel="noopener">' + u.replace(/^https?:\/\/(www\.)?/, "").slice(0, 48) + (u.length > 60 ? "…" : "") + '</a>'; });
  }
  function tEspace(t){ return t.statut || "avenir"; }
  /* Projets « Création » de la Régie pas encore publiés (affichés dans l'espace Création). */
  function mesCreations(){ return P.filter(function(p){ return estCreation(p) && p.statut !== "Publié"; }).sort(parDebut); }
  function tListe(k){
    // Création : toutes les créations pas encore terminées ; En cours : les autres tâches commencées ou pas encore commencées ;
    // En attente et Terminées : toutes les tâches, quelle que soit leur catégorie.
    var l = mesTaches().filter(function(t){
      var st = tEspace(t), c = tCat(t);
      if(k === "ksf") return tEstKsf(t) && st !== "terminee";
      if(k === "tournages") return !tEstKsf(t) && st !== "terminee" && st !== "attente" && (c === "tournage" || (c === "tache" && (st === "encours" || st === "avenir")));
      if(k === "creation") return c === "creation" && !tEstKsf(t) && st !== "terminee";
      if(k === "encours") return c === "tache" && !tEstKsf(t) && (st === "encours" || st === "avenir");
      return st === k;
    });
    if(k === "terminee") return l.sort(function(a, b){ return String(b.termineLe || "").localeCompare(String(a.termineLe || "")); });
    if(k === "attente") return l.sort(function(a, b){ return String((a.attente || {}).depuis || "9").localeCompare(String((b.attente || {}).depuis || "9")) || tTri(a, b); });
    return l.sort(tTri);
  }
  function tCompte(k){
    if(k === "tournages") return mesTournages().length + tListe("tournages").length;
    if(k === "creation") return tListe(k).length + mesCreations().length;
    if(k === "agenda") return "";
    if(k === "ksf") return tListe(k).length + tKsfPosts().length + tKsfRetard().length;
    return tListe(k).length;
  }

  /* Une carte de la liste. */
  function tCarte(t){
    var st = tEspace(t), retard = tEnRetard(t), av = tAv(t), lv = tLiv(t), at = t.attente || {};
    var droite = "";
    if(st === "attente") droite = '<span class="tw">⏳ ' + esc(at.qui || at.motif || "Motif à préciser") + '</span><span class="tsm">' + esc(tDepuis(at.depuis) || "") + '</span>';
    else if(st === "terminee") droite = lv.to.length ? '<span class="tw ok">✉ Envoyée à ' + lv.to.length + ' contact' + (lv.to.length > 1 ? 's' : '') + '</span>' + (lv.liens.length ? '<span class="tsm">+ lien</span>' : '')
                                                     : '<span class="tw warn">⚠ Destinataire à renseigner</span>';
    else droite = '<span class="tbar"><b style="width:' + av + '%"></b></span><span class="tsm">' + av + ' %</span>';
    return '<button type="button" class="tk2' + (TV.sel === t.id ? ' sel' : '') + '" data-tsel="' + esc(t.id) + '">'
      + '<span class="tl"><span class="tt">' + esc(t.titre || "Tâche") + '</span>'
      + (t.projet ? '<span class="ttag">' + esc(t.projet) + '</span>' : '')
      + (retard ? '<span class="tbadge late">En retard</span>' : '')
      + ((TV.espace === "creation" || TV.espace === "tournages") ? '<span class="tbadge">' + esc((T_STATUTS.filter(function(x){ return x[0] === st; })[0] || [0, ""])[1]) + '</span>' : '') + '</span>'
      + '<span class="tm">' + (st === "terminee" && t.termineLe ? '<span>Terminée ' + esc(jourCourt(String(t.termineLe).slice(0, 10))) + '</span>'
                              : '<span>' + (t.echeance ? 'Échéance ' + esc(jourCourt(t.echeance)) : 'Sans échéance') + '</span>')
      + '<span class="twho">' + tAvatar(t.assigne || "?") + esc(t.assigne || "Personne") + '</span>'
      + (tComs(t).length ? '<span>💬 ' + tComs(t).length + '</span>' : '') + '</span>'
      + '<span class="tr">' + droite + '</span></button>';
  }

  /* Le panneau de droite : tout sur la tâche choisie. */
  function tPanneau(t){
    if(!t) return '<aside class="tpan vide"><p>Choisissez une tâche pour voir son avancement, ses commentaires, le projet lié et la livraison.</p></aside>';
    var st = tEspace(t), av = tAv(t), at = t.attente || {}, lv = tLiv(t), p = tProjet(t);
    var equipe = equipeConnue(); if(t.assigne && equipe.indexOf(t.assigne) < 0) equipe.push(t.assigne);
    var lib = (T_STATUTS.filter(function(x){ return x[0] === st; })[0] || [0, ""])[1];
    var h = '<aside class="tpan" aria-label="Tâche">'
      + '<div class="tcrumb"><span>Tâche · ' + esc(lib) + '</span><button type="button" data-tferme="1" aria-label="Fermer">✕</button></div>'
      + '<h2>' + esc(t.titre || "Tâche") + '</h2>'
      + '<div class="tkv"><div><small>Projet</small>' + (p ? '<button type="button" class="tlien" data-id="' + esc(p.id) + '">' + esc(t.projet || p.client) + ' ↗</button>' : '<span>' + esc(t.projet || "—") + '</span>') + '</div>'
      + '<div><small>Assignée</small><select data-tassigne="' + esc(t.id) + '"><option value="">Personne</option>'
      + equipe.map(function(n){ return '<option' + (n === t.assigne ? " selected" : "") + '>' + esc(n) + '</option>'; }).join("") + '</select></div>'
      + '<div><small>Échéance</small><input type="date" data-tech="' + esc(t.id) + '" value="' + esc(t.echeance || "") + '"' + (tEnRetard(t) ? ' class="late"' : '') + '></div></div>'
      + '<div class="tk-st" role="group" aria-label="Statut">' + T_STATUTS.map(function(x){
          return '<button type="button" data-tstat="' + x[0] + '" data-tid="' + esc(t.id) + '" aria-pressed="' + (st === x[0] ? "true" : "false") + '">' + x[1] + '</button>'; }).join("") + '</div>';

    // avancement
    h += '<section class="tbox"><div class="tbt">Avancement <b>' + av + ' %</b></div>'
      + '<input type="range" class="tslider" min="0" max="100" step="25" value="' + av + '" data-tav="' + esc(t.id) + '" style="--v:' + av + '%" aria-label="Avancement">'
      + '<div class="tsteps">' + T_AV.map(function(x){
          return '<button type="button" data-tavb="' + x[0] + '" data-tid="' + esc(t.id) + '" class="' + (x[0] <= av ? 'on' : '') + (x[0] === av ? ' cur' : '') + '"><b>' + x[0] + '</b>' + x[1] + '</button>'; }).join("") + '</div></section>';
    if(st === "attente") h += blocRelanceTache(t, p);

    // en attente / motif
    if(st === "attente"){
      h += '<section class="tbox att"><div class="tbt">En attente de <b>' + esc(at.depuis ? 'depuis le ' + jourCourt(String(at.depuis).slice(0, 10)) : '') + '</b></div>'
        + '<label class="tf"><span>De qui</span><input type="text" data-tatt="qui" data-tid="' + esc(t.id) + '" value="' + esc(at.qui || "") + '" placeholder="Jenna Savio, le client, Sidonie…"></label>'
        + '<label class="tf"><span>Pourquoi</span><input type="text" data-tatt="motif" data-tid="' + esc(t.id) + '" value="' + esc(at.motif || "") + '" placeholder="Retour sur la V4, nouveau texte, validation musique…"></label>'
        + '<div class="tchips"><button type="button" data-tstat="encours" data-tid="' + esc(t.id) + '">Repasser en cours</button>'

  /* Carnet d'adresses pour les propositions : contacts relevés dans les mails (ligne « contacts-mail »,
     mise à jour chaque lundi), carnet de la Régie, contacts client des projets. */
  var CM = { data:null, at:0, enCours:false };
  function cmCharger(){
    if(!EN_LIGNE || CM.enCours || Date.now() - CM.at < 30 * 60e3) return;
    var code = ""; try{ code = sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){}
    CM.enCours = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/planning?pour=contacts-mail", { headers:{ "apikey":CFG.SUPABASE_KEY, "x-regie-code":code } })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){ CM.enCours = false; CM.at = Date.now(); CM.data = x.ok && x.j && x.j.planning ? (x.j.planning.contacts || []) : [];
                         if(VUE === "planning" || VUE === "fiche"){ var d = document.getElementById("mailsConnus"); if(d) d.outerHTML = datalistMails(); } },
            function(){ CM.enCours = false; CM.at = Date.now(); });
  }
  function mailsConnus(){
    cmCharger();
    var vu = {}, out = [];
    function ajoute(email, nom, soc){
      email = String(email || "").trim().toLowerCase(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || vu[email]) return;
      vu[email] = 1; out.push({ email:email, nom:nom || "", soc:soc || "" });
    }
    (CM.data || []).forEach(function(c){ ajoute(c.email, c.nom, c.societe); });
    (CT || []).forEach(function(c){ ajoute(c.mail, ((c.prenom || "") + " " + (c.nom || "")).trim(), c.societe); });
    P.forEach(function(p){
      (Array.isArray(p.mailsClient) ? p.mailsClient : []).forEach(function(m){ ajoute(m, "", p.client); });
      (p.jours || []).forEach(function(j){ ajoute(j.contactMail, j.contactNom, p.client); });
    });
    return out;
  }
  function nomMail(m){ var c = mailsConnus().filter(function(x){ return x.email === m; })[0]; return c && c.nom ? c.nom + " · " + m : m; }
  function datalistMails(){
    return '<datalist id="mailsConnus">' + mailsConnus().map(function(c){
      return '<option value="' + esc(c.email) + '" label="' + esc((c.nom || c.email) + (c.soc ? " — " + c.soc : "")) + '">' + esc(c.nom || "") + '</option>'; }).join("") + '</datalist>';
  }
  /* Une saisie « Prénom Nom <adresse> » ou un nom connu → l'adresse. */
  function mailDe(v){
    v = String(v || "").trim();
    var m = v.match(/<([^>]+)>/); if(m) v = m[1];
    if(/@/.test(v)) return v.toLowerCase();
    var n = tNorm(v); if(!n) return "";
    var c = mailsConnus().filter(function(x){ return tNorm(x.nom) === n; });
    return c.length === 1 ? c[0].email : "";
  }
  /* Contacts client connus pour un projet (relevés dans les mails, rangés dans la fiche projet). */
  function tContactsProjet(p){
    if(!p) return [];
    var l = Array.isArray(p.mailsClient) ? p.mailsClient.slice() : [];
    (p.jours || []).forEach(function(j){ if(j.contactMail && l.indexOf(j.contactMail) < 0) l.push(j.contactMail); });
    return l.filter(function(m){ return /@/.test(m) && !/@thedots\.lu$/i.test(m); });
  }
  /* Fiche projet : contacts client et mail de livraison. */
  function blocLivraisonClient(p){
    var ms = tContactsProjet(p), env = p.livEnvoi;
    return '<div class="tbox liv" style="margin-top:12px">'
      + '<div class="tbt">Livraison au client ' + (env && env.le ? '<b class="ok">✓ envoyée le ' + esc(quandCourt(env.le)) + '</b>' : '') + '</div>'
      + '<div class="tf"><span>Contacts client</span><div class="tmails">'
      + (Array.isArray(p.mailsClient) ? p.mailsClient : []).map(function(m){ return '<span class="tmail">✉ ' + esc(m) + ' <button type="button" data-pmailsup="' + esc(m) + '" aria-label="Retirer">✕</button></span>'; }).join("")
      + '<form class="tmailf" data-pmailform="1"><input type="text" name="m" list="mailsConnus" autocomplete="off" placeholder="+ nom ou mail…" aria-label="Ajouter un contact client"></form></div></div>' + datalistMails()
      + '<div class="tchips">' + (ms.length
          ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(mailLivraison(ms, p, false)) + '" data-pmailgo="1">Mail : version à valider ↗</a>'
            + '<a class="btn lime" target="_blank" rel="noopener" href="' + esc(mailLivraison(ms, p, true)) + '" data-pmailgo="1">Mail : version finale ↗</a>'
          : '<span class="tsm warn">Ajoutez le mail du client pour préparer la livraison.</span>') + '</div></div>';
  }
  /* Le mail de livraison, sur le ton des mails du studio : « Hello {prénom} », tutoiement, lien Playbook seul sur sa ligne. */
  function nomLivraison(p){
    if(!p) return "";
    function net(x){ return String(x || "").replace(/\([^)]*\)/g, "").replace(/\s+/g, " ").trim(); }
    var c = net(p.client), j = net(p.projet);
    if(!j || tNorm(j) === tNorm(libType(p)) || tNorm(j) === tNorm(p.type)) return c || j;   // « 90s Outside » seul : on garde le nom du client
    return j;
  }
  function prenomDe(m){ var x = String(m || "").split("@")[0].split(/[._-]/)[0]; return /^(info|contact|marketing|hello|team|studio|communication)$/i.test(x) || x.length < 2 ? "" : x.charAt(0).toUpperCase() + x.slice(1); }
  /* Brouillon ouvert directement dans Outlook (web), sur le compte connecté — pas dans Mail d'Apple. */
  function outlookCompose(to, sujet, corps){
    return "https://outlook.office.com/mail/deeplink/compose?to=" + encodeURIComponent(to.join(","))
      + "&cc=" + encodeURIComponent("studio@thedots.lu")
      + "&subject=" + encodeURIComponent(sujet) + "&body=" + encodeURIComponent(corps);
  }
  /* Le mail de livraison, rédigé à partir du projet : quoi (vidéo, photos, 90s, KSF…), quelle version
     (première version à valider ou version finale), format, découpe, sous-titres, lien. Ton du studio :
     « Hello {prénom} », tutoiement, lien seul sur sa ligne. */
  function redigerLivraison(to, p, secours, finale){
    var pre = to.length === 1 ? prenomDe(to[0]) : "";
    var t = p ? p.type : "", photo = p ? faitPhoto(p) : false, video = p ? (faitVideo(p) || estMontage(p)) : true;
    var nom = nomLivraison(p) || (secours && (secours.projet || secours.titre)) || "";
    function url(x){ return /^https?:\/\//i.test(String(x || "").trim()) ? String(x).trim() : ""; }
    var lienV = url(secours && secours.lien) || url(p && p.livLien), lienP = url(p && p.photoLien);
    var aValider = !finale;
    var avecRetours = p && retours(p).some(function(r){ return r.fait; });
    var quoiV = t === "90 secondes OUTSIDE" ? "ton 90s Outside" : t === "KSF" ? "l'épisode de Kamel Sans Filtre"
      : t === "Podcast studio" ? "l'épisode du podcast" : t === "Captation événement" ? "la vidéo de l'événement"
      : t === "Expert insights" ? "la vidéo Expert insights" : t === "Interview corporate" ? "l'interview" : "la vidéo";
    var plur = p && p.livDecoupe && /par/.test(p.livDecoupe);
    if(plur) quoiV = p.livDecoupe === "Une vidéo par intervenant" ? "les vidéos (une par intervenant)" : "les vidéos (une par thème)";
    var L = [];
    L.push("Hello" + (pre ? " " + pre : "") + ",", "", "J'espère que tu vas bien ?", "");
    if(video && !(p && photoSeule(p))){
      var version = aValider ? (avecRetours ? "la nouvelle version de " + quoiV + ", avec tes retours" : "une première version de " + quoiV)
                             : "la version finale de " + quoiV;
      var details = [];
      if(p && p.livDuree && /[a-z]/i.test(p.livDuree)) details.push(p.livDuree);
      if(p && p.format === "Vertical") details.push("au format vertical, prête pour les réseaux");
      else if(p && p.format === "Les deux") details.push("en horizontal et en vertical");
      if(p && p.livSt && p.livSt !== "Aucun") details.push("sous-titrée en " + p.livSt.toLowerCase().replace("autre langue", "langue demandée"));
      L.push("Voici " + version + (nom ? " « " + nom + " »" : "") + (details.length ? " (" + details.join(", ") + ")" : "") + " :");
      L.push(lienV || "[lien Playbook à ajouter]", "");
      L.push(aValider
        ? "Tu peux faire tes retours directement en commentaire sur la vidéo dans Playbook, au bon moment de la timeline : c'est le plus simple pour nous. Qu'en penses-tu ?"
        : "Tu peux la visionner et la télécharger en HD directement depuis le lien. Si tu as encore un petit retour, n'hésite pas à laisser un commentaire sur la vidéo, on s'en occupe rapidement.");
    }
    if(photo){
      if(L.length > 4) L.push("");
      var nb = p && /^\d+$/.test(String(p.photoNb || "").trim()) ? p.photoNb + " photos" : "les photos";
      L.push("Voici " + nb + (nom ? " de « " + nom + " »" : "") + (p && p.photoRetouche && /compl/.test(p.photoRetouche) ? ", retouchées" : "") + " :");
      L.push(lienP || "[lien de la galerie à ajouter]", "");
      L.push("Tu peux les télécharger directement depuis la galerie.");
    }
    L.push("", "Merci à toi pour ta confiance et belle journée 😊", "", (MOI || "L'équipe"), "Studio by The Dots");
    var sujet = (nom || "Votre vidéo") + (aValider ? " – " + (avecRetours ? "nouvelle version" : "première version") + " à valider" : " – version finale") + " 🎬";
    if(p && photoSeule(p)) sujet = (nom || "Vos photos") + " – les photos 📸";
    return outlookCompose(to, sujet, L.join("\n"));
  }
  function mailLivraison(to, p, finale){ return redigerLivraison(to, p, null, finale); }
  function tMailto(t, p, relance){
    var lv = tLiv(t), lien = lv.liens[0] || (p && (p.livLien || p.photoLien)) || "";
    var quoi = nomLivraison(p) || t.projet || t.titre || "votre vidéo";

      + ((t.attente && t.attente.motif) ? "\nIl nous manque encore : " + t.attente.motif + "." : "")

  function lierTaches(){
    function sur(sel, ev, f){ app.querySelectorAll(sel).forEach(function(el){ el.addEventListener(ev, function(e){ f(el, e); }); }); }

      var t = tTrouve(b.dataset.tid); if(!t) return;

      t.termineLe = v === "terminee" ? new Date().toISOString() : "";

  /* L'agenda des deux semaines (refait chaque lundi), devenu un espace de Tâches. */
  function vueAgenda(){
    var D = PL.data;
    if(!D) return '<p class="mp-vide">L’agenda des deux semaines n’est pas encore disponible.</p>';
    var fmtJ = new Intl.DateTimeFormat("fr-FR", { weekday:"short" });
    var fmtM = new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"long" });
    var fmtMaj = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" });
    function jr(x){ return new Date(x + "T12:00:00"); }
    var auj = iso(new Date());
    var h = '<div class="mp"><p class="mp-meta">' + (D.du && D.au ? 'Du ' + esc(fmtM.format(jr(D.du))) + ' au ' + esc(fmtM.format(jr(D.au))) + ' · ' : '')
       + (D.majLe ? 'mis à jour ' + esc(fmtMaj.format(new Date(D.majLe))) : '') + '</p>'
       + '<div class="mp-leg"><span><i class="tournage"></i>Tournage</span><span><i class="montage"></i>Montage</span>'
       + '<span><i class="rdv"></i>Rendez-vous</span><span><i class="ksf"></i>KSF</span><span><i class="alerte"></i>À arbitrer</span></div>'
       + mpJours(D.jours || [], auj, fmtJ);
    function liste2(a, v){ return a && a.length ? '<ul>' + a.map(function(x){ return '<li>' + (typeof x === "string" ? esc(x) : '<b>' + esc(x.titre) + '</b>' + (x.detail ? ' — ' + esc(x.detail) : '')) + '</li>'; }).join("") + '</ul>' : '<p class="mp-vide">' + v + '</p>'; }
    h += '<div class="mp-cols"><div class="mp-box"><h4>Rendu ou validé depuis lundi dernier</h4>'
       + liste2(D.rendu, "Rien encore.") + '</div>'
       + '<div class="mp-box"><h4>À vérifier dans la Régie</h4>' + liste2(D.aVerifier, "Tout est à jour.") + '</div></div>'
       + '<p class="mp-src">Sources : ' + esc(D.sources || "") + '. Agenda refait chaque lundi matin.</p>';

  function mpJours(jours, auj, fmtJ){
    var h = '<div class="mp-days">';
    jours.forEach(function(j){
      var d = new Date(j.date + "T12:00:00"), passe = j.date < auj;
      h += '<div class="mp-day' + (j.date === auj ? ' auj' : '') + (passe ? ' passe' : '') + '"><div class="dt"><b>' + d.getDate() + '</b>'
         + esc(fmtJ.format(d)) + (j.date === auj ? ' · aujourd\'hui' : '') + '</div><div class="evs">';
      (j.evs || []).forEach(function(e){
        h += '<div class="mp-ev ' + esc(e.type || "rdv") + (e.libre ? ' libre' : '') + '"><span class="h">' + esc(e.h || "—") + '</span>'
           + '<span class="w">' + esc(e.titre) + (e.lieu ? '<small>' + esc(e.lieu) + '</small>' : '') + '</span></div>';
      });
      h += '</div></div>';

  /* ---------- planning KSF (rubrique KSF) ----------
     Tournages et montages de l'émission : projets « Kamel Sans Filtre » de la Régie (en direct)
     + rendez-vous KSF repérés dans Outlook (planning « ksf », refait chaque lundi). */
  var PK = { data:null, at:0, enCours:false };
  function pkCharger(force){
    if(!EN_LIGNE || PK.enCours || (!force && Date.now() - PK.at < 5 * 60e3)) return;
    var code = ""; try{ code = sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){}
    PK.enCours = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/planning?pour=ksf", { headers:{ "apikey":CFG.SUPABASE_KEY, "x-regie-code":code } })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){ PK.enCours = false; PK.at = Date.now(); PK.data = x.ok && x.j ? x.j.planning : null; if((VUE === "ksf" && KSF.sous === "production") || (VUE === "reunion" && !tSaisie())) rendre(); },
            function(){ PK.enCours = false; });
  }
  function estKsfProjet(p){ return aType(p, "KSF") || /kamel\s*sans\s*filtre|\bksf\b/i.test((p.client || "") + " " + (p.projet || "")); }
  function kVuePlanning(){
    pkCharger(false);
    var auj = iso(new Date()), fmtJ = new Intl.DateTimeFormat("fr-FR", { weekday:"short" });
    var parJour = {};
    function ajoute(date, ev){ (parJour[date] = parJour[date] || []).push(ev); }
    var projets = P.filter(estKsfProjet);
    projets.forEach(function(p){
      (p.jours || []).forEach(function(j){
        if(j.date && j.date >= auj) ajoute(j.date, { h:[j.heureEquipe, j.heureFin].filter(Boolean).join("–"), titre:"Tournage — " + (p.projet || p.client), lieu:(j.lieu || "") + (equipeDe(j).length ? " · " + equipeDe(j).join(", ") : ""), type:"tournage" });
      });
      if(p.livDate && p.livDate >= auj && p.statut !== "Publié") ajoute(p.livDate, { h:"", titre:"Livraison — " + (p.projet || p.client), type:"montage" });
    });
    ((PK.data && PK.data.evs) || []).forEach(function(e){
      if(e.date >= auj && !(parJour[e.date] || []).some(function(x){ return x.titre.toLowerCase() === String(e.titre).toLowerCase(); })) ajoute(e.date, e);
    });
    var jours = Object.keys(parJour).sort().map(function(d){ return { date:d, evs:parJour[d].sort(function(a, b){ return String(a.h || "99").localeCompare(String(b.h || "99")); }) }; });
    var aLivrer = projets.filter(function(p){ return ["Tourné","Montage","En validation"].indexOf(p.statut) >= 0; })
                         .sort(function(a, b){ return String(a.livDate || "9999").localeCompare(String(b.livDate || "9999")); });
    var taches = TA.filter(function(t){ return /ksf|kamel/i.test((t.projet || "") + " " + (t.titre || "")); });

    var h = '<div class="mp" style="margin-top:18px">';
    h += '<h3 class="mp-h">Tournages et montages à venir</h3>'
       + '<div class="mp-leg"><span><i class="tournage"></i>Tournage</span><span><i class="montage"></i>Montage / livraison</span><span><i class="rdv"></i>Rendez-vous</span></div>'
       + (jours.length ? mpJours(jours, auj, fmtJ) : '<p class="mp-vide">Aucun tournage ni montage KSF prévu.</p>');
    h += '<h3 class="mp-h">En post-production <span>' + aLivrer.length + '</span></h3>';
    if(aLivrer.length){
      h += '<ul class="kp-liv">' + aLivrer.map(function(p){
        var retard = p.livDate && p.livDate < auj;
        return '<li><button type="button" data-id="' + esc(p.id) + '"><b>' + esc(p.projet || p.client) + '</b>'
          + '<span class="pill ' + (CLASSE[p.statut] || "") + '">' + esc(p.statut) + '</span>'
          + (p.livDate ? '<span class="' + (retard ? 'kp-retard' : 'kp-d') + '">' + (retard ? 'Livraison prévue le ' : 'Livraison ') + esc(jourCourt(p.livDate)) + '</span>' : '')
          + '</button></li>';
      }).join("") + '</ul>';
    } else h += '<p class="mp-vide">Rien en post-production.</p>';
    h += '<h3 class="mp-h">Tâches KSF</h3>' + rListe(taches.filter(function(t){ return t.statut !== "terminee"; }).map(function(t){ return rTache(t, esc((t.assigne || "Équipe") + " · " + ((T_STATUTS.filter(function(x){ return x[0] === tEspace(t); })[0] || [0, ""])[1]))); }), "Aucune tâche KSF ouverte.");
    h += '<p class="mp-src">Tournages et livraisons : projets « Kamel Sans Filtre » de la Régie, en direct. Rendez-vous : agendas Outlook, refaits chaque lundi.</p></div>';
    return h;
  }
