      function bip(f, d, deb, type){ var o = ac.createOscillator(), e = ac.createGain(); o.type = type || "sine"; o.frequency.value = f;
        e.gain.setValueAtTime(0, t + deb); e.gain.linearRampToValueAtTime(1, t + deb + .02); e.gain.exponentialRampToValueAtTime(.001, t + deb + d);

      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(.35, t + .4); e.gain.linearRampToValueAtTime(0, t + 2.6);
      var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900; o.connect(f); f.connect(e); e.connect(g); o.start(t); o.stop(t + 2.7);
      [.5, .9, 1.3, 1.7, 2.1].forEach(function(d, i){ bip(880 + i * 110, .08, d, "square"); });
      bip(1320, .5, 3.0); bip(1760, .7, 3.1);
      setTimeout(function(){ try{ ac.close(); }catch(x){} }, 4500);
    }catch(e){}
  }
  function jvBoot(apres){
    if(document.getElementById("jvBoot")) return;
    var reduit = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduit){ if(apres) apres(); return; }
    var auj = iso(new Date());
    var nTg = 0; P.forEach(function(p){ (p.jours || []).forEach(function(j){ if(j.date && j.date >= auj && j.date <= kAdd(auj, 7)) nTg++; }); });
    var nTa = TA.filter(function(t){ return t.statut !== "terminee"; }).length, nAt = TA.filter(function(t){ return t.statut === "attente"; }).length;
    var nK = KS.filter(function(p){ return p.date >= auj && p.date <= kAdd(auj, 7) && p.type !== "story"; }).length;
    var lignes = ["Initialisation du noyau", "Connexion à la Régie · " + P.length + " projets", nTg + " journée" + (nTg > 1 ? "s" : "") + " de tournage dans les 7 jours",
      nTa + " tâches ouvertes · " + nAt + " en attente", "Kamel Sans Filtre · " + nK + " publication" + (nK > 1 ? "s" : "") + " cette semaine", "Calibrage de la voix · fr-FR", "Tous les systèmes sont en ligne"];
    var anneaux = "";
    [[46, 7, "12 8", 9, 1], [40, 2, "2 4", 14, -1], [34, 5, "40 14 6 14", 7, 1], [27, 1.5, "1 3", 20, -1], [21, 3, "60 30", 5, 1]].forEach(function(a, i){
      anneaux += '<circle class="r r' + i + '" cx="50" cy="50" r="' + a[0] + '" stroke-width="' + a[1] / 4 + '" stroke-dasharray="' + a[2] + '" style="--d:' + a[3] + 's;--s:' + a[4] + '"/>'; });
    var graduations = ""; for(var i = 0; i < 72; i++){ var an = i * 5 * Math.PI / 180, r1 = 48.5, r2 = i % 6 ? 47.6 : 46.6;
      graduations += '<line x1="' + (50 + r1 * Math.cos(an)).toFixed(2) + '" y1="' + (50 + r1 * Math.sin(an)).toFixed(2) + '" x2="' + (50 + r2 * Math.cos(an)).toFixed(2) + '" y2="' + (50 + r2 * Math.sin(an)).toFixed(2) + '"/>'; }
    var o = document.createElement("div");
    o.id = "jvBoot"; o.className = "jvb"; o.setAttribute("role", "status"); o.setAttribute("aria-label", "Démarrage de Jarvis");
    o.innerHTML = '<div class="jvb-grille"></div><div class="jvb-scan"></div>'
      + '<div class="jvb-coin a"></div><div class="jvb-coin b"></div><div class="jvb-coin c"></div><div class="jvb-coin d"></div>'
      + '<div class="jvb-centre"><svg viewBox="0 0 100 100" aria-hidden="true"><g class="grad">' + graduations + '</g>' + anneaux
      + '<circle class="coeur" cx="50" cy="50" r="12"/><circle class="coeur2" cx="50" cy="50" r="6"/></svg>'
      + '<div class="jvb-nom"><b>JARVIS</b><span>Assistant de la Régie</span></div></div>'
      + '<ol class="jvb-log">' + lignes.map(function(l, i){ return '<li style="--i:' + i + '"><span class="ok">' + (i === lignes.length - 1 ? '●' : '✓') + '</span>' + esc(l) + '</li>'; }).join("") + '</ol>'
      + '<div class="jvb-data"><span>SYS ' + Math.floor(Math.random() * 900 + 100) + '.' + Math.floor(Math.random() * 90 + 10) + '</span><span>LAT 49.62 N · LON 6.07 E</span><span>' + esc(new Date().toLocaleTimeString("fr-FR")) + '</span></div>'
      + '<div class="jvb-pret">En ligne' + (MOI ? ' · bonjour ' + esc(MOI) : '') + '</div><button type="button" class="jvb-passer">Passer ›</button>';
    document.body.appendChild(o);
    jvSon();
    var fini = false;
    function fin(){ if(fini) return; fini = true; o.classList.add("sort"); setTimeout(function(){ o.remove(); }, 600); if(apres) apres();
      if(JV.voix) jvParler("Bonjour" + (MOI ? " " + MOI : "") + ". Tous les systèmes sont en ligne. Que puis-je faire pour toi ?"); }
    var minuteur = setTimeout(fin, 4600);
    o.addEventListener("click", function(){ clearTimeout(minuteur); fin(); });
    document.addEventListener("keydown", function k(e){ if(e.key === "Escape"){ document.removeEventListener("keydown", k); clearTimeout(minuteur); fin(); } });
  }


  /* ---------- Visualiseur « Jarvis parle » (onglet Réunion) ----------
     Bandeau holographique en bas de l'écran pendant que Jarvis parle : noyau et anneaux qui pulsent,
     spectre de barres, sous-titres mot à mot. Avec la voix VoiceStudio, le spectre suit le vrai son
     (Web Audio) ; avec la voix du navigateur, il suit les mots prononcés. Activable dans Réunion. */
  var HUD = { on:true, el:null, mots:[], idx:-1, niveau:0, cible:0, raf:0, analyse:null, ac:null, actif:false, t0:0, dureeEst:0 };
  try{ HUD.on = localStorage.getItem("sbtd-jarvis-hud") !== "0"; }catch(e){}
  function hudVisible(){ return HUD.on && VUE === "reunion"; }
  function hudCreer(){
    if(HUD.el) return HUD.el;
    var e = document.createElement("div"); e.id = "jvHud"; e.className = "jvh"; e.setAttribute("aria-live", "polite"); e.hidden = true;
    var anneaux = ""; [[44, "14 6"], [36, "3 5"], [28, "40 10 4 10"]].forEach(function(a, i){ anneaux += '<circle class="a a' + i + '" cx="50" cy="50" r="' + a[0] + '" stroke-dasharray="' + a[1] + '"/>'; });
    e.innerHTML = '<div class="jvh-noyau"><svg viewBox="0 0 100 100" aria-hidden="true">' + anneaux + '<circle class="c" cx="50" cy="50" r="16"/><circle class="c2" cx="50" cy="50" r="8"/></svg></div>'
      + '<div class="jvh-corps"><div class="jvh-tete"><b>JARVIS</b><span class="jvh-etat">parle</span><button type="button" class="jvh-stop" aria-label="Arrêter Jarvis">■ Stop</button></div>'
      + '<canvas class="jvh-spectre" width="900" height="70" aria-hidden="true"></canvas><p class="jvh-texte"></p></div>';
    document.body.appendChild(e);
    e.querySelector(".jvh-stop").addEventListener("click", function(){ jvTaire(); hudFin(); jvEtat(); });
    HUD.el = e; return e;
  }
  function hudTexte(){
    var p = HUD.el && HUD.el.querySelector(".jvh-texte"); if(!p) return;
    var deb = Math.max(0, HUD.idx - 14), fin = Math.min(HUD.mots.length, deb + 30);
    p.innerHTML = (deb > 0 ? '<span class="pass">… </span>' : '') + HUD.mots.slice(deb, fin).map(function(m, i){
      var k = deb + i; return '<span class="' + (k < HUD.idx ? 'pass' : k === HUD.idx ? 'cour' : 'vient') + '">' + esc(m.w) + '</span>'; }).join(" ") + (fin < HUD.mots.length ? ' …' : '');
  }
  function hudDebut(texte){
    if(!hudVisible()) return;
    var e = hudCreer(), txt = String(texte).replace(/\*\*/g, "").replace(/^\s*-\s+/gm, "").replace(/\s+/g, " ").trim(), pos = 0;
    HUD.mots = txt.split(" ").map(function(w){ var m = { w:w, c:txt.indexOf(w, pos) }; pos = m.c + w.length; return m; });
    HUD.idx = 0; HUD.actif = true; HUD.t0 = performance.now(); HUD.dureeEst = Math.max(1500, HUD.mots.length * 360);
    e.hidden = false; e.classList.remove("sort"); document.body.classList.add("jvh-on"); hudTexte();
    if(!HUD.raf) HUD.raf = requestAnimationFrame(hudBoucle);
  }
  function hudMot(charIndex){ if(!HUD.actif) return; var k = 0; for(var i = 0; i < HUD.mots.length; i++){ if(HUD.mots[i].c <= charIndex) k = i; else break; } HUD.idx = k; HUD.cible = 1; hudTexte(); }
  function hudFin(){
    HUD.actif = false; HUD.analyse = null;
    if(HUD.el){ HUD.idx = HUD.mots.length; hudTexte(); HUD.el.classList.add("sort"); setTimeout(function(){ if(!HUD.actif && HUD.el){ HUD.el.hidden = true; document.body.classList.remove("jvh-on"); } }, 700); }
  }
  /* Branche un élément <audio> (voix VoiceStudio) sur un analyseur pour le spectre réel. */
  function hudAudio(a){
    if(!HUD.actif) return;
    try{
      var C = window.AudioContext || window.webkitAudioContext; if(!C) return;
      HUD.ac = HUD.ac || new C(); if(HUD.ac.state === "suspended") HUD.ac.resume();
      var src = HUD.ac.createMediaElementSource(a), an = HUD.ac.createAnalyser(); an.fftSize = 128;
      src.connect(an); an.connect(HUD.ac.destination); HUD.analyse = an;
      a.addEventListener("timeupdate", function(){ if(a.duration) { var k = Math.floor(a.currentTime / a.duration * HUD.phraseMots) + HUD.phraseDeb; if(k !== HUD.idx){ HUD.idx = Math.min(k, HUD.mots.length - 1); hudTexte(); } } });
    }catch(e){ HUD.analyse = null; }
  }
  function hudBoucle(t){
    HUD.raf = 0; if(!HUD.el || HUD.el.hidden) return;
    var cv = HUD.el.querySelector(".jvh-spectre"), g = cv.getContext("2d"), W = cv.width, H = cv.height, n = 48, v = [];
    if(HUD.analyse){ var d = new Uint8Array(HUD.analyse.frequencyBinCount); HUD.analyse.getByteFrequencyData(d); for(var i = 0; i < n; i++) v.push(d[Math.floor(i * d.length / n * .8)] / 255); HUD.niveau = v.reduce(function(a, b){ return a + b; }, 0) / n * 1.6; }
    else {
      HUD.cible *= .9; if(HUD.actif && !window.speechSynthesis) HUD.cible = .5;
      if(HUD.actif && performance.now() - HUD.t0 > 0) HUD.cible = Math.max(HUD.cible, .35 + .25 * Math.sin(t / 90));
      HUD.niveau += ((HUD.actif ? HUD.cible : 0) - HUD.niveau) * .25;
      for(var j = 0; j < n; j++){ var x = j / n; v.push(Math.max(0, HUD.niveau * (.35 + .65 * Math.abs(Math.sin(t / 140 + x * 9) * Math.cos(t / 230 + x * 5))))); }
    }
    g.clearRect(0, 0, W, H);
    var cols = ["#F4C21B","#F06A1F","#D9284F","#B0308F","#6B3BD8","#2F6BE0","#1FB5C9"], bw = W / n;
    for(var k = 0; k < n; k++){
      var m = Math.min(n - 1, Math.abs(k - n / 2) * 2), h = Math.max(2, v[Math.floor(m)] * H * .95);
      g.fillStyle = cols[Math.floor(k / n * cols.length)]; g.globalAlpha = .85;
      g.fillRect(k * bw + 2, (H - h) / 2, bw - 4, h);
    }
    g.globalAlpha = 1;
    HUD.el.style.setProperty("--niv", Math.min(1, HUD.niveau).toFixed(3));
    if(HUD.actif || HUD.niveau > .02) HUD.raf = requestAnimationFrame(hudBoucle);
  }
  window.jarvisHud = { debut:hudDebut, mot:hudMot, fin:hudFin };   // pour les tests et la console
  /* Jarvis présente un point de la réunion, à voix haute. */
  function hudPresenter(k){
    var s = document.getElementById("ru-" + k); if(!s) return;
    var titre = (s.querySelector("h2") || {}).textContent || "", contenu = s.innerText.replace(/\s+\n/g, "\n").slice(0, 3500);
    JV.voix = true; try{ localStorage.setItem("sbtd-jarvis-voix", "1"); }catch(e){}
    if(!HUD.on){ toast("L’animation Jarvis est désactivée : Jarvis parle sans le visualiseur."); }
    jvDemander("Présente à voix haute, en 3 à 5 phrases simples, le point « " + titre + " » de notre réunion du lundi. Va à l’essentiel, cite les noms des projets, termine par ce qu’il faut décider. Voici ce qu’affiche la Régie :\n" + contenu, "🎙 Présente le point « " + titre + " »");
    toast("Jarvis prépare la présentation de ce point…");
  }

  function jvInit(){
    if(document.getElementById("jvBtn")) return;
    var b = document.createElement("button");
    b.id = "jvBtn"; b.type = "button"; b.className = "jv-btn"; b.setAttribute("aria-label", "Ouvrir Jarvis, l’assistant de la Régie"); b.setAttribute("aria-expanded", "false");
    b.innerHTML = '<span class="jv-orbe" aria-hidden="true"><i></i></span><span class="jv-nom">Jarvis</span>';
    var p = document.createElement("section");
    p.id = "jarvis"; p.className = "jv"; p.hidden = true; p.setAttribute("aria-label", "Jarvis");
    p.innerHTML = '<header class="jv-h"><span class="jv-orbe" aria-hidden="true"><i></i></span><div><b>Jarvis</b><small>Assistant de la Régie</small></div>'
      + '<button type="button" class="jv-ic jv-conv" data-jvconv aria-pressed="false" title="Mode conversation : parle-lui, il répond à voix haute">🗣</button>'
      + '<button type="button" class="jv-ic" data-jvboot title="Lancer la séquence de démarrage">✦</button>'
      + '<button type="button" class="jv-ic" data-jvvoix aria-pressed="false" title="Lire les réponses à voix haute">🔊</button>'
      + '<button type="button" class="jv-ic" data-jvnet title="Nouvelle conversation">↺</button>'
      + '<button type="button" class="jv-ic" data-jvferme aria-label="Fermer">✕</button></header>'
      + '<div class="jv-etat" hidden></div><div class="jv-fil" aria-live="polite"></div>'
      + '<form class="jv-f"><button type="button" class="jv-ic" data-jvmic title="Poser la question à voix haute">🎙</button>'

    document.body.appendChild(b); document.body.appendChild(p);

      var vu = false; try{ vu = sessionStorage.getItem("sbtd-jarvis-boot") === "1"; sessionStorage.setItem("sbtd-jarvis-boot", "1"); }catch(e){ vu = true; }

    p.querySelector("[data-jvboot]").addEventListener("click", function(){ jvOuvrir(false); jvBoot(function(){ jvOuvrir(true); }); });
    p.querySelector("[data-jvferme]").addEventListener("click", function(){ jvOuvrir(false); });
    p.querySelector("[data-jvnet]").addEventListener("click", function(){ if(JV.enCours) return; JV.msgs = []; jvSauver(); jvRendre(); });
    p.querySelector("[data-jvvoix]").addEventListener("click", function(){ JV.voix = !JV.voix; try{ localStorage.setItem("sbtd-jarvis-voix", JV.voix ? "1" : "0"); }catch(e){} if(!JV.voix) jvTaire(); jvRendre(); });
    p.querySelector("[data-jvmic]").addEventListener("click", jvMicro);
    p.querySelector("[data-jvconv]").addEventListener("click", jvConversation);
    p.querySelector(".jv-f").addEventListener("submit", function(e){ e.preventDefault(); var c = document.getElementById("jvIn"); var q = c.value; c.value = ""; jvDemander(q); });
    document.addEventListener("keydown", function(e){
      if((e.metaKey || e.ctrlKey) && (e.key === "j" || e.key === "J")){ e.preventDefault(); jvOuvrir(); }
      else if(e.key === "Escape" && JV.ouvert && !(VUE === "reunion" && RV.pres)){ jvOuvrir(false); }
    });
  }
})();
