  /* Le kit affiché au dernier rendu du formulaire : sert à distinguer
     les ajouts manuels quand on change de type de prestation. */
  var KIT_AFFICHE = [];

  /* Le formulaire montre-t-il la checklist matériel ? Choix de la
     personne qui saisit, jamais enregistré dans le projet. */
  var MAT_FORM = false;

  /* Les lignes « matériel en plus » en cours de saisie. null = à
     reconstruire depuis le projet au prochain affichage ; une ligne
     vide doit pouvoir exister le temps qu'on la remplisse. */
  var SUP = null;

  function blocMateriel(b){
    var kit = kitDe(b).items;
    var retenu = materielDe(b);
    var carte = {};
    retenu.forEach(function(q){ carte[q.lib] = q.qte; });
    KIT_AFFICHE = kit.map(function(q){ return q.lib; });
    var sup = retenu.filter(function(q){ return KIT_AFFICHE.indexOf(q.lib) < 0; });
    var n = retenu.length;
    var h = '<div class="blk"><h3>Matériel du projet</h3>'
      + '<p class="kitmeta">Décochez ce que vous n\'emportez pas, ajustez les quantités. '
      + 'Cette liste devient la checklist de chaque journée de tournage.</p>'
      + '<div class="pickbar"><span class="n" id="nmat">' + n + ' poste' + (n > 1 ? 's' : '') + ' retenu' + (n > 1 ? 's' : '') + '</span>'
      + '<button type="button" data-pickall="1">Tout cocher</button>'
      + '<button type="button" data-picknone="1">Tout décocher</button>'
      + (kitDe(b).connu ? '<button type="button" data-reset="1">Repartir du kit</button>' : '')
      + '</div>'
      + '<div class="checks">';
    kit.forEach(function(q, i){
      var on = carte.hasOwnProperty(q.lib);
      h += '<div class="matline">'
         + '<label class="chk sel' + (on ? " on" : "") + '">'
         + '<input type="checkbox" data-pick="' + i + '" data-lib="' + esc(q.lib) + '"' + (on ? " checked" : "") + '>'
         + '<span class="box"></span><span class="t">' + esc(q.lib) + '</span></label>'
         + '<input type="number" class="qte" min="1" max="99" step="1" data-qte="' + i + '"'
         + ' aria-label="Quantité — ' + esc(q.lib) + '" value="' + (on ? carte[q.lib] : q.qte) + '"'
         + (on ? "" : " disabled") + '>'
         + '</div>';
    });
    h += '</div>';

    if(SUP === null) SUP = sup.map(function(q){ return { lib:q.lib, qte:q.qte || 1 }; });
    h += '<div class="sup"><h4>Matériel en plus</h4>'
      + '<p class="kitmeta">Ce qui n\'est pas dans le kit : un projecteur loué, une perche, '
      + 'un objectif particulier.</p>';
    SUP.forEach(function(q, i){
      h += '<div class="supline">'
         + '<input type="text" name="s' + i + '_lib" value="' + esc(q.lib || "") + '"'
         + ' aria-label="Matériel en plus ' + (i+1) + '" placeholder="Mandarine 800 W, perche, 70-200 mm…">'
         + '<input type="number" class="qte" min="1" max="99" step="1" name="s' + i + '_qte"'
         + ' aria-label="Quantité — matériel en plus ' + (i+1) + '" value="' + (q.qte || 1) + '">'
         + '<button type="button" data-dels="' + i + '" aria-label="Retirer">Retirer</button>'
         + '</div>';
    });
    h += '<div class="actions"><button type="button" class="btn" data-adds="1">'
      + '+ Ajouter du matériel</button></div></div>'
      + '</div>';
    return h;
  }

      var m = c.media || mediaDe(b);

      h += '<div class="f capline' + (mixte ? " mixte" : "") + '">'
         + '<input type="text" name="c' + i + '_quoi" value="' + esc(c.quoi || "") + '"'

             ? '<span class="dest">'

  /* Choix en pastilles : le <select> reste la source (lu par lireForm), les pastilles le pilotent. */
  function puces(l, n, opts, v, hint){
    return '<div class="f puces"><label for="i_' + n + '">' + esc(l) + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>'
      + '<select id="i_' + n + '" name="' + n + '" tabindex="-1" aria-hidden="true">'
      + (opts.indexOf(v) < 0 ? '<option value="" selected>— à préciser —</option>' : '')   // valeur absente : on ne l'invente pas
      + opts.map(function(o){
          return '<option value="' + esc(o) + '"' + (o === v ? " selected" : "") + '>' + esc(o) + '</option>'; }).join("") + '</select>'
      + '<div class="pc" role="radiogroup" aria-label="' + esc(l) + '">' + opts.map(function(o){
          return '<button type="button" role="radio" aria-checked="' + (o === v) + '" data-puce="' + n + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join("")
      + '</div></div>';

  /* Bloc repliable, qui se souvient d'être ouvert d'un redessin à l'autre. */

    /* 03 — le reste, replié */
    var mat = '<p class="kitmeta">Le kit « ' + esc(b.type || "") + ' » s’applique par défaut ; il reste modifiable depuis la fiche.</p>'

      + plie("proj", mtg ? "Brief de montage" : "Intervenants et notes", "", proj)
      + plie("liv", "Montage et livraison", "", blocLivraisonForm(b))
      + plie("suivi", "Suivi", libStatut(b, b.statut), suivi)

    h += '<div class="envoi"><button type="submit" class="btn lime">' + (neuf ? "Créer le projet →" : "Enregistrer") + '</button>'

  function vueMat(){

      + (b.dispositif && b.dispositif !== "Sans objet" ? ' · ' + esc(b.dispositif) : '') + '</p></div>'

  /* Relit les champs saisis avant de redessiner le formulaire. */
  function lireForm(){
    var f = app.querySelector("#form");
    if(!f || !BROUILLON) return;
    var b = BROUILLON;
    ["client","projet","type","media","format","dispositif","intervenants","questions","notes","statut","ssd","validant",
     "livDuree","livDecoupe","livSt","livMusique","livLogo","livDate","livLien","livNotes",
     "photoNb","photoRetouche","photoForme","photoDate","photoLien","photoNotes"]
      .forEach(function(k){ var el = f.elements[k]; if(el) b[k] = el.value; });
    b.jours.forEach(function(j, i){
      ["date","heureEquipe","heurePat","heureFin","duree","lieu","adresse","acces","contactNom","contactTel","note"]
        .forEach(function(k){ var el = f.elements["j" + i + "_" + k]; if(el) j[k] = el.value; });
      var eq = [], boites = f.querySelectorAll('[data-eq="' + i + '"]');
      if(boites.length || f.elements["j" + i + "_equipeAutre"]){
        boites.forEach(function(c){ if(c.checked) eq.push(c.value); });
        var autre = f.elements["j" + i + "_equipeAutre"];
        if(autre) autre.value.split(/[,;]/).forEach(function(n){
          n = n.trim();
          if(n && eq.indexOf(n) < 0) eq.push(n);
        });
        j.equipe = eq;
      }
    });
    var caps = [], i = 0;
    while(f.elements["c" + i + "_quoi"]){
      var q = f.elements["c" + i + "_quoi"].value.trim();
      var m = "";
      var bv = f.querySelector('[data-dest="v' + i + '"]');
      var bp = f.querySelector('[data-dest="p' + i + '"]');
      if(bv || bp){                       // projet photo + vidéo : deux cases
        m = bv && bv.checked
              ? (bp && bp.checked ? "Photo et vidéo" : "Vidéo")
              : (bp && bp.checked ? "Photo" : "");
      } else if(f.elements["c" + i + "_media"]){
        m = f.elements["c" + i + "_media"].value;
      }
      caps.push({ quoi:q, media:m });
      i++;
    }
    if(i) b.captations = caps;

    var picks = f.querySelectorAll("[data-pick]");
    if(picks.length){
      var m = [];
      picks.forEach(function(inp, i){
        if(!inp.checked) return;
        var q = f.querySelector('[data-qte="' + inp.dataset.pick + '"]');
        m.push({ lib: inp.dataset.lib, qte: Math.max(1, parseInt(q && q.value, 10) || 1) });
      });
      var sup = [], k = 0;
      while(f.elements["s" + k + "_lib"]){
        var el = f.elements["s" + k + "_qte"];
        sup.push({ lib: f.elements["s" + k + "_lib"].value.trim(),
                   qte: Math.max(1, parseInt(el && el.value, 10) || 1) });
        k++;
      }
      SUP = sup;
      sup.forEach(function(z){
        if(!z.lib) return;                       // ligne encore vide : on l'ignore
        if(!m.some(function(x){ return x.lib === z.lib; })) m.push({ lib:z.lib, qte:z.qte });
      });
      b.materiel = m;
    }
  }

  /* Intro de rubrique : grand titre en deux tons ; sur « À venir », le visuel Studio et les chiffres clés. */

  /* Animations d'entrée, jouées seulement à l'ouverture d'une rubrique (pas aux rafraîchissements). */
  var CHIFFRES = ".intro.anim .cnt, .tile .n, .ks-pf .n, .ks-top .n, .ks-mini b, .ks-rank .v";
  var REVELES = ".tile, .ks-pf, .ks-top, .ks-m, .ks-rank li, .ks-tile, .kstat h2.sec, .shero.grand";
  function compter(el){
    var txt = el.firstChild && el.firstChild.nodeType === 3 ? el.firstChild.nodeValue : null;
    var m = txt && txt.match(/^([\d\s  ]+(?:,\d+)?)(.*)$/); if(!m) return;
    var dec = m[1].indexOf(",") >= 0, cible = parseFloat(m[1].replace(/[\s  ]/g, "").replace(",", "."));
    if(!isFinite(cible) || cible === 0) return;
    var noeud = el.firstChild, fin = m[2], t0 = null, duree = cible > 999 ? 1600 : 1100;
    function f(v){ return dec ? v.toFixed(1).replace(".", ",") : Math.round(v).toLocaleString("fr-FR"); }
    noeud.nodeValue = f(0) + fin;
    function pas(t){
      if(t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / duree), e = 1 - Math.pow(2, -10 * k);   // départ rapide, arrivée douce
      noeud.nodeValue = (k < 1 ? f(cible * e) : m[1]) + fin;
      if(k < 1) requestAnimationFrame(pas);
    }
    requestAnimationFrame(pas);
  }
  function animer(){
    if(!app.querySelector(".intro.anim")) return;
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var vus = app.querySelectorAll(REVELES), nums = app.querySelectorAll(CHIFFRES);
    if(!("IntersectionObserver" in window)){ nums.forEach(compter); return; }
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        io.unobserve(e.target);
        if(e.target.classList.contains("rv")) e.target.classList.add("vu");
        else compter(e.target);
      });
    }, { rootMargin:"0px 0px -8% 0px" });
    vus.forEach(function(el, i){
      el.classList.add("rv");
      el.style.transitionDelay = Math.min(i % 4, 3) * 70 + "ms";
      io.observe(el);
    });
    nums.forEach(function(el){ io.observe(el); });
    app.querySelectorAll(".kstat.anim .kbars .st").forEach(function(el, i){ el.style.animationDelay = i * 60 + "ms"; });
  }

    else if(VUE === "contact"){ h = vueContact(); }

    else if(VUE === "cal"){ h = vueCalendrier(); }

    else if(VUE === "suivi"){ h = vueSuivi(); }

         + 'en haut du fichier index.html — la marche à suivre est dans le LISEZ-MOI.</div>';
    } else if(PRET && ERREUR){
      h += '<div class="bandeau"><b>Connexion aux données impossible.</b> Le planning affiché peut '
         + 'être incomplet. Vérifiez la connexion internet, puis rechargez la page.</div>';
    }
    app.innerHTML = h;

      b.addEventListener("click", function(){ VUE = b.dataset.tile; rendre(); window.scrollTo(0,0); });
    });

  /* =====================================================================
     KSF — planning des publications « Kamel sans Filtre »
     Les publications et les épisodes vivent dans la même table que les
     tournages, marqués kind:"ksf-post" et kind:"ksf-episode".
     Rythme : le podcast le jeudi, puis un short tous les deux jours
     (sam, lun, mer, ven, dim, mar) jusqu'au podcast suivant.
     ===================================================================== */
  var K_TYPES = { podcast:"Podcast", short:"Short", story:"Story" };
  var K_ST = [
    { k:"todo",    l:"À préparer", c:"" },
    { k:"montage", l:"En montage", c:"montage" },
    { k:"valid",   l:"À valider",  c:"valid" },
    { k:"sched",   l:"Programmé",  c:"confirme" },
    { k:"done",    l:"Publié",     c:"publie" }
  ];
  function kSt(k){ return K_ST.filter(function(s){ return s.k === k; })[0] || K_ST[0]; }
  var K_PLATS = [{k:"li",l:"LinkedIn"},{k:"igfb",l:"Instagram / Facebook"},{k:"tt",l:"TikTok"},{k:"yt",l:"YouTube"}];
  var K_PCOURT = { li:"LI", igfb:"IG/FB", tt:"TT", yt:"YT" };
  var K_ALL = ["li","igfb","tt","yt"], K_SOCIAL = ["igfb","yt","tt"];

    for(var j in o) p[j] = o[j];
    return p;
  }
  function kCopie(o){ return JSON.parse(JSON.stringify(o)); }
  function kPareil(a, b){ return JSON.stringify(a == null ? "" : a) === JSON.stringify(b == null ? "" : b); }
  function kSaisie(){
    if(VUE === "ksf-fiche" || VUE === "ksf-gen" || VUE === "ksf-import") return true;
    var a = document.activeElement;

  /* ---------- écriture ----------
     Une modification n'envoie que les champs changés : la ligne est relue
     juste avant, pour ne pas écraser ce qu'un collègue vient d'écrire. */
  function kMarque(patch){
    var champs = Object.keys(patch);
    patch.updatedAt = new Date().toISOString();
    patch.editedBy = MOI || "";
    patch.editedFields = champs;
    return patch;
  }
  function kRid(){ return "loc-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function kFin(muet){ return muet ? Promise.resolve() : charger(true); }
  function kCreer(docs, muet){
    docs = docs.map(function(d){ var c = sansId(d); c.createdAt = c.createdAt || new Date().toISOString(); return c; });
    if(!EN_LIGNE){
      var a = local(), ids = [];
      docs.forEach(function(d){ d.id = kRid(); ids.push(d.id); a.push(d); });
      localSet(a); repartir(local()); if(!muet) rendre();
      return Promise.resolve(ids);
    }
    etat("envoi…");
    return net("tournages", { method:"POST", body:docs.map(function(d){ return { data:d }; }), retour:true })
      .then(function(rows){ var ids = (rows || []).map(function(r){ return r.id; }); return kFin(muet).then(function(){ return ids; }); });
  }
  function kMaj(id, patch, muet){
    kMarque(patch);
    if(!EN_LIGNE){
      localSet(local().map(function(x){ return x.id === id ? Object.assign({}, x, patch) : x; }));
      repartir(local()); if(!muet) rendre();
      return Promise.resolve();
    }
    etat("envoi…");
    var ch = "tournages?id=eq." + encodeURIComponent(id);
    return net(ch + "&select=data").then(function(rows){
      if(!rows || !rows.length) throw new Error("Cette fiche a été supprimée.");
      return net(ch, { method:"PATCH", body:{ data:Object.assign({}, rows[0].data || {}, patch) } });
    }).then(function(){ return kFin(muet); });
  }
  function kSuppr(ids, muet){
    if(!EN_LIGNE){
      localSet(local().filter(function(x){ return ids.indexOf(x.id) < 0; }));
      repartir(local()); if(!muet) rendre();
      return Promise.resolve();
    }
    return net("tournages?id=in.(" + ids.map(encodeURIComponent).join(",") + ")", { method:"DELETE" })
      .then(function(){ return kFin(muet); });
  }
  function kEchec(e){
    KSF.occupe = false;
    etat("échec");
    toast(e && e.message && e.message.length < 80 && !/^[{\[]/.test(e.message) ? e.message : "Enregistrement impossible. Vérifiez la connexion.");
    return charger(true);
  }
  /* Exécute des écritures l'une après l'autre, puis recharge une fois. */
  function kSuite(taches){
    return taches.reduce(function(pr, t){ return pr.then(t); }, Promise.resolve()).then(function(){ return charger(true); });
  }

  /* ---------- statistiques Buffer ----------
     Une fonction Supabase (ksf-buffer) garde le jeton Buffer et renvoie
     les publications envoyées avec leurs métriques. La page garde la
     dernière réponse une heure. */
  var KB = { posts:null, at:0, err:"", errAt:0, charge:false, parJour:{} };
  var KB_CLE = "sbtd-ksf-buffer";
  var KB_SVC = ["instagram","youtube","facebook"];
  var KB_NOM = { instagram:"Instagram", youtube:"YouTube", facebook:"Facebook" };
  function kbParse(nodes){
    return (nodes || []).map(function(n){
      var m = {}; (n.metrics || []).forEach(function(x){ m[x.type] = x.value; });
      var d = K_LUX.format(new Date(n.sentAt || n.dueAt)).replace(",", "");
      function v(k){ return m[k] == null ? null : Number(m[k]); }
      return { id:n.id, date:d.slice(0, 10), time:d.slice(11, 16), len:(n.text || "").length, text:n.text || "",
               views:v("views"), impressions:v("impressions"), reach:v("reach"), reactions:v("reactions"),
               comments:v("comments"), shares:v("shares"), saves:v("saves"), er:v("engagementRate"),
               metric:Number(m.views != null ? m.views : (m.impressions || 0)) || 0 };
    });
  }
  function kbPoser(raw){
    KB.posts = {}; KB.parJour = {};
    KB_SVC.forEach(function(s){
      KB.posts[s] = kbParse(raw && raw[s]);
      KB.posts[s].forEach(function(b){ var j = KB.parJour[b.date] = KB.parJour[b.date] || {}; (j[s] = j[s] || []).push(b); });
    });
  }
  (function(){ try{ var v = JSON.parse(localStorage.getItem(KB_CLE) || "null"); if(v && v.posts){ kbPoser(v.posts); KB.at = v.at || 0; } }catch(e){} })();
  function kbCharger(force){
    if(!EN_LIGNE || KB.charge) return;
    if(!force && KB.posts && Date.now() - KB.at < 3600e3) return;
    if(!force && KB.errAt && Date.now() - KB.errAt < 10 * 60e3) return;   // pas de nouvel essai avant 10 min
    KB.charge = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/ksf-buffer" + (force ? "?force=1" : ""),
          { headers:{ "apikey":CFG.SUPABASE_KEY } })
      .then(function(r){ return r.json().catch(function(){ return { error:"http" }; }); })
      .then(function(j){
        if(!j || j.error) throw (j && j.error) || "http";
        KB.at = Date.parse(j.fetchedAt) || Date.now(); kbPoser(j.posts); KB.err = ""; KB.errAt = 0;
        try{ localStorage.setItem(KB_CLE, JSON.stringify({ at:KB.at, posts:j.posts })); }catch(e){}
      })
      .catch(function(e){ KB.err = typeof e === "string" ? e : "reseau"; KB.errAt = Date.now(); })
      .then(function(){ KB.charge = false; if(/^ksf/.test(VUE) && !kSaisie()) rendre(); });
  }
  function kbEtat(){
    if(!EN_LIGNE) return "Statistiques Buffer indisponibles en mode démonstration.";
    if(KB.err === "no_token") return "Statistiques : ajoutez le jeton API Buffer dans Supabase (Edge Functions › Secrets, nom BUFFER_TOKEN).";
    if(KB.err === "buffer_auth") return "Statistiques : Buffer refuse le jeton enregistré dans Supabase. Créez-en un nouveau.";
    if(KB.err && !KB.posts) return "Statistiques Buffer injoignables pour l’instant.";
    if(KB.posts) return "Statistiques Buffer à jour (" + kIlya(new Date(KB.at).toISOString()) + ")"
                      + (KB.err ? ", dernière actualisation en échec" : "") + ". TikTok et LinkedIn ne sont pas suivis.";
    return "Statistiques Buffer : chargement…";
  }
  /* Les publications Buffer d'une ligne du planning : même jour, plateformes cochées. */
  function kStats(p){
    var jour = KB.parJour[p.date]; if(!jour) return [];
    var pl = p.platforms || [], voulu = [], out = [];
    if(pl.indexOf("igfb") >= 0) voulu.push("instagram", "facebook");
    if(pl.indexOf("yt") >= 0) voulu.push("youtube");
    voulu.forEach(function(s){
      var l = jour[s]; if(!l || !l.length) return;
      var pick = l.reduce(function(a, b){
        if(s === "youtube") return p.type === "podcast" ? (b.len > a.len ? b : a) : (b.len < a.len ? b : a);
        return b.metric > a.metric ? b : a;
      });
      out.push(Object.assign({ svc:s }, pick));
    });
    return out;
  }
  function kVues(p){ return kStats(p).filter(function(x){ return x.svc !== "facebook"; })
                       .reduce(function(a, x){ return a + (x.views || 0); }, 0); }
  function kK(n){ n = Math.round(n || 0); return n >= 10000 ? Math.round(n / 1000) + " k" : n >= 1000 ? String(Math.round(n / 100) / 10).replace(".", ",") + " k" : String(n); }
  function kNf(v){ return v == null ? "—" : Math.round(v).toLocaleString("fr-FR"); }

  /* ---------- sujets et épisodes ---------- */
  function kSujets(){
    var s = {};
    KS.forEach(function(p){ if(p.sujet !== "" && p.sujet != null && p.type !== "story") s[Number(p.sujet)] = 1; });
    return Object.keys(s).map(Number).sort(function(a, b){ return a - b; });
  }
  function kSujetPosts(n){ return kTri(KS.filter(function(p){ return Number(p.sujet) === Number(n) && p.sujet !== "" && p.type !== "story"; })); }
  function kEp(id){ return KE.filter(function(e){ return e.id === id; })[0] || null; }
  function kEpDe(n){
    var x = kSujetPosts(n).filter(function(p){ return p.episodeId && kEp(p.episodeId); })[0];
    return x ? kEp(x.episodeId) : null;
  }
  function kInvite(n){
    var e = kEpDe(n); if(e) return e.guest || "";
    var x = kSujetPosts(n).filter(function(p){ return p.guest; })[0];
    return x ? x.guest : "";
  }
  function kStock(){ return KE.filter(function(e){ return !KS.some(function(p){ return p.episodeId === e.id; }); }); }
  function kContenu(p){
    var o = {}; K_CONTENU.forEach(function(k){ o[k] = p[k] == null ? "" : kCopie(p[k]); });
    if(!o.vK || typeof o.vK !== "object") o.vK = kBlanc();
    if(!o.vC || typeof o.vC !== "object") o.vC = kBlanc();
    return o;
  }
  function kVide(p, rang){
    var o = { title: p.type === "podcast" ? "Épisode complet" : "Short " + rang + "/6", guest:"", theme:"", link:"",
              notes:"", status:"todo", vK:kBlanc(), vC:kBlanc(), episodeId:"" };
    var m = kModeles(p.platforms || K_DEF[p.type] || K_SOCIAL); for(var k in m) o[k] = m[k];
    return o;
  }
  function kRangs(posts){ var r = 0; return posts.map(function(p){ return p.type === "podcast" ? 0 : ++r; }); }
  function kAContenu(posts){
    var rg = kRangs(posts);
    return posts.some(function(p, i){
      var v = kVide(p, rg[i]);
      return ["title","guest","theme","descLI","descIG","descYT","link","notes"].some(function(k){ return !kPareil(p[k] || "", v[k] || ""); });
    });
  }
  /* Un statut « Programmé » qui change de créneau doit être revalidé. */
  function kRevalider(c){ if(c.status === "sched") c.status = "valid"; return c; }
  function kBloque(posts){ return posts.some(function(p){ return p.status === "done"; }); }

  /* Remet l'épisode du sujet en stock (son contenu part avec lui), vide les créneaux. */
  function kTachesRetrait(n){
    var posts = kSujetPosts(n), ep = kEpDe(n), rg = kRangs(posts), t = [];
    if(!posts.length || !kAContenu(posts) && !ep) return t;
    var slots = posts.map(function(p){ var c = kContenu(p); c.episodeId = ""; return kRevalider(c); });
    if(ep) t.push(function(){ return kMaj(ep.id, { slots:slots }, true); });
    else t.push(function(){ return kCreer([{ kind:"ksf-episode", guest:kInvite(n) || "Invité non précisé", shoot:"", title:"",
                                              notes:"Remis en stock depuis le sujet " + n, slots:slots }], true); });
    posts.forEach(function(p, i){ t.push(function(){ return kMaj(p.id, kVide(p, rg[i]), true); }); });
    return t;
  }
  function kAffecter(epId, n){
    var posts = kSujetPosts(n), ep = kEp(epId), rg = kRangs(posts);
    if(!ep || !posts.length) return;
    if(kBloque(posts)){ toast("Le sujet " + n + " a déjà une publication publiée : impossible de changer son invité."); return; }
    var t = kTachesRetrait(n);
    posts.forEach(function(p, i){
      var s = ep.slots && ep.slots[i];
      var c = s ? kRevalider(kCopie(s)) : Object.assign(kVide(p, rg[i]), { guest:ep.guest || "" });
      c.episodeId = ep.id;
      if(!c.guest) c.guest = ep.guest || "";
      t.push(function(){ return kMaj(p.id, c, true); });
    });
    t.push(function(){ return kMaj(ep.id, { slots:null }, true); });
    KSF.occupe = true;
    kSuite(t).then(function(){ KSF.occupe = false; toast(ep.guest + " affecté au sujet " + n + "."); }, kEchec);
  }
  function kRetirer(n){
    var posts = kSujetPosts(n);
    if(kBloque(posts)){ toast("Le sujet " + n + " a déjà une publication publiée : impossible de le vider."); return; }
    var t = kTachesRetrait(n);
    if(!t.length){ toast("Le sujet " + n + " est déjà vide."); return; }
    KSF.occupe = true;
    kSuite(t).then(function(){ KSF.occupe = false; toast("Épisode du sujet " + n + " remis en stock."); }, kEchec);
  }
  function kEchanger(a, b){
    var pa = kSujetPosts(a), pb = kSujetPosts(b);
    if(kBloque(pa) || kBloque(pb)){ toast("Un des deux sujets a déjà une publication publiée : échange impossible."); return; }
    var t = [], n = Math.min(pa.length, pb.length);
    for(var i = 0; i < n; i++)(function(x, y){
      var cx = kRevalider(kContenu(x)), cy = kRevalider(kContenu(y));
      t.push(function(){ return kMaj(x.id, cy, true); });
      t.push(function(){ return kMaj(y.id, cx, true); });
    })(pa[i], pb[i]);
    KSF.occupe = true;
    kSuite(t).then(function(){ KSF.occupe = false; toast("Sujets " + a + " et " + b + " échangés : les dates restent en place."); }, kEchec);
  }

  function kVueSujets(){
    var t = kAuj(), port = KSF.portee, h = '<div class="kfil" style="margin-top:8px">'
      + [["avenir","En cours et à venir"],["passes","Passés"],["tous","Tous"]].map(function(x){

  function kEnregistrer(){
    var p = KSF.br;
    if(!p.date){ toast("La date est obligatoire."); return; }
    if(p.status === "sched" && !kOk(p)){
      var manque = K_VAL.filter(function(v){ return kv(p, v.k) !== "ok"; }).map(function(v){ return v.k === "vK" ? "de Kamel" : "du client"; });
      toast("Pas encore « Programmé » : il manque la validation " + manque.join(" et ") + "."); return;
    }
    if(p.sujet !== "" && p.sujet != null){ var n = parseInt(p.sujet, 10); p.sujet = isNaN(n) ? "" : n; }
    if(!KSF.id){
      KSF.occupe = true;
      kCreer([p]).then(function(){ KSF.occupe = false; toast("Publication créée."); VUE = KSF.retour || "ksf"; rendre(); }, kEchec);
      return;
    }
    var patch = {};
    K_CHAMPS.forEach(function(k){ if(!kPareil(p[k], KSF.orig[k])) patch[k] = p[k]; });
    if(!Object.keys(patch).length){ toast("Rien à enregistrer."); return; }
    var id = KSF.id;
    kMaj(id, patch).then(function(){
      var x = KS.filter(function(q){ return q.id === id; })[0];
      if(x){ KSF.orig = kCopie(x); KSF.br = kCopie(x); }
      KSF.sale = false; toast("Enregistré."); rendre();
    }, kEchec);
  }
  function kValider(k, s, com){
    var id = KSF.id; if(!id) return;
    var v = { s:s, c:com || "", by:s === "wait" ? "" : (MOI || ""), at:s === "wait" ? "" : new Date().toISOString() };
    var patch = {}; patch[k] = v;
    if(s !== "ok" && KSF.orig && KSF.orig.status === "sched"){ patch.status = "valid"; }
    KSF.br[k] = v; if(patch.status) KSF.br.status = patch.status;
    KSF.refus = null;
    kMaj(id, patch).then(function(){
      var x = KS.filter(function(q){ return q.id === id; })[0];
      if(x){ KSF.orig[k] = kCopie(x[k]); if(patch.status) KSF.orig.status = x.status; }
      toast((s === "ok" ? "Validation enregistrée." : s === "no" ? "Refus enregistré." : "Validation remise en attente.")
            + (patch.status ? " La publication repasse « À valider »." : ""));
      rendre();
    }, kEchec);
  }

      KSF.supEp = null;
      kSuppr([id]).then(function(){ toast("Épisode supprimé."); }, kEchec);
    });
    /* générateur */
    kSur("[data-kg]", "change", function(b){ var k = b.dataset.kg; KSF.gen[k] = k === "n" ? +b.value : b.value; rendre(); });
    kSur("[data-kgp]", "click", function(b){ KSF.gen.plats = b.dataset.kgp; rendre(); });
    kSur("[data-kgen]", "click", kGenerer);
    /* import */
    kSur("[data-kfile]", "change", function(b){ if(b.files && b.files[0]) kFichier(b.files[0]); });
    kSur("[data-kimp]", "click", kImporter);
    /* stats */
    kSur("[data-kbuf]", "click", function(){ kbCharger(true); rendre(); });
    kSur("[data-kmois]", "change", function(b){ KSF.statMois = b.value; rendre(); });
    kSur("[data-kmoisb]", "click", function(b){ KSF.statMois = b.dataset.kmoisb; rendre(); });
  }

  /* ---------- porte d'entrée ---------- */
  function demarrer(){
    top.hidden = false;
    rendre();
    charger();
    olCharger(false);
    plCharger(false);
    setInterval(function(){ if(!document.hidden){ olCharger(false); plCharger(false); } }, 5 * 60e3);
    setInterval(function(){ if(!document.hidden && VUE !== "new" && VUE !== "edit" && VUE !== "mat" && !kSaisie()) charger(true); }, 30000);
    window.addEventListener("focus", function(){ if(VUE !== "new" && VUE !== "edit" && VUE !== "mat" && !kSaisie()) charger(true); });
  }
  // Le code n'est jamais écrit en clair : CONFIG.CODE contient son empreinte SHA-256.
  function empreinte(txt){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
    });
  }
  function porte(){
    app.innerHTML = '<div class="porte"><h2>Régie</h2>'
      + '<p>Entrez le code de l\'équipe pour voir le planning.</p>'
      + '<form id="porteF"><input type="password" id="code" autocomplete="current-password" '
      + 'aria-label="Code d\'accès" placeholder="Code"><div class="actions" style="justify-content:center;">'
      + '<button class="btn lime" type="submit">Entrer</button></div></form></div>';
    document.getElementById("porteF").addEventListener("submit", function(e){
      e.preventDefault();
      var v = document.getElementById("code").value.trim();
      empreinte(v).then(function(h){
        if(h === CFG.CODE){
          try{ sessionStorage.setItem("sbtd-regie-ok", "1"); sessionStorage.setItem("sbtd-regie-code", v); }catch(err){}
          demarrer();
        } else { toast("Code incorrect."); }
      });
    });
    document.getElementById("code").focus();
  }

  var deja = false;
  // Le code est gardé pour la session : il ouvre aussi l'agenda Outlook.
  try{ deja = sessionStorage.getItem("sbtd-regie-ok") === "1" && !!sessionStorage.getItem("sbtd-regie-code"); }catch(e){}
  if(CFG.CODE && !deja) porte(); else demarrer();
})();
</script>
</body>
</html>
