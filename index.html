<style>

  /* La direction artistique Kamel Sans Filtre : bleu pétrole strié, vert néon, codes de caméra. */

    --ground:#04202D; --surface:rgba(9,48,66,.86); --surface-2:rgba(12,58,78,.78); --surface-3:rgba(18,74,96,.9);
    --ink:#EAF6F2; --ink-2:#B9D5DE; --muted:#7EA4B3; --line:rgba(140,200,220,.2);
    --navy:#06283A; --lime:#A8FF1F; --lime-ink:#0A2600; --cyan:#7FD6FF;
    --ok:#7BE3A6; --warn:#FFC266; --err:#FF7A5C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px -24px rgba(0,0,0,.9);
    color-scheme:dark;
    background-color:#04202D;
    background-image:
      radial-gradient(120% 70% at 50% 0%, rgba(4,32,45,0) 0%, rgba(2,20,29,.85) 100%),
      linear-gradient(90deg,
        rgba(120,170,190,.10) 0 4%, rgba(0,0,0,0) 4% 9%, rgba(140,190,210,.16) 9% 12%, rgba(0,0,0,0) 12% 19%,
        rgba(150,200,220,.22) 19% 22%, rgba(110,160,180,.08) 22% 28%, rgba(0,0,0,0) 28% 41%,
        rgba(120,170,190,.12) 41% 44%, rgba(0,0,0,0) 44% 58%, rgba(130,180,200,.09) 58% 63%,
        rgba(0,0,0,0) 63% 76%, rgba(120,170,190,.07) 76% 80%, rgba(0,0,0,0) 80%),
      linear-gradient(180deg, #0B3D53 0%, #04202D 70%);

  }
  body.ksf header.top{ background:rgba(3,26,37,.88); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  body.ksf :is(h1,h2,h3,h4){ font-family:"Inter Tight","IBM Plex Sans",sans-serif; }
  body.ksf h2.sec{ font-family:"Space Mono",monospace; font-weight:700; letter-spacing:.14em; color:var(--lime); }
  body.ksf .tab[aria-selected="true"]{ color:var(--lime); }

  body.ksf .btn.lime{ box-shadow:0 0 0 1px var(--lime), 0 0 22px -6px rgba(168,255,31,.6); }

  .khero{ position:relative; margin-top:16px; border-radius:14px; overflow:hidden; height:clamp(120px, 27vw, 220px);
          background:#05283A url("ksf-banniere.jpg") center/cover no-repeat;

  .khero .cn.b{ top:10px; right:10px; border-top-width:2px; border-right-width:2px; }

  .khero .lb{ position:absolute; font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.16em;

  /* La direction artistique Studio by The Dots : noir profond, lueurs spectrales, jaune signal, mires fines. */
  body.studio{
    --ground:#09090E; --surface:#111118; --surface-2:#16161F; --surface-3:#1E1E29;
    --ink:#EEF1F8; --ink-2:#BBC0CE; --muted:#7F8597; --line:rgba(255,255,255,.08);
    --navy:#121219; --lime:#E4E63B; --lime-ink:#17170A; --cyan:#A9B8FF; --g2:#FF9A5A;
    --ok:#7BDDA2; --warn:#FFB45C; --err:#FF6B6B;
    --shadow:none;
    color-scheme:dark;
    background-color:#09090E;
    background-image:
      radial-gradient(60% 38% at 0% 0%, rgba(255,140,40,.13), rgba(0,0,0,0) 70%),
      radial-gradient(55% 40% at 100% 0%, rgba(120,70,255,.16), rgba(0,0,0,0) 70%),
      radial-gradient(50% 30% at 50% 0%, rgba(230,40,110,.08), rgba(0,0,0,0) 70%);

  }
  body.studio header.top{ background:rgba(9,9,14,.82); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border-bottom:0; box-shadow:0 1px 0 rgba(255,255,255,.06); }
  body.studio header.top::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; opacity:.55;
    background:linear-gradient(90deg,#F4C21B,#F06A1F 18%,#D9284F 36%,#B0308F 54%,#6B3BD8 72%,#2F6BE0 88%,#1FB5C9); }
  body.studio .brand .espace[data-espace="regie"] h1{ font-family:"Unbounded",sans-serif; font-weight:700; font-size:16px; letter-spacing:0; }
  body.studio .tab{ font-size:13.5px; }

  body.studio :is(h3,h4){ font-family:"Inter Tight","IBM Plex Sans",sans-serif; }
  body.studio h2.sec{ font-family:"Space Mono",monospace; font-weight:400; font-size:11px; letter-spacing:.2em;
    color:var(--lime); display:flex; align-items:center; gap:8px; margin-top:30px; }
  body.studio h2.sec::before{ content:""; width:5px; height:5px; background:var(--lime); flex:none; }
  body.studio .card{ border:1px solid var(--line); border-left:2px solid var(--line); border-radius:12px;
    background:var(--surface); padding:15px 17px; transition:border-color .15s, background .15s; }
  body.studio .card:hover{ background:var(--surface-2); border-color:rgba(255,255,255,.16); border-left-color:var(--lime); }

  body.studio .blk, body.studio .avant{ border-radius:12px; }
  body.studio .avant{ border-left-width:2px; }
  body.studio .pill{ background:transparent; letter-spacing:.12em; }
  body.studio .pill.confirme{ background:var(--lime); color:var(--lime-ink); }
  body.studio .btn{ border-radius:999px; font-size:14px; padding:9px 18px; background:transparent; }
  body.studio .btn:hover{ background:var(--surface-2); }
  body.studio .btn.lime{ background:var(--lime); color:var(--lime-ink); }
  body.studio .btn.lime:hover{ filter:brightness(1.06); }
  body.studio .step{ background:transparent; }
  body.studio .fiche-head{ border:1px solid var(--line); border-radius:14px;
    background:linear-gradient(180deg, rgba(9,9,14,.72), rgba(9,9,14,.92)), #111118 url("studio-banniere.jpg") 0% 50%/320% auto no-repeat; }
  body.studio .fiche-head h2, body.studio .calbar .tt{ font-family:"Unbounded",sans-serif; font-weight:500; letter-spacing:-.01em; }
  body.studio .fiche-head h2{ font-size:22px; }
  body.studio .calbar .tt{ font-size:17px; }
  body.studio .slot{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.06); }
  body.studio .grille{ border-radius:12px; }
  body.studio .case.auj{ box-shadow:inset 0 0 0 1px var(--lime); }

  body.studio .ev{ border-left-width:2px; }
  body.studio input[type=text], body.studio input[type=date], body.studio input[type=time], body.studio input[type=tel],

  /* ---------- « + Nouveau projet » visible, formulaire en étapes ---------- */
  .tab.nouveau{ margin-left:auto; margin-right:0; align-self:center; background:var(--lime); color:var(--lime-ink) !important;
                border-radius:999px; padding:7px 16px; border-bottom:0 !important; font-weight:600; }

    .tab.nouveau{ display:none; }

          align-items:center; gap:8px; border:0; border-radius:999px; padding:14px 20px; font:inherit; font-weight:700; font-size:15px;
          background:var(--lime); color:var(--lime-ink); box-shadow:0 10px 30px -8px rgba(0,0,0,.7); cursor:pointer; }
  }

  .fnew .blk{ margin-top:16px; }

  .etape h3{ font-family:"Inter Tight","IBM Plex Sans",sans-serif; font-size:21px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .etape p{ margin:2px 0 0; font-size:13.5px; color:var(--muted); }

  .pc button:hover{ border-color:rgba(255,255,255,.3); color:var(--ink); }

  details.plie{ border-top:1px solid var(--line); margin-top:12px; }

  /* ---------- animations : chiffres qui défilent, tuiles qui apparaissent, barres qui montent ---------- */
  .rv{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  .rv.vu{ opacity:1; transform:none; }
  .kstat.anim .kbars .st{ animation:pousse 1s cubic-bezier(.2,.7,.2,1) both; transform-origin:50% 100%; }
  @keyframes pousse{ from{ transform:scaleY(0); } to{ transform:none; } }
  @media (prefers-reduced-motion: reduce){ .rv{ opacity:1; transform:none; transition:none; } .kstat.anim .kbars .st{ animation:none; } }

  /* ---------- Stats KSF : grands chiffres et tuiles, façon pages de référence ---------- */
  .kstat .intro{ padding-top:clamp(26px, 5vw, 52px); }
  .intro p.lead b.up{ color:var(--lime); } .intro p.lead b.down{ color:var(--err); }
  .ks-mois{ display:flex; gap:6px; overflow-x:auto; margin-top:24px; padding-bottom:2px; scrollbar-width:none; }
  .ks-mois button{ flex:none; border:1px solid var(--line); background:transparent; color:var(--ink-2); font:inherit; font-size:13px;
                   padding:7px 15px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .ks-mois button:hover{ border-color:rgba(255,255,255,.3); color:var(--ink); }
  .ks-mois button.on{ background:var(--lime); border-color:var(--lime); color:var(--lime-ink); font-weight:600; }
  .ks-pf, .ks-tile, .ks-top, .ks-m, .ks-rank{ background:var(--surface); border:1px solid var(--line); border-radius:22px; }
  .ks-pf, .ks-top, .ks-m{ padding:20px 22px; }
  .ks-tile{ padding:20px 22px; }
  .ks-pfs{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:22px; }
  .ks-pf .i, .ks-top .i, .ks-m .i{ font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .ks-pf .n, .ks-top .n{ font-family:"Inter Tight",sans-serif; font-weight:600; letter-spacing:-.045em; line-height:1;
                         font-size:clamp(40px, 5.6vw, 60px); color:var(--lime); margin-top:18px; }
  .ks-pf .u, .ks-top .u{ color:var(--ink-2); font-size:14px; margin-top:8px; }
  .ks-mini{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
  .ks-mini b{ display:block; font-family:"Inter Tight",sans-serif; font-weight:600; font-size:22px; letter-spacing:-.02em; }
  .ks-mini span{ display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .ks-best{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
  .ks-top{ grid-column:span 2; grid-row:span 2; display:flex; flex-direction:column; }
  .ks-top blockquote{ margin:auto 0 0; padding-top:18px; margin-top:22px; border-top:1px solid var(--line);
                      font-size:16px; line-height:1.45; color:var(--ink); }
  .ks-m b{ display:block; font-family:"Inter Tight",sans-serif; font-weight:600; font-size:clamp(19px, 2.2vw, 24px);
           letter-spacing:-.02em; line-height:1.15; margin-top:16px; }
  .ks-m span{ display:block; font-size:12.5px; color:var(--muted); margin-top:8px; }
  .ks-rank{ list-style:none; margin:0; padding:0; overflow:hidden; }
  .ks-rank li{ display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:center; padding:16px 22px; border-top:1px solid var(--line); }
  .ks-rank li:first-child{ border-top:0; }
  .ks-rank .r{ font-family:"Space Mono",monospace; font-size:13px; color:var(--lime); }
  .ks-rank .t b{ display:block; font-weight:500; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ks-rank .t span{ display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
  .ks-rank .v{ font-family:"Inter Tight",sans-serif; font-weight:600; font-size:26px; letter-spacing:-.03em; text-align:right; line-height:1; }
  .ks-rank .v small{ display:block; font-family:"IBM Plex Sans",sans-serif; font-weight:400; font-size:11px; letter-spacing:0; color:var(--muted); margin-top:4px; }
  .ks-tile .kbars{ gap:10px; padding-top:6px; }
  .ks-tile .kbars button{ border-radius:14px; padding:8px 0 6px; }
  .ks-tile .kbars button.on{ background:rgba(255,255,255,.05); }
  .ks-tile .kbars button.on .ml{ color:var(--lime); font-weight:600; }
  .ks-tile .kbars .st{ width:30px; border-radius:8px 8px 3px 3px; }
  .ks-tile .kheat{ gap:5px; } .ks-tile .kheat .hc{ border-radius:10px; padding:10px 2px; }
  .ks-reco{ list-style:none; margin:0; padding:0; counter-reset:r; }
  .ks-reco li{ counter-increment:r; display:grid; grid-template-columns:40px 1fr; gap:10px; padding:14px 0; border-top:1px solid var(--line); font-size:15px; line-height:1.5; }
  .ks-reco li:first-child{ border-top:0; padding-top:2px; }
  .ks-reco li::before{ content:counter(r, decimal-leading-zero); font-family:"Space Mono",monospace; font-size:12px; color:var(--lime); padding-top:3px; }
  .ks-reco b{ color:var(--lime); font-weight:600; }
  @media (max-width:760px){
    .ks-pfs{ grid-template-columns:1fr; }
    .ks-best{ grid-template-columns:1fr 1fr; }
    .ks-top{ grid-column:span 2; grid-row:auto; }
    .ks-rank li{ grid-template-columns:30px minmax(0,1fr) auto; padding:14px 16px; gap:10px; }
    .ks-rank .v{ font-size:21px; }
  }

    if(!iso) return null;

    var d = new Date(+q[0], +q[1]-1, +q[2], 12);
    return isNaN(d) ? null : d;
  }
  function jourLong(iso){
    var d = dateObj(iso);
    return d ? d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"}) : "Date à fixer";
  }
  function jourCourt(iso){
    var d = dateObj(iso);
    return d ? d.toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"}) : "à fixer";
  }
  function joursAvant(iso){
    var d = dateObj(iso);
    if(!d) return null;
    var n = new Date(); n.setHours(12,0,0,0);
    return Math.round((d - n) / 86400000);
  }
  function compte(n){
    if(n == null) return "";
    if(n === 0) return "aujourd'hui";
    if(n === 1) return "demain";
    if(n < 0)  return "il y a " + (-n) + " j";
    return "J−" + n;
  }
  function toast(m){
    var d = document.createElement("div"); d.className = "toast"; d.textContent = m;
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2600);
  }
  function projet(){
    for(var i = 0; i < P.length; i++) if(P[i].id === ID) return P[i];
    return null;
  }
  function jourDe(p, jid){
    var js = p.jours || [];
    for(var i = 0; i < js.length; i++) if(js[i].id === jid) return js[i];
    return js[0] || null;
  }
  function dates(p){ return (p.jours || []).map(function(j){ return j.date; }).filter(Boolean).sort(); }
  function debut(p){ var d = dates(p); return d[0] || "9999-99-99"; }
  function parDebut(a, b){ return debut(a).localeCompare(debut(b)); }

  function jourNum(d){ var n = d.getDate(); return n === 1 ? "1er" : String(n); }
  function majuscule(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  /* « Du 13 au 15 octobre 2026 », en gérant le changement de mois et d'année. */
  function plage(p){
    var ds = dates(p);
    if(!ds.length) return "Dates à fixer";
    var a = dateObj(ds[0]), b = dateObj(ds[ds.length - 1]);
    if(!a || !b) return "Dates à fixer";
    var mois = function(d){ return d.toLocaleDateString("fr-FR", {month:"long"}); };
    if(ds.length === 1 || +a === +b)
      return majuscule(a.toLocaleDateString("fr-FR", {weekday:"long"})) + " "
           + jourNum(a) + " " + mois(a) + " " + a.getFullYear();
    if(a.getFullYear() !== b.getFullYear())
      return "Du " + jourNum(a) + " " + mois(a) + " " + a.getFullYear()
           + " au " + jourNum(b) + " " + mois(b) + " " + b.getFullYear();
    if(mois(a) !== mois(b))
      return "Du " + jourNum(a) + " " + mois(a) + " au " + jourNum(b) + " " + mois(b) + " " + b.getFullYear();
    return "Du " + jourNum(a) + " au " + jourNum(b) + " " + mois(b) + " " + b.getFullYear();
  }


  /* La première journée encore à venir d'un projet confirmé. */
  function prochaine(p){
    if(p.statut !== "Confirmé") return null;
    var js = (p.jours || []).slice().sort(function(a, b){
      return String(a.date || "9999").localeCompare(String(b.date || "9999"));
    });
    for(var i = 0; i < js.length; i++){
      var n = joursAvant(js[i].date);
      if(n == null || n >= 0) return js[i];
    }
    return null;
  }
  function enCours(p){ return p.statut !== "Confirmé" && p.statut !== "Publié"; }

  /* Les projets photo enregistrés avant que l'album ait ses propres
     champs rangeaient leur date et leur lien avec ceux du montage. */
  function migrerAlbum(t){
    if(mediaDe(t) !== "Photo" || t.type === "Montage") return t;
    if(!t.photoDate  && t.livDate){  t.photoDate  = t.livDate;  t.livDate  = ""; }
    if(!t.photoLien  && t.livLien){  t.photoLien  = t.livLien;  t.livLien  = ""; }
    if(!t.photoNotes && t.livNotes){ t.photoNotes = t.livNotes; t.livNotes = ""; }
    return t;
  }

  /* Reprise des fiches enregistrées avant le passage aux projets. */
  function normaliser(t){
    if(Array.isArray(t.jours) && t.jours.length){
      t.jours.forEach(function(j){
        if(!j.heurePat && j.heurePremier) j.heurePat = j.heurePremier;  // ancien nom du champ
        delete j.heurePremier;
        if(!Array.isArray(j.equipe)) j.equipe = j.equipe ? [String(j.equipe)] : [];
      });
      if(!Array.isArray(t.retours)) t.retours = [];
      migrerAlbum(t);
      return t;
    }
    var c = { id:t.id, client:t.client, projet:t.projet, type:t.type, dispositif:t.dispositif,
              format:t.format, intervenants:t.intervenants, questions:t.questions, notes:t.notes,
              statut:t.statut || "Confirmé", ssd:t.ssd, validant:t.validant, cree:t.cree };
    c.jours = [{ id:"j1", date:t.date||"", heureEquipe:t.heureEquipe||"", heurePat:t.heurePat||t.heurePremier||"",
                 heureFin:t.heureFin||"", duree:t.duree||"", lieu:t.lieu||"Notre studio",
                 adresse:t.adresse||"", acces:t.acces||"", contactNom:t.contactNom||"",
                 contactTel:t.contactTel||"", note:"", equipe:[], coches:t.coches||{} }];
    return c;
  }
  function sansId(p){
    var c = {}; for(var k in p) if(k !== "id") c[k] = p[k];
    return c;
  }

  /* ---------- ce qui manque avant le tournage ----------
     Deux niveaux : une information absente, et une information
     présente mais annoncée comme « à confirmer ».
     Pas de \b devant « à » : en JavaScript, une frontière de mot ne
     reconnaît pas les lettres accentuées. */
  var RE_CONF = /(^|[\s("',;:—–-])[àa]\s+(confirmer|pr[ée]ciser|d[ée]finir|organiser|fixer|faire|d[ée]signer|valider|voir)/i;
  function aConfirmer(v){ return typeof v === "string" && RE_CONF.test(v); }

  /* Les points d'un projet pour une journée donnée. */
  function controles(p, j){
    var out = [];
    function vide(c, q){ if(c) out.push({ n:"vide", q:q }); }
    function conf(v, q){ if(aConfirmer(v)) out.push({ n:"conf", q:q }); }
    var mtg = estMontage(p);
    if(apresTournage(p)){            // en post-production, le tournage est derrière nous
      var ph = photoSeule(p);
      var aVideo = faitVideo(p) || mtg, aPhoto = faitPhoto(p) && !mtg;
      vide(!p.ssd, ph ? "où sont les photos" : "où sont les rushes");
      vide(!p.validant, ph ? "qui valide la sélection" : "qui valide le montage");
      if(aVideo) vide(!p.livDate, aPhoto ? "la date de livraison du film" : "la date de livraison visée");
      if(aPhoto) vide(!p.photoDate, aVideo ? "la date de remise des photos" : "la date de remise de l'album");
      if(aVideo) conf(p.livNotes, "le brief de montage");
      if(aPhoto) conf(p.photoNotes, "le brief de retouche");
      conf(p.notes, "les consignes du projet");
      conf(p.validant, "le validant");
      return out;
    }
    if(j){
      vide(!j.date, "la date");
      vide(!equipeDe(j).length, "qui est sur la journée");
      conf(j.note, "la note du jour");
      if(!mtg){
        var dehors = j.lieu !== "Notre studio";
        vide(!j.heureEquipe, "l'heure d'arrivée de l'équipe");
        vide(!j.heureFin, "l'heure de fin");
        vide(dehors && !j.adresse, "l'adresse du lieu");
        vide(dehors && !j.contactNom, "le contact sur place");
        conf(j.adresse, "l'adresse");
        conf(j.acces, "l'accès");
        conf(j.contactNom, "le contact sur place");
      }
    }
    if(!mtg){
      vide(!captations(p).length, "ce qu'il faut réaliser (photo / vidéo)");
      if(faitPhoto(p) && faitVideo(p)){
        var orphelines = sansDest(p);
        if(orphelines.length) out.push({ n:"vide",
          q: orphelines.length === 1
               ? "où va « " + orphelines[0].quoi + " » : vidéo ou album"
               : orphelines.length + " prises sans destination (vidéo ou album)" });
      }
      if(aInterview(p)){
        vide(!p.intervenants, "les intervenants à l'écran");
        vide(!p.questions, "qui pose les questions");
        conf(p.intervenants, "les intervenants");
        conf(p.questions, "qui pose les questions");
      }
    }
    conf(p.notes, "les consignes du projet");
    return out;
  }

  /* Tous les points du projet, journées encore à venir comprises. */
  function controlesProjet(p){
    var js = (p.jours || []).filter(function(j){
      var n = joursAvant(j.date);
      return n == null || n >= 0;
    });
    if(!js.length) js = (p.jours || []).slice(-1);
    var tot = (p.jours || []).length, vus = {}, out = [];
    js.forEach(function(j){
      var rang = (p.jours || []).indexOf(j) + 1;
      controles(p, j).forEach(function(c){
        var propreAuJour = ["la date","l'heure d'arrivée de l'équipe","l'heure de fin",
                            "l'adresse du lieu","l'adresse","l'accès","le contact sur place",
                            "qui est sur la journée","la note du jour"].indexOf(c.q) >= 0;
        var cle = c.n + "|" + c.q + "|" + (propreAuJour ? rang : "");
        if(vus[cle]) return;
        vus[cle] = true;
        out.push({ n:c.n, q:c.q, jour: (propreAuJour && tot > 1) ? ("jour " + rang) : "" });
      });
    });
    return out;
  }

  /* Une valeur de fiche : absente, à confirmer, ou normale. */
  function val(v, quoiSiVide){
    if(!v) return '<span class="manque">' + esc(quoiSiVide || "À renseigner") + '</span>';
    var t = esc(v).replace(/\n/g, "<br>");
    return aConfirmer(v) ? '<span class="conf">' + t + '</span>' : t;
  }

  /* ---------- export calendrier ----------
     Un fichier .ics par projet ou pour tout le planning : chaque
     journée devient un événement, importable dans Google Agenda,
     Apple Calendrier ou Outlook. */
  function icsEsc(s){
    return String(s == null ? "" : s)
      .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }
  function plier(l){
    var out = [], s = l;
    while(s.length > 73){ out.push(s.slice(0, 73)); s = " " + s.slice(73); }
    out.push(s);
    return out.join("\r\n");
  }
  function icsJour(d){ return String(d || "").replace(/-/g, ""); }
  function icsHeure(h){ var q = String(h || "").split(":"); return q.length === 2 ? q[0] + q[1] + "00" : null; }
  function demain(d){
    var o = dateObj(d); if(!o) return icsJour(d);
    o.setDate(o.getDate() + 1);
    return "" + o.getFullYear() + ("0" + (o.getMonth() + 1)).slice(-2) + ("0" + o.getDate()).slice(-2);
  }
  function ics(projets){
    var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Studio by The Dots//Regie//FR",
             "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Régie — Studio by The Dots"];
    var stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    projets.forEach(function(p){
      var js = p.jours || [], tot = js.length;
      js.forEach(function(j, i){
        if(!j.date) return;
        if(filtreActif() && !surLeJour(j)) return;
        var deb = icsHeure(j.heureEquipe), fin = icsHeure(j.heureFin);
        var titre = (p.client || "Tournage") + (p.projet ? " — " + p.projet : "")
                  + (tot > 1 ? " (jour " + (i + 1) + "/" + tot + ")" : "");
        var lieu = j.lieu === "Notre studio" ? (j.adresse || CFG.STUDIO || "Notre studio") : (j.adresse || "");
        var desc = [];
        if(p.type) desc.push("Prestation : " + p.type);
        if(p.format) desc.push("Format : " + p.format);
        if(p.dispositif && p.dispositif !== "Sans objet") desc.push("Dispositif : " + p.dispositif);
        if(j.heurePat) desc.push("PAT : " + j.heurePat);
        if(j.acces) desc.push("Accès : " + j.acces);
        if(j.contactNom) desc.push("Contact sur place : " + j.contactNom + (j.contactTel ? " — " + j.contactTel : ""));
        if(equipeDe(j).length) desc.push("Équipe : " + equipeDe(j).join(", "));
        if(p.intervenants) desc.push("À l'écran : " + p.intervenants);
        if(j.note) desc.push(j.note);
        var c = controles(p, j);
        if(c.length) desc.push("À régler : " + c.map(function(x){ return x.q + " (" + (x.n === "vide" ? "manque" : "à confirmer") + ")"; }).join(", "));

        L.push("BEGIN:VEVENT");
        L.push("UID:" + (p.id || "projet") + "-" + (j.id || i) + "@thedots.lu");
        L.push("DTSTAMP:" + stamp);
        if(deb){
          L.push("DTSTART:" + icsJour(j.date) + "T" + deb);
          L.push("DTEND:" + icsJour(j.date) + "T" + (fin || deb));
        } else {
          L.push("DTSTART;VALUE=DATE:" + icsJour(j.date));
          L.push("DTEND;VALUE=DATE:" + demain(j.date));
        }
        L.push(plier("SUMMARY:" + icsEsc(titre)));
        if(lieu) L.push(plier("LOCATION:" + icsEsc(lieu)));
        if(desc.length) L.push(plier("DESCRIPTION:" + icsEsc(desc.join("\n"))));
        L.push("STATUS:CONFIRMED");
        if(deb){
          L.push("BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY",
                 plier("DESCRIPTION:" + icsEsc(titre)),"END:VALARM");
        }
        L.push("END:VEVENT");
      });
    });
    L.push("END:VCALENDAR");
    return L.join("\r\n");
  }
  function slug(s){
    return String(s || "regie").toLowerCase()
      .normalize ? String(s || "regie").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "regie"
      : "regie";
  }
  function telechargerIcs(projets, nom){
    var texte = ics(projets);
    if(!/BEGIN:VEVENT/.test(texte)){ toast("Aucune date à exporter."); return; }
    try{
      var blob = new Blob([texte], { type:"text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nom;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
      toast("Calendrier téléchargé.");
    }catch(e){ toast("Téléchargement impossible sur cet appareil."); }
  }

  /* ---------- carnet de contacts ----------
     Les contacts sur place saisis dans les fiches, sortis en vCard.
     Ouvrir le fichier sur un téléphone propose de créer la fiche
     directement dans l'application Contacts, déjà remplie. */
  function vcEsc(s){
    return String(s == null ? "" : s)
      .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,")
      .replace(/\r?\n/g, "\\n");
  }
  /* « Caroline Soetens (Grant Thornton) » → prénom Caroline, nom Soetens. */
  function nomPrenom(brut){
    var s = String(brut || "").replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
    if(!s) return null;
    var m = s.split(" ");
    if(m.length === 1) return { prenom:"", nom:m[0], complet:s };
    return { prenom:m[0], nom:m.slice(1).join(" "), complet:s };
  }
  function telPropre(t){ return String(t || "").replace(/[^\d+]/g, ""); }

  /* Une fiche contact, qu'elle vienne d'une journée de tournage
     ou qu'elle ait été créée à la main dans le carnet. */
  function fichesDe(p){
    var vus = {}, out = [];
    (p.jours || []).forEach(function(j){
      var brut = j.contactNom || "";
      if(!brut.trim() && !j.contactTel && !j.contactMail) return;
      var n = j.contactSplit && (j.contactSplit.nom || j.contactSplit.prenom)
            ? { prenom:j.contactSplit.prenom || "", nom:j.contactSplit.nom || "",
                complet:((j.contactSplit.prenom || "") + " " + (j.contactSplit.nom || "")).trim() }
            : (nomPrenom(brut) || { prenom:"", nom:"", complet:"" });
      var cle = (n.complet + "|" + telPropre(j.contactTel)).toLowerCase();
      if(vus[cle]) return;
      vus[cle] = 1;
      out.push({
        src:"jour", pid:p.id, jid:j.id,
        prenom:n.prenom, nom:n.nom, complet:n.complet,
        societe: j.contactSociete || p.projet || p.client || "",
        fonction: j.contactFonction || "",
        tel: j.contactTel || "", mail: j.contactMail || "",
        notes: "",
        projet: p.projet || "", client: p.client || "", type: p.type || "",
        date: j.date || "",
        lieu: j.lieu === "Notre studio" ? (CFG.STUDIO || "Notre studio") : (j.adresse || ""),
        acces: j.acces || ""
      });
    });
    return out;
  }
  function ficheLibre(c){
    var complet = ((c.prenom || "") + " " + (c.nom || "")).trim();
    return {
      src:"libre", cid:c.id,
      prenom:c.prenom || "", nom:c.nom || "", complet:complet,
      societe:c.societe || "", fonction:c.fonction || "",
      tel:c.tel || "", mail:c.mail || "", notes:c.notes || "",
      projet:"", client:"", type:"", date:"", lieu:"", acces:""
    };
  }
  function carnet(){
    var out = [];
    P.forEach(function(p){ fichesDe(p).forEach(function(c){ out.push(c); }); });
    CT.forEach(function(c){ out.push(ficheLibre(c)); });
    return out.sort(function(a, b){
      return (a.nom || a.complet).localeCompare(b.nom || b.complet, "fr")
          || (a.prenom || "").localeCompare(b.prenom || "", "fr");
    });
  }
  function ficheDe(ref){
    var L = carnet();
    for(var i = 0; i < L.length; i++){
      var c = L[i];
      if(ref.src === "libre" && c.src === "libre" && c.cid === ref.cid) return c;
      if(ref.src === "jour" && c.src === "jour" && c.pid === ref.pid && c.jid === ref.jid) return c;
    }
    return null;
  }

  function vcard(c){
    var note = [];
    if(c.client && c.client !== c.societe) note.push("Client : " + c.client);
    if(c.type)  note.push("Prestation : " + c.type);
    if(c.date)  note.push("Tournage du " + jourLong(c.date));
    if(c.lieu)  note.push("Lieu : " + c.lieu);
    if(c.acces) note.push("Accès : " + c.acces);
    if(c.notes) note.push(c.notes);
    note.push("Fiche créée depuis la Régie — Studio by The Dots");

    var L = ["BEGIN:VCARD", "VERSION:3.0"];
    L.push("N:" + vcEsc(c.nom) + ";" + vcEsc(c.prenom) + ";;;");
    L.push("FN:" + vcEsc(c.complet || c.societe || "Contact"));
    if(c.societe)  L.push("ORG:" + vcEsc(c.societe));
    if(c.fonction) L.push("TITLE:" + vcEsc(c.fonction));
    if(c.tel)  L.push("TEL;TYPE=CELL:" + vcEsc(c.tel));
    if(c.mail) L.push("EMAIL;TYPE=WORK:" + vcEsc(c.mail));
    if(c.lieu) L.push("ADR;TYPE=WORK:;;" + vcEsc(c.lieu) + ";;;;");
    L.push(plier("NOTE:" + vcEsc(note.join("\n"))));
    L.push("END:VCARD");
    return L.join("\r\n");
  }

  /* iPhone et iPad ouvrent une vCard dans Contacts si on l'affiche ;
     s'ils la téléchargent, elle atterrit dans Fichiers et il faut aller
     la rechercher. On leur sert donc le lien plutôt que le fichier. */
  function estApple(){
    var ua = navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua)
        || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  }
  function ajouterAuxContacts(liste, nom){
    if(!liste.length){ toast("Aucun contact à ajouter."); return; }
    var texte = liste.map(vcard).join("\r\n");
    try{
      var blob = new Blob([texte], { type:"text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      if(estApple()){
        a.target = "_blank";            // Safari affiche la fiche : « Créer un contact »
        a.rel = "noopener";
      } else {
        a.download = nom;
      }
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
      toast(estApple()
        ? (liste.length > 1 ? liste.length + " fiches — touchez « Ajouter tous les contacts »."
                            : "Touchez « Créer un contact » pour l'enregistrer.")
        : (liste.length > 1 ? liste.length + " contacts prêts à ajouter."
                            : "Ouvrez le fichier : Contacts proposera de l'ajouter."));
    }catch(e){ toast("Ajout impossible sur cet appareil."); }
  }

  /* ---------- couche données ---------- */
  function net(chemin, opts){
    opts = opts || {};
    var h = {
      "apikey": CFG.SUPABASE_KEY,
      "Authorization": "Bearer " + CFG.SUPABASE_KEY,
      "Content-Type": "application/json"
    };
    if(opts.retour) h["Prefer"] = "return=representation";
    return fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/" + chemin, {
      method: opts.method || "GET", headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(t || ("HTTP " + r.status)); });
      return r.status === 204 ? null : r.json();
    });
  }
  function localSet(arr){ try{ localStorage.setItem(DEMO, JSON.stringify(arr)); }catch(e){} }
  function local(){
    var v = null;
    try{ v = localStorage.getItem(DEMO); }catch(e){}
    if(v == null){
      var d = DEPART.map(function(p, i){
        var c = { id: "dep-" + (i+1) };
        for(var k in p) c[k] = p[k];
        return c;
      });
      localSet(d);
      return d;
    }
    try{ return JSON.parse(v) || []; }catch(e){ return []; }
  }
  function etat(s){ if(etatEl) etatEl.textContent = s; }

  /* La table accueille deux sortes de lignes : les projets, et les
     contacts saisis à la main (marqués kind:"contact"). */
  function estContact(x){ return !!x && x.kind === "contact"; }
  function estKsf(x){ return !!x && /^ksf-/.test(x.kind || ""); }
  function repartir(tous){
    CT = (tous || []).filter(estContact);
    KS = (tous || []).filter(function(x){ return x.kind === "ksf-post"; });
    KE = (tous || []).filter(function(x){ return x.kind === "ksf-episode"; });
    P  = (tous || []).filter(function(x){ return !estContact(x) && !estKsf(x); }).map(normaliser);
  }

  function charger(silencieux){
    if(!EN_LIGNE){ repartir(local()); PRET = true; rendre(); return Promise.resolve(); }
    if(!silencieux) etat("chargement…");
    return net("tournages?select=id,data&order=id").then(function(rows){
      repartir((rows || []).map(function(r){
        var o = r.data || {}, c = { id: r.id };
        for(var k in o) c[k] = o[k];
        return c;
      }));
      ERREUR = ""; PRET = true; etat("à jour"); rendre();
    }, function(e){
      ERREUR = String(e.message || e); PRET = true; etat("hors ligne"); rendre();
    });
  }
  function creer(d){
    var quoi = estContact(d) ? "Contact créé." : "Projet créé.";
    if(!EN_LIGNE){
      d.id = "loc-" + Date.now(); var a = local(); a.push(d); localSet(a);
      repartir(local()); rendre(); toast(quoi); return;
    }
    etat("envoi…");
    net("tournages", { method:"POST", body:{ data:sansId(d) }, retour:true })
      .then(function(){ toast(quoi); return charger(true); },
            function(){ etat("échec"); toast("Création impossible. Vérifiez la connexion."); });
  }
  function enregistrer(p, muet){
    if(!EN_LIGNE){
      var a = local().map(function(x){ return x.id === p.id ? p : x; });
      localSet(a); repartir(local()); if(!muet) toast("Enregistré."); rendre(); return;
    }
    etat("envoi…");
    net("tournages?id=eq." + encodeURIComponent(p.id), { method:"PATCH", body:{ data:sansId(p) } })
      .then(function(){ if(!muet) toast("Enregistré."); return charger(true); },
            function(){ etat("échec"); toast("Enregistrement impossible."); charger(true); });
  }
  function supprimer(id, quoi){
    quoi = quoi || "Projet supprimé.";
    if(!EN_LIGNE){
      localSet(local().filter(function(x){ return x.id !== id; }));
      repartir(local()); rendre(); toast(quoi); return;
    }
    net("tournages?id=eq." + encodeURIComponent(id), { method:"DELETE" })
      .then(function(){ toast(quoi); return charger(true); },
            function(){ toast("Suppression impossible."); });
  }

  /* ---------- calendrier ----------
     Deux lectures du même planning : le mois pour la vue d'ensemble,
     la semaine pour le détail des horaires. */
  var CAL = { mode:"mois", ref:null };
  var JOURS_SEM = ["lun","mar","mer","jeu","ven","sam","dim"];

  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function iso(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function midi(d){ var x = new Date(d); x.setHours(12, 0, 0, 0); return x; }
  function lundi(d){
    var x = midi(d), k = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - k);
    return x;
  }
  function plusJours(d, n){ var x = midi(d); x.setDate(x.getDate() + n); return x; }
  function memeJour(a, b){ return iso(a) === iso(b); }
  function refCal(){ return CAL.ref ? midi(CAL.ref) : midi(new Date()); }

  /* Toutes les journées de tournage, indexées par date. */
  function parJour(){
    var m = {};
    P.forEach(function(p){
      (p.jours || []).forEach(function(j){
        if(!j.date) return;
        if(filtreActif() && !surLeJour(j)) return;
        (m[j.date] = m[j.date] || []).push({ p:p, j:j });
      });
    });
    // Un même rendez-vous présent dans deux agendas (même titre, même jour, mêmes heures) n'est montré qu'une fois.
    var vus = {};
    OL.evs.forEach(function(o){
      var cle = String(o.titre || "").trim().toLowerCase().replace(/\s+/g, " ") + "|" + o.du + "|" + o.au + "|" + o.h + "|" + o.hFin;
      if(vus[cle]) return;
      vus[cle] = 1;
      var d = o.du, garde = 0;
      while(d && d <= o.au && garde++ < 62){
        (m[d] = m[d] || []).push({ o:o });
        d = iso(plusJours(new Date(d + "T12:00:00"), 1));
      }
    });
    function cle(x){ return x.o ? (x.o.journee ? "00" : x.o.h) : String(x.j.heureEquipe || "99"); }
    Object.keys(m).forEach(function(k){
      m[k].sort(function(a, b){ return cle(a).localeCompare(cle(b)); });
    });
    return m;
  }

  /* ---------- agenda Outlook ----------
     Une fonction Supabase (outlook-agenda) lit l'agenda publié par Outlook et
     ne le renvoie qu'avec le code d'équipe. */
  var OL = { evs:[], agendas:[], at:0, err:"", enCours:false };
  var OL_COULEURS = ["#9B7BFF","#FF7EB6","#3FD0C9","#FFB547","#7FB2FF","#C8E06B"];
  function olCouleur(i){ return OL_COULEURS[(i || 0) % OL_COULEURS.length]; }
  function olNom(i){ var a = OL.agendas[i || 0]; return a && a.nom ? a.nom : "Outlook"; }
  var OL_CLE = "sbtd-outlook";
  (function(){ try{ var v = JSON.parse(sessionStorage.getItem(OL_CLE) || "null"); if(v && v.evs){ OL.evs = v.evs; OL.agendas = v.agendas || []; OL.at = v.at || 0; } }catch(e){} })();
  function olCharger(force){
    if(!EN_LIGNE || OL.enCours) return;
    if(!force && Date.now() - OL.at < 5 * 60e3) return;
    var code = ""; try{ code = sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){}
    OL.enCours = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/outlook-agenda" + (force ? "?force=1" : ""),
          { headers:{ "apikey":CFG.SUPABASE_KEY, "x-regie-code":code } })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){
        OL.enCours = false;
        if(!x.ok || !x.j || !x.j.evs){ OL.err = (x.j && x.j.error) || "outlook"; return; }
        OL.evs = x.j.evs; OL.agendas = x.j.agendas || []; OL.at = Date.now(); OL.err = "";
        try{ sessionStorage.setItem(OL_CLE, JSON.stringify({ at:OL.at, evs:OL.evs, agendas:OL.agendas })); }catch(e){}
        if(VUE === "cal") rendre();
      }, function(){ OL.enCours = false; OL.err = "reseau"; });
  }
  /* ---------- planning personnel ----------
     Refait chaque lundi par une tâche de Claude (agenda Outlook, mails, DotsFlow, Régie)
     et rangé dans la table « plannings », lisible seulement via la fonction « planning »
     avec le code d'équipe. L'onglet n'apparaît que pour la personne choisie dans « Vous êtes ». */
  var PL = { pour:"", data:null, maj:"", at:0, enCours:false };
  function plCharger(force){
    var qui = String(MOI || "").trim().split(/\s+/)[0].toLowerCase();
    if(!qui){ if(PL.data){ PL.data = null; PL.pour = ""; if(VUE === "planning") VUE = "avenir"; rendreTabs(); } return; }
    if(!EN_LIGNE || PL.enCours) return;
    if(!force && PL.pour === qui && Date.now() - PL.at < 5 * 60e3) return;
    var code = ""; try{ code = sessionStorage.getItem("sbtd-regie-code") || ""; }catch(e){}
    PL.enCours = true;
    fetch(CFG.SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/planning?pour=" + encodeURIComponent(qui),
          { headers:{ "apikey":CFG.SUPABASE_KEY, "x-regie-code":code } })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){
        PL.enCours = false; PL.pour = qui; PL.at = Date.now();
        var avant = !!PL.data;
        PL.data = x.ok && x.j && x.j.planning ? x.j.planning : null;
        PL.maj = x.ok && x.j ? x.j.maj : "";
        if(!PL.data && VUE === "planning") VUE = "avenir";
        if(VUE === "planning" || avant !== !!PL.data) rendre(); else rendreTabs();
      }, function(){ PL.enCours = false; });
  }
  function vuePlanning(){
    var D = PL.data;
    if(!D) return vide("Pas de planning personnel pour " + (MOI || "cette personne") + ".");
    var fmtJ = new Intl.DateTimeFormat("fr-FR", { weekday:"short" });
    var fmtM = new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"long" });
    var fmtMaj = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" });
    function jr(x){ return new Date(x + "T12:00:00"); }
    var auj = iso(new Date());
    var CH = { late:["late","En retard"], todo:["todo","À faire"], done:["done","Rendu"] };
    var h = '<div class="mp">';
    h += '<p class="mp-meta">' + (D.du && D.au ? 'Du ' + esc(fmtM.format(jr(D.du))) + ' au ' + esc(fmtM.format(jr(D.au))) + ' · ' : '')
       + (D.majLe ? 'mis à jour ' + esc(fmtMaj.format(new Date(D.majLe))) : '') + '</p>';

    h += '<h3 class="mp-h">Ce que vous devez faire <span>' + (D.priorites || []).length + '</span></h3>';
    if((D.priorites || []).length){
      h += '<ol class="mp-tasks">';
      D.priorites.forEach(function(p, i){
        var c = CH[p.etat] || ["info", "Info"];
        h += '<li><span class="rk">' + pad2(i + 1) + '</span><div><div class="t">' + esc(p.titre)
          + ' <span class="mp-chip ' + c[0] + '">' + c[1] + '</span></div>'
          + (p.detail ? '<div class="d">' + esc(p.detail) + '</div>' : '')
          + (p.points && p.points.length ? '<ul>' + p.points.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' : '')
          + '</div></li>';
      });
      h += '</ol>';
    } else h += '<p class="mp-vide">Rien en attente.</p>';

    h += '<h3 class="mp-h">Agenda</h3><div class="mp-leg">'
       + '<span><i class="tournage"></i>Tournage</span><span><i class="montage"></i>Montage</span>'
       + '<span><i class="rdv"></i>Rendez-vous</span><span><i class="ksf"></i>KSF</span><span><i class="alerte"></i>À arbitrer</span></div>'
       + '<div class="mp-days">';
    (D.jours || []).forEach(function(j){
      var d = jr(j.date), passe = j.date < auj;
      h += '<div class="mp-day' + (j.date === auj ? ' auj' : '') + (passe ? ' passe' : '') + '"><div class="dt"><b>' + d.getDate() + '</b>'
         + esc(fmtJ.format(d)) + (j.date === auj ? ' · aujourd\'hui' : '') + '</div><div class="evs">';
      (j.evs || []).forEach(function(e){
        h += '<div class="mp-ev ' + esc(e.type || "rdv") + (e.libre ? ' libre' : '') + '"><span class="h">' + esc(e.h || "—") + '</span>'
           + '<span class="w">' + esc(e.titre) + (e.lieu ? '<small>' + esc(e.lieu) + '</small>' : '') + '</span></div>';
      });
      h += '</div></div>';
    });
    h += '</div>';

    function liste(a, v){ return a && a.length ? '<ul>' + a.map(function(x){ return '<li>' + (typeof x === "string" ? esc(x) : '<b>' + esc(x.titre) + '</b>' + (x.detail ? ' — ' + esc(x.detail) : '')) + '</li>'; }).join("") + '</ul>' : '<p class="mp-vide">' + v + '</p>'; }
    h += '<div class="mp-cols"><div class="mp-box"><h4>Rendu ou validé depuis lundi dernier</h4>'
       + liste(D.rendu, "Rien encore. Les projets passés en « Publié » et les livraisons envoyées par mail apparaîtront ici.") + '</div>'
       + '<div class="mp-box"><h4>À vérifier dans la Régie</h4>' + liste(D.aVerifier, "Tout est à jour.") + '</div></div>';
    h += '<p class="mp-src">Sources : ' + esc(D.sources || "") + '. Mis à jour chaque lundi matin.</p></div>';
    return h;
  }
  function legendeOutlook(){
    if(!OL.evs.length && !OL.agendas.length) return "";
    var l = OL.agendas.length ? OL.agendas : [{ nom:"Outlook", ok:true }];
    return ' <span class="leg-ol">' + l.map(function(a, i){
      return '<span class="pt" style="--olc:' + olCouleur(i) + '"></span>' + esc(a.nom || "Outlook")
        + (a.ok === false ? ' <em>(indisponible)</em>' : '');
    }).join(" · ") + '</span>';
  }
  function evOutlook(o, avecLieu){
    var heure = o.journee ? "Journée" : o.h + (o.hFin && o.au === o.du ? "–" + o.hFin : "");
    return '<div class="ev outlook' + (o.occupe === "FREE" ? " libre" : "") + '" style="--olc:' + olCouleur(o.cal) + '" title="'
      + esc(olNom(o.cal) + " · " + o.titre + (o.lieu ? " — " + o.lieu : "") + (o.journee ? "" : " · " + o.h + "–" + o.hFin)) + '">'
      + '<span class="h">' + esc(heure) + '</span> '
      + '<span class="q">' + esc(o.titre) + '</span>'
      + (avecLieu ? '<span class="l">' + esc(olNom(o.cal)) + (o.lieu ? " · " + esc(o.lieu) : "") + '</span>' : '')
      + '</div>';
  }

  function evenement(x, avecLieu){
    if(x.o) return evOutlook(x.o, avecLieu);
    var p = x.p, j = x.j;
    var tot = (p.jours || []).length, rang = (p.jours || []).indexOf(j) + 1;
    var lieu = j.lieu === "Notre studio" ? "Studio" : (j.adresse || "");
    return '<button class="ev ' + (CLASSE[p.statut] || "") + '" data-id="' + esc(p.id) + '" data-jour="' + esc(j.id) + '"'
      + ' title="' + esc((p.client || "") + " — " + (p.projet || "")) + '">'
      + (j.heureEquipe ? '<span class="h">' + esc(j.heureEquipe) + '</span> ' : '')
      + '<span class="q">' + esc(p.client || "Projet") + '</span>'
      + (tot > 1 ? '<span class="r"> · J' + rang + '</span>' : '')
      + (avecLieu ? '<span class="l">' + esc(p.type || "") + (lieu ? " · " + esc(lieu) : "")
                    + (equipeDe(j).length ? " · " + esc(equipeDe(j).join(", ")) : "") + '</span>' : '')
      + (!avecLieu && equipeDe(j).length
          ? '<span class="ini">' + esc(equipeDe(j).map(initiales).join(" ")) + '</span>' : '')
      + '</button>';
  }

  function barreCal(titre){
    return '<div class="calbar"><h2 class="tt">' + esc(titre) + '</h2>'
      + '<div class="nav">'
      + '<button class="btn" data-cal="prec" aria-label="Précédent">‹</button>'
      + '<button class="btn" data-cal="auj">Aujourd\'hui</button>'
      + '<button class="btn" data-cal="suiv" aria-label="Suivant">›</button>'
      + '</div>'
      + '<div class="modes">'
      + '<button class="btn' + (CAL.mode === "mois" ? " lime" : "") + '" data-mode="mois">Mois</button>'
      + '<button class="btn' + (CAL.mode === "semaine" ? " lime" : "") + '" data-mode="semaine">Semaine</button>'
      + '</div></div>';
  }

  function vueMois(){
    var r = refCal(), m = parJour(), auj = midi(new Date());
    var premier = new Date(r.getFullYear(), r.getMonth(), 1, 12);
    var debut = lundi(premier);
    var fin = new Date(r.getFullYear(), r.getMonth() + 1, 0, 12);
    var nb = Math.ceil((plusJours(fin, 1) - debut) / 86400000 / 7) * 7;

    var h = barreCal(premier.toLocaleDateString("fr-FR", { month:"long", year:"numeric" }));
    h += '<div class="grille">';
    JOURS_SEM.forEach(function(d){ h += '<div class="cal-jh">' + d + '</div>'; });
    for(var i = 0; i < nb; i++){
      var d = plusJours(debut, i), k = iso(d);
      var dedans = d.getMonth() === r.getMonth();
      var liste = m[k] || [];
      h += '<div class="case' + (dedans ? "" : " hors") + (memeJour(d, auj) ? " auj" : "") + '">'
         + '<div class="num">' + d.getDate() + '</div>';
      liste.slice(0, 3).forEach(function(x){ h += evenement(x, false); });
      if(liste.length > 3) h += '<div class="plus">+' + (liste.length - 3) + '</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '<p class="legende">Cliquez sur une journée pour ouvrir sa fiche. '
       + 'La couleur suit le statut du projet.' + legendeOutlook() + '</p>';
    return h;
  }

  function vueSemaine(){
    var r = refCal(), m = parJour(), auj = midi(new Date());
    var debut = lundi(r), fin = plusJours(debut, 6);
    var meme = debut.getMonth() === fin.getMonth();
    var titre = debut.getDate() + (meme ? "" : " " + debut.toLocaleDateString("fr-FR", { month:"long" }))
              + " – " + fin.getDate() + " " + fin.toLocaleDateString("fr-FR", { month:"long", year:"numeric" });

    var h = barreCal(titre) + '<div class="sem">';
    for(var i = 0; i < 7; i++){
      var d = plusJours(debut, i), k = iso(d), liste = m[k] || [];
      h += '<div class="ligne' + (memeJour(d, auj) ? " auj" : "") + (liste.length ? "" : " creux") + '">'
         + '<div class="j">' + esc(d.toLocaleDateString("fr-FR", { weekday:"long" })) + '<b>' + d.getDate() + '</b></div>'
         + '<div class="evs">';
      if(liste.length) liste.forEach(function(x){ h += evenement(x, true); });
      else h += '<span class="rien">—</span>';
      h += '</div></div>';
    }
    return h + '</div>';
  }

  function vueCalendrier(){
    if(!P.length && !OL.evs.length) return '<h2 class="sec">Calendrier</h2>' + vide("Aucun projet enregistré.");
    return CAL.mode === "semaine" ? vueSemaine() : vueMois();
  }

  function decaler(sens){
    var r = refCal();
    if(CAL.mode === "semaine") CAL.ref = plusJours(r, 7 * sens);
    else CAL.ref = new Date(r.getFullYear(), r.getMonth() + sens, 1, 12);
  }

  /* ---------- onglets ---------- */
  var ONGLETS = [
    { id:"avenir", nom:"À venir" },
    { id:"cal",    nom:"Calendrier" },
    { id:"planning", nom:"Mon planning" },
    { id:"suivi",  nom:"Après tournage" },
    { id:"tous",   nom:"Projets" },
    { id:"contacts", nom:"Contacts" },
    { id:"new",    nom:"+ Nouveau projet" }
  ];
  /* KSF a son propre espace : ses rubriques prennent la place des onglets de la Régie. */
  var K_ONGLETS = [["semaine","Cette semaine"],["cal","Calendrier"],["sujets","Par sujet"],["episodes","Épisodes"],["stats","Stats"]];
  var DERNIERE_REGIE = "avenir";
  function estKsfVue(){ return /^ksf/.test(VUE); }
  function rendreEspaces(){
    var el = document.getElementById("espaces"); if(!el) return;
    var ksf = estKsfVue(), late = KS.filter(function(p){ return kFlags(p).late; }).length;
    el.innerHTML = '<button class="espace" data-espace="regie"' + (ksf ? '' : ' aria-current="page"') + '>'
      + '<span class="dot"></span><h1>Régie</h1></button>'
      + '<button class="espace" data-espace="ksf" title="Kamel Sans Filtre"' + (ksf ? ' aria-current="page"' : '') + '>'
      + '<img src="ksf-logo.png" alt=""><span class="nm">KSF</span>'
      + (late ? '<span class="c" title="Publications en retard">' + late + '</span>' : '') + '</button>';
    document.getElementById("sousTitre").textContent = ksf ? "Kamel Sans Filtre" : "Studio by The Dots";
    document.body.classList.toggle("ksf", ksf);
    document.body.classList.toggle("studio", !ksf);
    document.title = ksf ? "KSF — Régie" : "Régie — Studio by The Dots";
    var hash = ksf ? "#ksf" : "";
    if((location.hash || "") !== hash){ try{ history.replaceState(null, "", location.pathname + location.search + hash); }catch(e){} }
    el.querySelectorAll("[data-espace]").forEach(function(b){
      b.addEventListener("click", function(){
        if(b.dataset.espace === "ksf"){ if(!estKsfVue()){ VUE = "ksf"; } else if(VUE !== "ksf-fiche"){ VUE = "ksf"; } }
        else { VUE = DERNIERE_REGIE || "avenir"; }
        rendre(); window.scrollTo(0,0);
      });
    });
  }
  function rendreTabs(){
    var h = "";
    rendreEspaces();
    if(estKsfVue()){
      K_ONGLETS.forEach(function(x){
        h += '<button class="tab" role="tab" data-ksftab="' + x[0] + '" aria-selected="'
           + (VUE === "ksf" && KSF.sous === x[0] ? "true" : "false") + '">' + esc(x[1]) + '</button>';
      });
      tabsEl.innerHTML = h;
      tabsEl.querySelectorAll("[data-ksftab]").forEach(function(b){
        b.addEventListener("click", function(){
          if(VUE === "ksf-fiche" && KSF.sale){ toast("Enregistrez ou quittez la fiche avant de changer de rubrique."); return; }
          KSF.sous = b.dataset.ksftab; VUE = "ksf"; rendre(); window.scrollTo(0,0);
        });
      });
      return;
    }
    if(["avenir","cal","planning","suivi","tous","contacts"].indexOf(VUE) >= 0) DERNIERE_REGIE = VUE;
    ONGLETS.forEach(function(o){
      if(o.id === "planning" && !PL.data) return;   // seulement pour qui a un planning personnel
      var n = o.id === "planning" ? (PL.data.priorites || []).filter(function(x){ return x.etat === "late"; }).length
            : o.id === "avenir" ? P.filter(function(p){ return !!prochaine(p); }).length
            : o.id === "suivi"  ? P.filter(enCours).length
            : o.id === "tous"   ? P.length
            : o.id === "contacts" ? carnet().length : null;
      h += '<button class="tab' + (o.id === "new" ? ' nouveau' : '') + '" role="tab" data-vue="' + o.id + '"'
         + ' aria-selected="' + ((VUE === o.id || (VUE === "fiche" && o.id === (RETOUR || "avenir"))) ? "true" : "false") + '">'
         + esc(o.nom) + (n ? '<span class="c">' + n + '</span>' : '') + '</button>';
    });
    tabsEl.innerHTML = h;
    tabsEl.querySelectorAll("[data-vue]").forEach(function(b){
      b.addEventListener("click", function(){
        VUE = b.dataset.vue;
        if(VUE === "new"){ ID = null; BROUILLON = neufProjet(); MAT_FORM = false; SUP = null; }
        rendre(); window.scrollTo(0,0);
      });
    });
  }

  /* Le sélecteur « qui êtes-vous », et le filtre qui en découle. */
  function rendreMoi(){
    if(!moiEl) return;
    var noms = equipeConnue();
    var h = '<label for="i_moi">Vous êtes</label>'
      + '<select id="i_moi"><option value="">— toute l\'équipe —</option>';
    noms.forEach(function(n){
      h += '<option' + (n === MOI ? " selected" : "") + '>' + esc(n) + '</option>';
    });
    h += '</select>';
    if(MOI){
      var n = P.filter(surLeProjet).length;
      h += '<button type="button" class="bascule' + (MIENS ? " on" : "") + '" data-miens="1"'
         + ' aria-pressed="' + (MIENS ? "true" : "false") + '">'
         + (MIENS ? "Mes tournages" : "Voir mes tournages")
         + (n ? ' · ' + n : '') + '</button>';
    }
    moiEl.innerHTML = h;
    var sel = moiEl.querySelector("#i_moi");
    if(sel) sel.addEventListener("change", function(){
      MOI = sel.value;
      if(!MOI) MIENS = false;
      retenirMoi(); plCharger(true); rendre();
    });
    var bas = moiEl.querySelector("[data-miens]");
    if(bas) bas.addEventListener("click", function(){
      MIENS = !MIENS; retenirMoi(); rendre();
    });
  }

  /* ---------- cartes ---------- */
  function carteAVenir(p, j){
    var n = joursAvant(j.date), urgent = n != null && n >= 0 && n <= 2;
    var js = p.jours || [], tot = js.length, rang = js.indexOf(j) + 1;
    var lieu = j.lieu === "Notre studio" ? "Notre studio" : (j.adresse || j.lieu || "Lieu à préciser");
    return '<button class="card' + (urgent ? " urgent" : "") + '" data-id="' + esc(p.id) + '" data-jour="' + esc(j.id) + '">'
      + '<div class="l1"><span class="when">' + esc(plage(p)) + '</span>'
      + '<span class="cd">' + esc(compte(n)) + '</span></div>'
      + '<h3>' + esc(p.client || "Client à préciser") + '</h3>'
      + '<div class="sub">' + esc(p.projet || p.type || "") + '</div>'
      + '<div class="next"><b>' + (tot > 1 ? 'Prochaine journée · jour ' + rang + ' sur ' + tot : 'Journée de tournage') + '</b>'
      + esc(jourLong(j.date)) + (j.heureEquipe ? ', arrivée ' + esc(j.heureEquipe) : '')
      + ' — ' + esc(lieu)
      + (equipeDe(j).length ? '<span class="eqline">Avec ' + esc(equipeDe(j).join(", ")) + '</span>'
                            : '<span class="eqline vide">Personne d\'assigné</span>') + '</div>'
      + '<div class="l3"><span class="pill ' + (CLASSE[p.statut] || "") + '">' + esc(libStatut(p, p.statut) || "") + '</span>'
      + '<span class="pill">' + esc(p.type || "") + '</span>'
      + (faitPhoto(p) ? '<span class="pill">' + esc(mediaDe(p)) + '</span>' : '')
      + alerte(p)
      + '</div></button>';
  }
  /* Pastille de rappel sur une carte. */
  function alerte(p){
    var c = controlesProjet(p);
    var v = c.filter(function(x){ return x.n === "vide"; }).length;
    var f = c.length - v;
    var h = "";
    if(v) h += '<span class="pill rouge">' + v + ' manque' + (v > 1 ? 's' : '') + '</span>';
    if(f) h += '<span class="pill orange">' + f + ' à confirmer</span>';
    var r = retoursOuverts(p);
    if(r) h += '<span class="pill retour">' + r + ' retour' + (r > 1 ? 's' : '') + ' à traiter</span>';
    return h;
  }
  function carteProjet(p){
    var tot = (p.jours || []).length;
    var quand = plage(p);
    if(apresTournage(p)){
      var dl = dateLivr(p), nl = joursAvant(dl);
      return '<button class="card" data-id="' + esc(p.id) + '">'
        + '<div class="l1"><span class="when">' + (photoSeule(p) ? 'Remise ' : 'Livraison ')
        + (dl ? esc(jourLong(dl)) : 'à fixer') + '</span>'
        + '<span class="cd">' + esc(nl != null ? compte(nl) : "") + '</span></div>'
        + '<h3>' + esc(p.client || "Client à préciser") + '</h3>'
        + '<div class="sub">' + esc(p.projet || "") + '</div>'
        + '<div class="next"><b>Tourné ' + esc(quand.toLowerCase()) + '</b>'
        + esc(p.livDuree ? "Durée visée " + p.livDuree + " · " : "") + esc(p.format || "")
        + (p.ssd ? ' — rushes : ' + esc(p.ssd) : '') + '</div>'
        + '<div class="l3"><span class="pill ' + (CLASSE[p.statut] || "") + '">' + esc(libStatut(p, p.statut) || "") + '</span>'
        + '<span class="pill">' + esc(p.type || "") + '</span>'
        + alerte(p)
        + '</div></button>';
    }
    return '<button class="card" data-id="' + esc(p.id) + '">'
      + '<div class="l1"><span class="when">' + esc(quand) + '</span>'
      + '<span class="jrs">' + tot + (tot > 1 ? " journées" : " journée") + '</span></div>'
      + '<h3>' + esc(p.client || "Client à préciser") + '</h3>'
      + '<div class="sub">' + esc(p.projet || "") + '</div>'
      + '<div class="l3"><span class="pill ' + (CLASSE[p.statut] || "") + '">' + esc(libStatut(p, p.statut) || "") + '</span>'
      + '<span class="pill">' + esc(p.type || "") + '</span>'
      + alerte(p)
      + '</div></button>';
  }
  function vide(t){ return '<div class="vide"><p>' + esc(t) + '</p></div>'; }

  /* ---------- vues ---------- */
  /* Ce qui tombe aujourd'hui et demain, mis en tête pour qu'on le voie
     sans avoir à chercher — avec ce qui manque encore sur ces journées. */
  function bandeauImminent(){
    var auj = iso(midi(new Date())), dem = iso(plusJours(new Date(), 1));
    var l = [];
    P.forEach(function(p){
      (p.jours || []).forEach(function(j){
        if(j.date !== auj && j.date !== dem) return;
        if(filtreActif() && !surLeJour(j)) return;
        l.push({ p:p, j:j, quand: j.date === auj ? "Aujourd'hui" : "Demain" });
      });
    });
    if(!l.length) return "";
    l.sort(function(a, b){
      return (a.j.date + (a.j.heureEquipe || "99")).localeCompare(b.j.date + (b.j.heureEquipe || "99"));
    });
    var trous = 0;
    var lignes = l.map(function(x){
      var c = controles(x.p, x.j);
      trous += c.filter(function(z){ return z.n === "vide"; }).length;
      var lieu = x.j.lieu === "Notre studio" ? "studio" : (x.j.adresse || "lieu à préciser");
      return '<li><b>' + esc(x.quand) + (x.j.heureEquipe ? " " + esc(x.j.heureEquipe) : "") + '</b> · '
        + esc(x.p.client || "Client à préciser") + ' — ' + esc(lieu)
        + (equipeDe(x.j).length ? ' · ' + esc(equipeDe(x.j).join(", "))
                                : ' · <span class="manque">personne d\'assigné</span>')
        + (c.length ? ' <span class="q">' + c.length + ' point' + (c.length > 1 ? 's' : '') + ' à régler</span>' : '')
        + '</li>';
    }).join("");
    return '<div class="imminent' + (trous ? " rouge" : "") + '">'
      + '<h3>' + l.length + (l.length > 1 ? ' journées' : ' journée') + ' dans les 48 heures</h3>'
      + '<ul>' + lignes + '</ul></div>';
  }

  function vueAvenir(){
    var lignes = [];
    P.forEach(function(p){
      var j = filtreActif()
        ? (p.jours || []).filter(function(x){
            var n = joursAvant(x.date);
            return surLeJour(x) && (n == null || n >= 0);
          }).sort(function(a, b){
            return String(a.date || "9999").localeCompare(String(b.date || "9999"));
          })[0]
        : prochaine(p);
      if(j) lignes.push({ p:p, j:j });
    });
    lignes.sort(function(a, b){ return String(a.j.date || "9999").localeCompare(String(b.j.date || "9999")); });
    return bandeauImminent()
      + '<h2 class="sec">' + (filtreActif() ? "Mes prochains tournages" : "Projets à venir") + '</h2>'
      + (lignes.length ? lignes.map(function(x){ return carteAVenir(x.p, x.j); }).join("")
         + '<div class="actions"><button class="btn" data-icsall="1">'
         + (filtreActif() ? "Mes journées dans mon calendrier" : "Tout le planning dans mon calendrier")
         + '</button></div>'
         : vide(filtreActif() ? "Aucune journée ne vous est assignée pour le moment."
                              : "Aucun projet à venir.")
           + '<div class="actions">'
           + (filtreActif() ? '<button class="btn" data-miensoff="1">Revoir tout le planning</button>'
                            : '<button class="btn lime" data-go="new">Créer un projet</button>')
           + '</div>');
  }
  function vueSuivi(){
    var s = P.filter(enCours).sort(parDebut);
    var pub = P.filter(function(p){ return p.statut === "Publié"; }).sort(parDebut).reverse().slice(0, 6);
    return '<h2 class="sec">En cours de post-production</h2>'
      + (s.length ? s.map(carteProjet).join("") : vide("Rien en post-production."))
      + (pub.length ? '<h2 class="sec">Derniers publiés</h2>' + pub.map(carteProjet).join("") : "");

  /* Le carnet : un contact par ligne, modifiable, appelable, exportable. */

  /* Le bloc « à réaliser » tel qu'il s'affiche sur une fiche. */
  function blocAReal(p){
    var caps = captations(p);
    if(!caps.length) return '';
    return '<div class="blk"><h3>À réaliser — ' + esc(mediaDe(p)) + '</h3><div class="caps">'
      + caps.map(function(c){
          return '<div class="cap"><span class="q">' + esc(c.quoi) + '</span>'
               + (c.media
                   ? '<span class="mpill ' + classeMedia(c.media) + '">' + esc(c.media) + '</span>'
                   : '<span class="mpill vide">à répartir</span>') + '</div>';
        }).join("")
      + '</div></div>';
  }

  /* ---------- les retours ----------
     Tout ce qui se dit sur un montage en cours, au même endroit :
     qui l'a demandé, quand, à quel timecode, et si c'est fait. */
  function retours(p){ return Array.isArray(p.retours) ? p.retours : []; }
  function retoursOuverts(p){
    return retours(p).filter(function(r){ return !r.fait; }).length;
  }
  function quandCourt(iso){
    var d = iso ? new Date(iso) : null;
    if(!d || isNaN(d)) return "";
    return d.toLocaleDateString("fr-FR", { day:"numeric", month:"short" })
         + " à " + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  }
  function blocRetours(p){
    var L = retours(p).slice().sort(function(a, b){
      return String(a.quand || "").localeCompare(String(b.quand || ""));
    });
    var ouverts = L.filter(function(r){ return !r.fait; }).length;

    var h = '<div class="blk"><h3>Retours'
      + (L.length ? ' — ' + (L.length - ouverts) + ' / ' + L.length + ' traités' : '') + '</h3>'
      + '<p class="kitmeta">Les demandes de modification sur le montage. '
      + 'Tout ce qui arrivait par mail ou par message se note ici, '
      + 'pour que le monteur ait une seule liste à suivre.</p>';

    if(!L.length){
      h += '<p class="rienl" style="color:var(--muted);">Aucun retour pour l\'instant.</p>';
    } else {
      h += '<div class="retours">';
      L.forEach(function(r){
        h += '<div class="ret' + (r.fait ? " fait" : "") + '">'
          + '<div class="rt">'
          + '<label class="chk mini' + (r.fait ? " on" : "") + '">'
          + '<input type="checkbox" data-ret="' + esc(r.id) + '"' + (r.fait ? " checked" : "") + '>'
          + '<span class="box"></span><span class="t">' + (r.fait ? "Traité" : "À faire") + '</span></label>'
          + (r.tc ? '<span class="tc">' + esc(r.tc) + '</span>' : '')
          + '<span class="sig">' + esc(r.qui || "—")
          + (r.quand ? ' · ' + esc(quandCourt(r.quand)) : '') + '</span>'
          + '<button type="button" class="lien" data-retsup="' + esc(r.id) + '">Supprimer</button>'
          + '</div>'
          + '<p class="rtx">' + val(r.texte) + '</p>'
          + '</div>';
      });
      h += '</div>';
    }

    h += '<div class="retadd">'
      + '<div class="f"><label for="i_rettc">Timecode <span class="hint">Facultatif : '
      + 'à quel moment du montage, par exemple 01:23.</span></label>'
      + '<input type="text" id="i_rettc" placeholder="01:23"></div>'
      + '<div class="f"><label for="i_rettexte">Le retour</label>'
      + '<textarea id="i_rettexte" placeholder="Couper le silence avant la réponse, remonter la musique…"></textarea></div>'
      + '<div class="actions"><button type="button" class="btn lime" data-retadd="1">Ajouter le retour</button>'
      + (MOI ? '<span class="sig">Signé ' + esc(MOI) + '</span>'
             : '<span class="sig manque">Choisissez votre nom en haut pour signer vos retours</span>')
      + '</div></div></div>';
    return h;
  }

  /* ---------- reprise d'une demande client ----------
     Le formulaire de préparation envoie un récapitulatif par mail.
     Plutôt que de le recopier, on le colle ici : les champs reconnus
     remplissent le formulaire, le reste atterrit dans « À savoir ».
     Rien n'est enregistré tant que personne n'a relu et validé. */
  var TYPE_DEMANDE = [
    [/90\s*secondes?\s*outside/i, "90 secondes OUTSIDE"],
    [/expert\s*insights?/i,       "Expert insights"],
    [/podcast/i,                  "Podcast studio"],
    [/interview/i,                "Interview corporate"],
    [/captation|[ée]v[ée]nement/i,"Captation événement"],
    [/photo|shooting/i,           "Shooting photo"],
    [/vid[ée]o|film/i,            "Tournage vidéo"]
  ];
  function typeDepuis(txt){
    for(var i = 0; i < TYPE_DEMANDE.length; i++)
      if(TYPE_DEMANDE[i][0].test(txt)) return TYPE_DEMANDE[i][1];
    return null;
  }
  /* « Libellé : valeur » — le format du récapitulatif envoyé par le formulaire. */
  function lireDemande(txt){
    var champs = [];
    String(txt || "").split(/\r?\n/).forEach(function(l){
      var m = l.match(/^\s*(.+?)\s*:\s*(.+?)\s*$/);
      if(m && m[1].length < 80) champs.push({ k:m[1], v:m[2] });
    });
    function prendre(re){
      for(var i = 0; i < champs.length; i++)
        if(re.test(champs[i].k)) return champs[i].v;
      return "";
    }
    function toutes(re){
      return champs.filter(function(c){ return re.test(c.k); }).map(function(c){ return c.v; });
    }
    var b = neufProjet();
    b.client = prendre(/^votre soci[ée]t[ée]/i) || prendre(/^soci[ée]t[ée]|^client/i);
    b.projet = prendre(/^nom du projet/i);

    var t = typeDepuis(prendre(/formule/i))
         || typeDepuis(prendre(/type de prestation/i))
         || typeDepuis(String(txt || ""));
    if(t) b.type = t;
    if(/photo/i.test(prendre(/type de prestation/i))) b.media = "Photo";

    var fmt = prendre(/^format/i);
    if(/vertical/i.test(fmt)) b.format = "Vertical";
    else if(/horizontal/i.test(fmt)) b.format = "Horizontal 16/9";

    var itw = toutes(/^intervenant/i);
    if(itw.length) b.intervenants = itw.join("\n");
    b.questions = prendre(/qui pose les questions/i);

    var lieu = prendre(/^lieu du tournage|o[ùu] se d[ée]roule|^lieu$/i);
    var j = b.jours[0];
    if(/vos locaux|chez le client/i.test(lieu)) j.lieu = "Chez le client";
    else if(/autre lieu/i.test(lieu)) j.lieu = "Autre lieu";
    // « Dans vos locaux — 2 rue de la Brasserie » : l'adresse suit le tiret
    var apres = lieu.split(/\s+—\s+/).slice(1).join(" — ");
    j.adresse = prendre(/adresse exacte|^adresse/i) || apres;
    j.contactNom = prendre(/^contact$|interlocuteur/i) || prendre(/votre nom et votre fonction/i);
    j.contactTel = prendre(/^t[ée]l[ée]phone$|num[ée]ro de portable/i);

    var sujet = prendre(/quel est le sujet|de quoi parle|^sujet/i);
    var insight = prendre(/insight/i);
    var demandeur = prendre(/votre nom et votre fonction/i);
    var mail = prendre(/e-?mail/i);
    var restes = [];
    if(sujet)     restes.push("Sujet : " + sujet);
    if(insight)   restes.push("Insight à mettre en débat : " + insight);
    if(demandeur) restes.push("Demande faite par : " + demandeur + (mail ? " (" + mail + ")" : ""));
    restes.push("");
    restes.push("— Reprise de la demande client, à vérifier —");
    restes.push(String(txt || "").trim());
    b.notes = restes.join("\n");
    b.statut = "Confirmé";
    return { projet:b, champs:champs.length };
  }

  function vueImport(){
    return '<h2 class="sec">Reprendre une demande client</h2>'

      + 'préparation. Ce qui est reconnu remplit le formulaire de projet ; le texte complet est '
      + 'conservé dans « À savoir ». <b>Rien n\'est enregistré avant que vous ayez relu et validé.</b></p>'
      + '<div class="f"><label for="i_colle">Le récapitulatif</label>'
      + '<textarea id="i_colle" name="colle" rows="12" placeholder="01 — VOTRE PROJET&#10;  Votre société : …"></textarea></div>'
      + '</div>'
      + '<div class="actions"><button type="submit" class="btn lime">Remplir le formulaire</button>'
      + '<button type="button" class="btn ghost" data-go="avenir">Annuler</button></div></form>';
  }

  /* ---------- mode terrain ----------
     La même journée, réduite à ce qui sert une fois sur place :
     où aller, à quelle heure, qui appeler, quoi sortir du sac.
     Pensée pour un téléphone tenu d'une main, et imprimable telle quelle. */
  function vueTerrain(){
    var p = projet();
    if(!p){ VUE = "avenir"; return vueAvenir(); }
    var j = jourDe(p, JOUR) || (p.jours || [])[0] || {};
    if(!JOUR && j.id) JOUR = j.id;        // pour que les coches sachent où écrire
    var mtg = estMontage(p);
    var studio = j.lieu === "Notre studio";
    var adresse = studio ? (j.adresse || CFG.STUDIO || "Notre studio") : (j.adresse || "");
    var items = mtg ? [] : materielDe(p);
    var coches = j.coches || {};
    var faits = items.filter(function(i){ return coches[i.lib]; }).length;
    var caps = captations(p);

    var h = '<section class="terrain">'
      + '<div class="tbar no-print"><button class="back" data-go="fiche">← Fiche complète</button>'
      + '<button class="btn" data-print="1">Imprimer</button></div>'
      + '<h2>' + esc(p.client || "Client à préciser") + '</h2>'
      + '<p class="tsub">' + esc(p.projet || p.type || "") + ' · ' + esc(jourLong(j.date)) + '</p>';

    h += '<div class="thoraires">'
      + '<div><span class="k">' + (mtg ? "Début" : "Arrivée") + '</span><b>' + esc(j.heureEquipe || "—") + '</b></div>'
      + (mtg ? '' : '<div><span class="k">PAT</span><b>' + esc(j.heurePat || "—") + '</b></div>')
      + '<div><span class="k">Fin</span><b>' + esc(j.heureFin || "—") + '</b></div>'
      + '</div>';

    if(!mtg){
      h += '<div class="tblk"><span class="k">Où</span>'
        + '<div class="tadr">' + (adresse ? esc(adresse) : '<span class="manque">Adresse à renseigner</span>') + '</div>'
        + (adresse ? '<a class="maps no-print" target="_blank" rel="noopener"'
            + ' href="https://www.google.com/maps/search/?api=1&query='
            + encodeURIComponent(adresse) + '">Itinéraire</a>' : '')
        + (j.acces ? '<p class="tnote">' + val(j.acces) + '</p>' : '')
        + '</div>';

      h += '<div class="tblk"><span class="k">Contact sur place</span>'
        + '<div class="tcontact">'
        + (j.contactNom ? esc(j.contactNom) : '<span class="manque">À renseigner</span>')
        + (j.contactTel ? ' <a class="tel" href="tel:' + esc(telPropre(j.contactTel)) + '">'
            + esc(j.contactTel) + '</a>' : ' <span class="manque">— numéro manquant</span>')
        + '</div>'
        + (nomPrenom(j.contactNom)
            ? '<button type="button" class="lien no-print" data-vcfj="1">Ajouter aux contacts</button>' : '')
        + '</div>';
    }

    h += '<div class="tblk"><span class="k">Équipe</span><div class="tval">'
      + (equipeDe(j).length ? esc(equipeDe(j).join(", ")) : '<span class="manque">Personne d\'assigné</span>')
      + '</div></div>';

    if(caps.length){
      h += '<div class="tblk"><span class="k">À produire</span><div class="caps">'
        + caps.map(function(c){
            return '<div class="cap"><span class="q">' + esc(c.quoi) + '</span>'
                 + '<span class="mpill ' + classeMedia(c.media) + '">' + esc(c.media) + '</span></div>';
          }).join("")
        + '</div></div>';
    }

    if(j.note) h += '<div class="tblk"><span class="k">Ce jour-là</span><p class="tnote">' + val(j.note) + '</p></div>';
    if(p.notes) h += '<div class="tblk"><span class="k">À savoir</span><p class="tnote">' + val(p.notes) + '</p></div>';

    if(items.length){
      h += '<div class="tblk"><span class="k">Matériel — ' + faits + ' / ' + items.length + '</span>'
        + '<div class="checks">';
      items.forEach(function(it, i){
        var on = !!coches[it.lib];
        h += '<label class="chk' + (on ? " on" : "") + '">'
           + '<input type="checkbox" data-chk="' + i + '"' + (on ? " checked" : "") + '>'
           + '<span class="box"></span><span class="t">' + esc(libelle(it)) + '</span></label>';
      });
      h += '</div></div>';
    }

    var ctrl = controles(p, j);
    if(ctrl.length){
      h += '<div class="tblk manquant"><span class="k">Il manque encore</span><ul>'
        + ctrl.map(function(c){
            return '<li>' + esc(c.q) + ' — ' + (c.n === "vide" ? "manque" : "à confirmer") + '</li>';
          }).join("")
        + '</ul></div>';
    }

    return h + '</section>';
  }

  /* ---------- formulaire ---------- */
  function neufJour(i){
    return { id:"j" + (i+1), date:"", heureEquipe:"", heurePat:"", heureFin:"", duree:"",
             lieu:"Notre studio", adresse:"", acces:"", contactNom:"", contactTel:"", note:"",
             equipe:[], coches:{} };
  }
  function neufProjet(){
    return { client:"", projet:"", type:TYPES[0], media:MEDIAS[0], captations:[{ quoi:"", media:"" }],
             dispositif:DISPOS[0], format:FORMATS[0],
             intervenants:"", questions:"", notes:"", statut:"Confirmé", ssd:"", validant:"",
             jours:[neufJour(0)] };
  }
  function champ(l, n, v, type, hint){
    return '<div class="f"><label for="i_' + n + '">' + esc(l)
      + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>'
      + '<input type="' + (type || "text") + '" id="i_' + n + '" name="' + n + '" value="' + esc(v || "") + '"></div>';
  }
  /* lib : permet d'afficher un libellé différent de la valeur enregistrée
     (« Retouche » pour le statut « Montage » sur un projet photo). */
  function choix(l, n, opts, v, lib){
    var h = '<div class="f"><label for="i_' + n + '">' + esc(l) + '</label><select id="i_' + n + '" name="' + n + '">';
    opts.forEach(function(o){
      h += '<option value="' + esc(o) + '"' + (o === v ? " selected" : "") + '>'
         + esc(lib ? lib(o) : o) + '</option>';
    });
    return h + '</select></div>';
  }
  function zone(l, n, v, hint){
    return '<div class="f"><label for="i_' + n + '">' + esc(l)
      + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>'
      + '<textarea id="i_' + n + '" name="' + n + '">' + esc(v || "") + '</textarea></div>';
  }

  /* Qui est prévu sur une journée : les noms connus à cocher,
     plus une ligne libre pour un renfort ou un prestataire extérieur. */
  function blocEquipe(j, i){
    var noms = equipeConnue(), sel = equipeDe(j);
    var autres = sel.filter(function(n){ return noms.indexOf(n) < 0; });
    var h = '<div class="f"><label>Qui est dessus'
      + '<span class="hint">Cochez les personnes prévues ce jour-là.</span></label>';
    if(noms.length){
      h += '<div class="checks eq">';
      noms.forEach(function(n){
        var on = sel.indexOf(n) >= 0;
        h += '<label class="chk' + (on ? " on" : "") + '">'
           + '<input type="checkbox" data-eq="' + i + '" value="' + esc(n) + '"' + (on ? " checked" : "") + '>'
           + '<span class="box"></span><span class="t">' + esc(n) + '</span></label>';
      });
      h += '</div>';
    }
    h += '<input type="text" name="j' + i + '_equipeAutre" value="' + esc(autres.join(", ")) + '"'
       + ' aria-label="Quelqu\'un d\'autre sur le jour ' + (i+1) + '"'
       + ' placeholder="Quelqu\'un d\'autre — séparez les noms par une virgule"></div>';
    return h;
  }

  /* Où atterrit chaque prise : dans le film, dans l'album, ou les deux. */
  function pourVideo(p){ return captations(p).filter(function(c){ return /vid/i.test(c.media || ""); }); }
  function pourAlbum(p){ return captations(p).filter(function(c){ return /photo/i.test(c.media || ""); }); }
  function sansDest(p){ return captations(p).filter(function(c){ return !String(c.media || "").trim(); }); }
  function listeDest(items, rien){
    if(!items.length) return '<p class="rienl">' + esc(rien) + '</p>';
    return '<ul class="destl">' + items.map(function(c){
      return '<li>' + esc(c.quoi) + '</li>';
    }).join("") + '</ul>';
  }
  /* Rafraîchit les deux listes sans redessiner le formulaire,
     pour ne pas faire sauter le curseur pendant la saisie. */
  function majDest(){
    if(!BROUILLON) return;
    var v = document.getElementById("destVideo"), a = document.getElementById("destPhoto");
    if(v) v.innerHTML = listeDest(pourVideo(BROUILLON), "Rien de coché pour la vidéo.");
    if(a) a.innerHTML = listeDest(pourAlbum(BROUILLON), "Rien de coché pour l'album.");
  }

  /* Ce qu'il y a à livrer, dans le formulaire.
     Un film se monte, des photos se trient : un projet qui contient les
     deux reçoit les deux blocs, chacun avec sa date. */
  function blocLivraisonForm(b){
    var video = faitVideo(b) || estMontage(b);
    var photo = faitPhoto(b) && !estMontage(b);
    var deux  = video && photo;
    var h = "";
    if(video){
      h += '<div class="blk"><h3>Montage et livraison' + (deux ? ' — la vidéo' : '') + '</h3>'
        + '<p class="kitmeta">Ce que le monteur doit savoir'
        + (deux ? ", pour la partie filmée" : "")
        + '. Ces champs remplacent la fiche de tournage dès que le projet passe en post-production.</p>'
        + (deux ? '<div class="f"><label>Ce qui va dans la vidéo'
                  + '<span class="hint">Coché sur les lignes « À réaliser », plus haut.</span></label>'
                  + '<div class="destbox" id="destVideo">'
                  + listeDest(pourVideo(b), "Rien de coché pour la vidéo.") + '</div></div>' : '')

        + (estShooting(b)

                    "Le shooting est vendu avec un nombre de photos : indiquez-le ici.")
